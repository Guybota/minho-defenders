<!DOCTYPE html>
<html lang="pt-PT">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minho Defenders</title>
<!-- ícone: bandeira de D. Fernando (bordadura de castelos e quinas), como na capa; icon.png é este SVG a 512px -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' viewBox='0 0 64 64'><defs><path id='c' d='M-3.5 3.5V-3h1.8v2h.8V-4h1.8v3h.8v-2h1.8V3.5z' fill='%23e8c24a' stroke='%232e2419' stroke-width='.6'/><g id='q'><path d='M-4.5-5.5h9v6c0 3-2.5 4.5-4.5 5.5-2-1-4.5-2.5-4.5-5.5z' fill='%232f4a9e' stroke='%232e2419' stroke-width='.8'/><path d='M-2-3h.01M2-3h.01M0-1h.01M-2 1h.01M2 1h.01' stroke='%23f4efe2' stroke-width='1.6' stroke-linecap='round'/></g></defs><rect width='64' height='64' fill='%23b8302a'/><rect x='.75' y='.75' width='62.5' height='62.5' fill='none' stroke='%232e2419' stroke-width='1.5'/><rect x='11' y='11' width='42' height='42' fill='%23f4efe2' stroke='%232e2419' stroke-width='1.5'/><use xlink:href='%23c' x='6' y='6'/><use xlink:href='%23c' x='23' y='6'/><use xlink:href='%23c' x='41' y='6'/><use xlink:href='%23c' x='58' y='6'/><use xlink:href='%23c' x='6' y='58'/><use xlink:href='%23c' x='23' y='58'/><use xlink:href='%23c' x='41' y='58'/><use xlink:href='%23c' x='58' y='58'/><use xlink:href='%23c' x='6' y='23'/><use xlink:href='%23c' x='6' y='41'/><use xlink:href='%23c' x='58' y='23'/><use xlink:href='%23c' x='58' y='41'/><use xlink:href='%23q' x='32' y='20.5'/><use xlink:href='%23q' x='32' y='32'/><use xlink:href='%23q' x='32' y='43.5'/><use xlink:href='%23q' x='21.5' y='32'/><use xlink:href='%23q' x='42.5' y='32'/></svg>">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- app instalada: o mapa vai até ao topo do ecrã, por baixo da barra de estado -->
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/sam-js@0.3.1/dist/samjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6d8b6; --ink:#2e2419; --soft:#6b5a42; --panel:#dccaa0; --line:#8a7350;
  --red:#9b2226; --btn:#efe3c6; --btnink:#2e2419; --dis:#b9a987; --sel:#f7e7b8;
  --gold:#c9971c; --good:#6f9a3a; --shadow:rgba(46,36,25,.28);
  box-sizing:border-box;
  --sat:env(safe-area-inset-top,0px);

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1712; --ink:#ecdfc2; --soft:#b3a07c; --panel:#2a221a; --line:#6d5a3e;
    --red:#d0544a; --btn:#3a2f23; --btnink:#ecdfc2; --dis:#5a4d3c; --sel:#5a4630; --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1712; --ink:#ecdfc2; --soft:#b3a07c; --panel:#2a221a; --line:#6d5a3e;
  --red:#d0544a; --btn:#3a2f23; --btnink:#ecdfc2; --dis:#5a4d3c; --sel:#5a4630; --shadow:rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
/* sem zoom do navegador por duplo toque (iPad/telemóvel): o jogo tem o seu próprio zoom no mapa */
html,body,button,input,#modal,#panel{touch-action:manipulation;-webkit-text-size-adjust:100%}
html.big{font-size:118%}

/* ---------- Esqueleto: HUD em cima, mapa ao centro, poderes em baixo; painel desliza por cima do mapa ---------- */
body{background:var(--bg);color:var(--ink);font-family:'IM Fell English',Georgia,'Times New Roman',serif;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"hud" "stage" "abil";height:100%;height:100dvh;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#hud{grid-area:hud;padding:.4rem .55rem;border-bottom:1px solid var(--line);background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;
  box-shadow:0 2px 10px var(--shadow);position:relative;z-index:5}
#hud .top{flex:0 0 auto}
#hud .stats{flex:1 1 380px;min-width:0}
#hud .bar{flex:1 1 320px}
#stage{grid-area:stage;min-height:0;display:flex;align-items:center;justify-content:center;padding:.25rem;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at center,transparent 55%,var(--shadow) 140%)}
#abil{grid-area:abil}

/* ---------- Botões ---------- */
button{font:inherit;color:var(--btnink);background:var(--btn);border:1px solid var(--line);border-radius:4px;padding:.3rem .6rem;cursor:pointer;min-height:38px;
  transition:transform .08s ease,border-color .15s,background-color .15s,box-shadow .15s}
button:not(:disabled):hover{border-color:var(--red)}
button:not(:disabled):active{transform:translateY(1px) scale(.97)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button:disabled{color:var(--dis);cursor:not-allowed}
button.main{background:var(--red);color:#fbf1dc;border-color:var(--red);box-shadow:0 2px 0 rgba(0,0,0,.25)}
button.main:disabled{background:var(--btn);color:var(--dis);border-color:var(--line);box-shadow:none}
button[aria-pressed="true"]{background:var(--sel);border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}

/* ---------- HUD ---------- */
.top{display:flex;align-items:center;gap:.5rem}
.top h1{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.08rem;margin:0 auto 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx{font-size:1.1rem}
.stats{display:flex;gap:.35rem}
.stats .st{flex:1 1 0;min-width:0}
.stats .wxs{flex:0 0 auto;order:9;padding:.2rem .4rem;justify-content:center}
/* em retrato o título não cabe: o mapa precisa da altura */
@media (orientation:portrait),(max-width:699px){.top{display:none}}
.st{position:relative;display:flex;align-items:center;gap:.35rem;background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:.2rem .45rem .35rem;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.st .si{font-size:1.15rem;line-height:1}
.sv{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.sv small{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.sv b{font-weight:400;font-size:1.18rem;font-variant-numeric:tabular-nums;display:inline-block;transform-origin:left center;white-space:nowrap}
.meter{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(46,36,25,.18)}
.meter i{display:block;height:100%;width:0;background:var(--good);transition:width .35s ease}
#stWave .meter i{background:var(--gold)}
#stLives.low .meter i{background:var(--red)}
.st.bump b{animation:bump .38s ease-out}
.st.hurt{animation:hurt .5s ease-out}
@keyframes bump{0%{transform:scale(1.35)}100%{transform:none}}
@keyframes hurt{0%{transform:none;background:var(--red)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-1px)}100%{transform:none}}
.bar{display:flex;gap:.35rem}
.bar button{min-width:40px;padding:.3rem .45rem}
#bWave{flex:1;position:relative;overflow:hidden;font-size:1.02rem}
#bWaveF{position:absolute;left:0;bottom:0;height:4px;width:0;background:rgba(251,241,220,.75);pointer-events:none}
#bWave.pulse{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(155,34,38,.55)}100%{box-shadow:0 0 0 12px rgba(155,34,38,0)}}

/* ---------- Mapa ---------- */
canvas{display:block;touch-action:none;box-shadow:0 0 0 1px var(--line),0 6px 22px var(--shadow);border-radius:2px}
#zoomb{position:absolute;left:.45rem;top:.45rem;display:flex;flex-direction:column;gap:.3rem;z-index:2}
#zoomb button{width:38px;height:38px;padding:0;font-size:1.1rem;border-radius:50%;opacity:.92;box-shadow:0 2px 6px var(--shadow)}

/* ---------- Poderes ---------- */
#abil{display:flex;justify-content:center;gap:.5rem;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);
  box-shadow:0 -2px 10px var(--shadow);position:relative;z-index:5}
.ab{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05rem;padding:.3rem .4rem .25rem;min-height:58px;
  flex:0 1 104px;min-width:0;border-radius:14px;box-shadow:0 2px 0 var(--shadow)}
.ab .ai{font-size:1.65rem;line-height:1.1;transition:opacity .2s,filter .2s,transform .2s}
.ab:not(:disabled):not(.cd):hover .ai{transform:translateY(-2px) scale(1.08)}
.ab .an{font-size:.72rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--soft)}
.ab[aria-pressed="true"] .an{color:var(--red)}
.ab em{position:absolute;top:2px;right:5px;font-style:normal;font-size:.72rem;color:var(--soft);font-variant-numeric:tabular-nums}
.ab i{position:absolute;left:0;right:0;bottom:0;background:rgba(46,36,25,.35);height:0;pointer-events:none}
.ab.cd .ai{opacity:.45;filter:grayscale(1)}
/* poder indisponível (a recarregar ou antes da 1.ª vaga): botão inteiro desvanecido e escurecido; o contador fica legível */
#abil.open .ab.cd{opacity:.9;background:color-mix(in srgb,var(--bg) 66%,#1e160e);box-shadow:0 2px 6px var(--shadow);border-color:var(--dis)}
.ab.cd .ai{opacity:.5;filter:grayscale(1) brightness(.6)}
.ab.cd .an{opacity:.55}
.ab.cd em{color:#fbf1dc;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.ab.ready{animation:ready .6s ease-out}
@keyframes ready{0%{box-shadow:0 0 0 0 rgba(201,151,28,.8);border-color:var(--gold)}100%{box-shadow:0 0 0 10px rgba(201,151,28,0)}}

/* ---------- Painel (torre, heroína, construir) ---------- */
#panel{position:absolute;z-index:4;left:.4rem;right:.4rem;bottom:calc(env(safe-area-inset-bottom,0px) + .4rem);max-height:62%;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:1rem .65rem .7rem;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line);
  transform:translateY(calc(100% + 1rem));opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .32s cubic-bezier(.2,.9,.25,1.05),opacity .22s ease,visibility 0s linear .32s}
#panel::before{content:"";position:absolute;left:50%;top:.35rem;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line);opacity:.6}
#panel.open{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .34s cubic-bezier(.2,.9,.25,1.12),opacity .18s ease,visibility 0s}
@media (orientation:landscape) and (min-width:700px){
  #panel{left:auto;right:.5rem;top:.5rem;bottom:.5rem;width:clamp(290px,30vw,390px);max-height:none;padding-top:.7rem;transform:translateX(calc(100% + 1rem))}
  #panel::before{display:none}
  #panel.open{transform:none}
}
.cardsHud{flex:0 0 auto!important;padding:.2rem .45rem;font-size:1.05rem;letter-spacing:.05em;justify-content:center}
#panel.in>*{animation:sheet .22s ease-out backwards}
#panel.in>*:nth-child(2){animation-delay:.04s}#panel.in>*:nth-child(3){animation-delay:.08s}
@keyframes sheet{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hint{color:var(--soft);font-style:italic;line-height:1.45;max-width:60ch;margin:0}
.hint+.hint{margin-top:.35rem;font-style:normal}
.ph{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.35rem}
.ph b{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.05rem}
.ph b{margin-right:auto}
.ph button{min-height:32px;width:32px;padding:0;border-radius:50%}
/* painel da heroína minimizado: fica só o cabeçalho, para se ver o mapa e escolher onde a pôr */
#panel.min>:not(.ph){display:none}#panel.min .ph{margin-bottom:0}
.ph b small{display:block;font-size:.85em;color:var(--soft)}
.ph button.hsp{width:auto;padding:0 .6rem;border-radius:999px;gap:.3rem;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.35rem}
.build{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.35rem .2rem .4rem;line-height:1.15;border-radius:6px;box-shadow:0 2px 0 var(--shadow)}
.build .ic{font-size:1.55rem}
.build .nm{font-size:.82rem;text-align:center}
.build .cs{font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 .45rem;margin-top:.1rem}
.build:disabled{opacity:.6;box-shadow:none}
.build:disabled .cs{color:var(--red);border-color:var(--red)}
.tinfo{display:flex;gap:.3rem;flex-wrap:wrap;font-size:.88rem;margin-bottom:.45rem}
.tinfo>span{white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.05rem .5rem}
.tinfo span.warn{border-color:var(--red);color:var(--red)}
.acts{display:flex;gap:.35rem;flex-wrap:wrap}
.acts .br{flex:1 1 9rem;text-align:left;line-height:1.2}
.acts .br small{display:block;color:inherit;opacity:.85;font-size:.78rem}
.acts .up{flex:1 1 100%}
.coopbox{display:flex;gap:.4rem;margin-top:.5rem}
.coopbox input{font:inherit;flex:1;min-width:0;padding:.4rem .6rem;border:1px solid var(--line);border-radius:4px;background:var(--btn);color:var(--btnink);text-transform:uppercase;letter-spacing:.2em}

/* ---------- Janelas ---------- */
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,22,14,.62);padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem);z-index:10;animation:fade .2s ease-out}
#modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.card{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--line);max-width:32rem;width:100%;padding:1.2rem 1.3rem;border-radius:6px;
  box-shadow:0 10px 34px rgba(0,0,0,.4),inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--line);max-height:calc(100% - 1rem);overflow:auto}
.card.enter{animation:cardIn .26s ease-out}
.card.enter::after{content:"";position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(155,34,38,.08) 42%,rgba(155,34,38,.3) 50%,rgba(155,34,38,.08) 58%,transparent 100%);
  background-size:100% 220%;animation:sweep .42s ease-out forwards}
@keyframes cardIn{0%{opacity:0;transform:translateY(10px) scale(.985)}60%{opacity:1;transform:translateY(-2px)}100%{transform:none}}
@keyframes sweep{0%{background-position:0 100%;opacity:1}100%{background-position:0 0;opacity:0}}
.card h2{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.6rem;margin:0 0 .4rem;line-height:1.15}
.card h3{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.05rem;margin:.9rem 0 .35rem}
.card p{line-height:1.5;margin:.45rem 0}
.card .small{font-size:.9rem;color:var(--soft)}
.seg{display:grid;gap:.35rem;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr))}
.seg button{line-height:1.2;padding:.45rem .4rem}
.seg small{display:block;font-size:.76rem;color:var(--soft)}
.mbtns{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.mbtns button{flex:1 1 auto;min-height:44px}
.stats-end{display:grid;grid-template-columns:auto auto;gap:.2rem 1rem;font-size:.95rem;margin:.6rem 0}
.stats-end span:nth-child(odd){color:var(--soft)}
.ach{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0;border-bottom:1px dotted var(--line)}
.ach .ai{font-size:1.3rem;width:1.8rem;text-align:center}
.ach.off{opacity:.45}
.ach b{font-weight:400;display:block}
.ach small{color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:.25rem .3rem;border-bottom:1px dotted var(--line);text-align:left;font-weight:400}
th{color:var(--soft)}

/* menu principal: lista de botões grandes */
.menu{max-width:22rem;margin:0 auto}
.menu .logo{font-size:2.3rem;line-height:1;margin:.2rem 0 .1rem;letter-spacing:.02em}
.menu .logo span{display:block;color:var(--red)}
.menu .tag{margin:.1rem 0 .2rem;color:var(--soft);font-style:italic}
.menu .status{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);border-top:1px solid var(--line);padding-top:.5rem;margin:.6rem 0 .7rem}
.menu .status b{font-weight:400;color:var(--red)}
.mlist{display:flex;flex-direction:column;gap:.45rem}
.mlist>button{min-height:50px;font-size:1.12rem;text-align:left;padding:.4rem .9rem;border-left:5px solid var(--line);box-shadow:0 2px 0 var(--shadow);
  animation:cardIn .3s ease-out backwards}
.mlist>button.main{border-left-color:#fbf1dc}
.mlist>button:not(.main):hover{border-left-color:var(--red)}
.mlist>button:nth-child(2){animation-delay:.03s}.mlist>button:nth-child(3){animation-delay:.06s}.mlist>button:nth-child(4){animation-delay:.09s}.mlist>button:nth-child(5){animation-delay:.12s}
.menu .ptip{margin:.6rem 0 0;text-align:center}
.menu.endm .etitle{font-size:1.3rem;margin:.5rem 0 .3rem;line-height:1.2}.menu.endm .etitle.win{color:#2f6b3a}.menu.endm .etitle.lose{color:var(--red)}
.menu.endm .stats-end{margin:.6rem 0 .8rem;padding:.5rem .6rem;border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:8px;background:color-mix(in srgb,var(--bg) 45%,transparent)}
.menu.endm>p{margin:.3rem 0}
.menu.opts h3{margin:.7rem 0 .3rem}.menu.opts>.mlist:last-child{margin-top:.8rem}
.mlist .row{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.mlist .row button{min-height:44px}
/* língua: seletor segmentado a toda a largura, com a atual realçada */
.mlist .langs{display:grid;grid-template-columns:1fr 1fr;margin-top:.1rem}
.mlist .langs button{min-height:38px;font-size:.92rem;border-radius:0;box-shadow:0 2px 0 var(--shadow)}
.mlist .langs button:first-child{border-radius:999px 0 0 999px}.mlist .langs button:last-child{border-radius:0 999px 999px 0;border-left:0}
.version{font-size:.75rem;color:var(--soft);margin-top:.8rem;text-align:center}

/* ecrã de arranque: o pregão da praça */
.boot{font-size:1.02rem;min-height:15rem;display:flex;flex-direction:column;gap:.15rem}
.boot .bh{font-family:'IM Fell English SC',Georgia,serif;font-size:1.3rem;margin:0 0 .5rem;border-bottom:1px solid var(--line);padding-bottom:.3rem}
.boot .ln{display:flex;align-items:baseline;gap:.4rem;margin:.15rem 0;animation:lnIn .22s ease-out backwards}
.boot .ln .dots{flex:1;border-bottom:1px dotted var(--soft);transform:translateY(-.25em)}
.boot .ln b{font-weight:400;color:var(--good)}
.boot .ln.red{color:var(--red);font-size:1.25rem;margin-top:.4rem}
@keyframes lnIn{from{opacity:0;transform:translateX(-6px)}}
.bbar{height:5px;border:1px solid var(--line);border-radius:3px;margin-top:auto;overflow:hidden}
.bbar i{display:block;height:100%;width:100%;background:var(--red);animation:fill 2.1s linear backwards}
@keyframes fill{from{width:0}}

/* bênçãos e pactos */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.5rem;margin-top:.7rem}
.bcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.2rem;padding:.7rem .5rem .8rem;line-height:1.2;
  border:2px solid var(--line);border-radius:6px;background:var(--btn);box-shadow:0 3px 0 var(--shadow);animation:deal .35s ease-out backwards}
.bcard:nth-child(2){animation-delay:.08s}.bcard:nth-child(3){animation-delay:.16s}
.bcard:hover,.bcard:focus-visible{border-color:var(--red);transform:translateY(-2px)}
.bcard .ci{font-size:2rem}
.bcard em{font-style:normal;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.bcard b{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.02rem}
.bcard small{font-size:.85rem;color:var(--soft)}
.bcard.pacto{border-style:dashed;border-color:var(--red)}
.bcard.pacto em{color:var(--red)}

/* ---------- UI integrada no mapa: sem barras, só peças a flutuar por cima ---------- */
:root{--glass:color-mix(in srgb,var(--bg) 93%,transparent)}
body{grid-template-rows:minmax(0,1fr);grid-template-areas:"stage"}
#stage{padding:0}
#stage canvas{box-shadow:none;border-radius:0}
#hud{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + .5rem);left:calc(env(safe-area-inset-left,0px) + .5rem);right:calc(env(safe-area-inset-right,0px) + .5rem);
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:.4rem;padding:0;border:0;background:none;box-shadow:none;pointer-events:none}

#bWave{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);
  min-width:min(16rem,64vw);min-height:50px;border-radius:999px;font-size:1.05rem;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 2px rgba(251,241,220,.35)}
#bWave:not(:disabled):active{transform:translateX(-50%) translateY(1px) scale(.97)}
#bWave:disabled{background:var(--glass);opacity:0;pointer-events:none}/* durante a vaga o botão sai do caminho */
#abil{position:fixed;z-index:6;left:calc(env(safe-area-inset-left,0px) + .6rem);bottom:calc(env(safe-area-inset-bottom,0px) + .8rem + 72px);top:auto;transform:none;
  flex-direction:column-reverse;align-items:center;gap:.5rem;padding:0;border:0;background:none;box-shadow:none;transition:opacity .25s;pointer-events:none;
  flex-wrap:wrap;justify-content:flex-start;align-content:flex-start;max-height:calc(100vh - 9rem);max-height:calc(100dvh - 9rem)}/* telemóvel deitado: o que não cabe em altura passa para outra coluna */
#abil .ab{transition:opacity .22s ease,transform .28s cubic-bezier(.2,1.3,.4,1),border-color .15s,background-color .15s}

#abil.open .ab:nth-child(2){transition-delay:.04s}#abil.open .ab:nth-child(3){transition-delay:.08s}#abil.open .ab:nth-child(4){transition-delay:.12s}#abil.open .ab:nth-child(5){transition-delay:.16s}
#abilT{position:fixed;z-index:6;left:calc(env(safe-area-inset-left,0px) + .5rem);bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);width:64px;height:64px;min-height:0;padding:0;border-radius:50%;
  background:var(--bg);background:var(--glass);border:2px solid var(--line);box-shadow:0 4px 12px var(--shadow);transition:opacity .25s,transform .2s,border-color .15s}
#abilT .ai{font-size:1.9rem;line-height:1;display:inline-block;transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
#abilT[aria-expanded="true"]{border-color:var(--red)}

#abilT .dot{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);animation:pulse 1.4s ease-out infinite}
.ab{flex:0 0 auto;width:62px;height:62px;min-height:0;border-radius:50%;padding:.15rem;background:var(--bg);background:var(--glass);box-shadow:0 4px 12px var(--shadow)}
.ab .ai{font-size:1.55rem}
.ab .an{font-size:.58rem;letter-spacing:.02em}
.ab em{top:4px;right:50%;transform:translateX(50%);font-weight:700;color:var(--red)}
/* reparar tudo: o custo total numa etiqueta por cima do martelo */
.ab[data-ab="fix"] em{top:2px;padding:0 .3rem;border-radius:8px;background:var(--bg);color:var(--red);text-shadow:none;line-height:1.25}
.ab[data-ab="fix"] em:empty{display:none}
#zoomb{left:auto;right:calc(env(safe-area-inset-right,0px) + .5rem);top:50%;transform:translateY(-50%)}

#panel{z-index:7}
/* pausa: etiqueta discreta por cima do botão da vaga e moldura à volta do ecrã; o mapa fica limpo para escolher torres */
#pausedTag{position:fixed;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + .8rem + 60px);transform:translateX(-50%);display:flex;align-items:center;gap:.4rem;
  padding:.3rem .9rem;border-radius:999px;background:var(--glass);border:1.5px solid var(--red);color:var(--red);font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 3px 10px var(--shadow);pointer-events:none;animation:pausedPulse 1.8s ease-in-out infinite}

}

#sendT{position:fixed;z-index:6;right:calc(env(safe-area-inset-right,0px) + .5rem);bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);width:64px;height:64px;min-height:0;padding:0;border-radius:50%;

/* ================= Geometria ================= */
function mkPath(pts){const seg=[];let len=0;for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push({a,b,L,s:len});len+=L;}return{pts,seg,len};}
function posAt(P,d){
  if(d<=0){const s=P.seg[0];return{x:s.a[0],y:s.a[1],a:Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0])};}
  for(const s of P.seg){if(d<=s.s+s.L){const t=(d-s.s)/s.L;return{x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t,a:Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0])};}}
  const l=P.pts[P.pts.length-1];return{x:l[0],y:l[1],a:0};
}
function dSeg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-dx*t,py-a[1]-dy*t);}
function dPoly(x,y,p){let m=1e9;for(let i=0;i<p.length;i++)m=Math.min(m,dSeg(x,y,p[i],p[(i+1)%p.length]));return m;}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
const riverTop=x=>34+Math.sin(x/70)*7, riverBot=x=>240+Math.sin(x/55+1)*6;
/* Duelo: Portugal a sul (lado 0, o mapa deslocado DOFF para baixo) e Castela a norte (lado 1, o mapa espelhado); o Minho fica ao meio */
const DOFF=666,DH=1566,RTd=x=>900-riverBot(x),RBd=x=>riverBot(x)+DOFF;
let DUEL=null,DRAW_SIDE=0;
// corre f com o estado, o mapa, os caminhos e as bandeiras do lado i (cada lado do duelo é uma partida completa)
function withSide(i,f){if(!DUEL)return f();const d=DUEL.sides[i],o=[S,LV,PATHS,SLOTS];S=d.S;LV=d.LV;PATHS=d.PATHS;SLOTS=d.SLOTS;
  try{return f();}finally{S=o[0];LV=o[1];PATHS=o[2];SLOTS=o[3];}}
// está a correr o lado do adversário (bot ou do outro aparelho): sem sons, moedas a voar nem conquistas
const offSide=()=>!!(DUEL&&DUEL.sides[DUEL.me]&&S!==DUEL.sides[DUEL.me].S);
const inRiver=(x,y)=>DUEL?(y>RTd(x)&&y<RBd(x)):y<riverBot(x);
// perto da água (margem m); no duelo, também fora do próprio lado do rio
const nearWater=(x,y,m)=>DUEL?(y>RTd(x)-m&&y<RBd(x)+m):y<riverBot(x)+m;
const sideAt=(x,y)=>y>=RBd(x)?0:y<=RTd(x)?1:-1;
const wTop=x=>DUEL?RTd(x):riverTop(x),wBot=x=>DUEL?RBd(x):riverBot(x);
function edgeGate(p,i,extra){const a=p[i],b=p[(i+1)%p.length];return Object.assign({x:(a[0]+b[0])/2,y:(a[1]+b[1])/2,a:Math.atan2(b[1]-a[1],b[0]-a[0])},extra||{});}

/* A fortaleza fica mais para trás (longe do rio) e a estrada do desembarque até ela faz curvas:
   dá mais tempo para reagir a quem chega pelo rio. Tudo o que é da praça desce PUSH (+RW); a margem e os desembarques descem RW (o rio é mais largo). */
const PUSH=65,RW=40;
function pushBack(L){
  const D=(L.push||PUSH)+RW,done=new Set(),mv=p=>{if(!p||done.has(p))return;done.add(p);if(Array.isArray(p))p[1]+=D;else p.y+=D;};
  L.paths.forEach(P=>{if(P[1]&&!done.has(P[1])){done.add(P[1]);P[1][1]+=RW;}});L.desemb.forEach(p=>{p[1]+=RW;});
  (L.sandbars||[]).forEach(q=>{q[1]+=RW/2;});
  L.wall.forEach(mv);L.gates.forEach(mv);L.inner.forEach(q=>{mv(q.a);mv(q.b);mv(q.g);});
  L.paths.forEach(P=>P.forEach((p,i)=>{if(i>=2)mv(p);}));
  L.cand.forEach(mv);L.marks.forEach(mv);L.labels.forEach(l=>{if(!done.has(l)){done.add(l);l[2]+=D;}});
  L.south.y0=Math.min(L.south.y0+D,Math.max(L.south.y0,760));
  // curvas no primeiro troço em terra (desembarque -> praça): a maior amplitude que não bate em muralhas, rio ou outros caminhos
  const others=i=>L.paths.filter((_,j)=>j!==i).map(mkPath);
  const snake=(P,pi,si)=>{const a=P[si],b=P[si+1];if(!a||!b)return false;const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);const n=Math.floor(len/55);if(n<1)return false;
    const nx=-dy/len,ny=dx/len,op=others(pi),m=n*8;
    const pts=amp=>{const o=[];for(let i=1;i<m;i++){const t=i/m,k=amp*Math.sin(Math.PI*n*t)*Math.min(1,Math.sin(Math.PI*t)*2.2);o.push([a[0]+dx*t+nx*k,a[1]+dy*t+ny*k]);}return o;};
    // perto do fim do troço (que pode ser uma porta) é normal estar colado à muralha
    const ok=q=>q.every(([x,y])=>x>22&&x<578&&y>riverBot(x)+12&&y<880&&!inPoly(x,y,L.wall)&&(Math.hypot(x-b[0],y-b[1])<40||dPoly(x,y,L.wall)>(L.style==='bastion'?40:30))
      &&op.every(O=>O.seg.slice(1).every(sg=>dSeg(x,y,sg.a,sg.b)>26)));
    for(let amp=70;amp>=14;amp-=4){for(const sg of [1,-1]){const q=pts(amp*sg);if(ok(q)){P.splice(si+1,0,...q);return true;}}}return false;};
  // primeiro troço em terra; se não houver espaço (caminho encostado à margem), tenta o seguinte
  const V0=L.paths.map(P=>P.slice());
  L.paths.forEach((P,pi)=>{if(!snake(P,pi,1))snake(P,pi,2);});
  /* estradas laterais, do desembarque até à primeira porta: curvas ligeiras nos troços direitos e cantos arredondados.
     Nenhum ponto novo fica mais perto das bordas, do rio, da muralha, das outras estradas ou das bandeiras do que o permitido (ou do que o traçado já estava) */
  const wd=L.style==='bastion'?40:30;
  const marg=(x,y,op)=>[x-22,578-x,y-riverBot(x)-12,880-y,inPoly(x,y,L.wall)?-999:dPoly(x,y,L.wall)-wd,
    Math.min(...op.map(O=>Math.min(...O.seg.slice(1).map(sg=>dSeg(x,y,sg.a,sg.b)))))-26,Math.min(...L.cand.map(c=>Math.hypot(c[0]-x,c[1]-y)))-34];
  const fits=(q,ref,op)=>q.every((p,i)=>{const r=ref(i);return marg(p[0],p[1],op).every((v,k)=>v>=Math.min(0,r[k])-0.01);});
  L.paths.slice(0,2).forEach((P,pi)=>{
    const V=V0[pi],op=others(pi),gv=V.findIndex((p,i)=>i>1&&L.gates.some(g=>Math.hypot(g.x-p[0],g.y-p[1])<1)),last=gv<0?V.length-1:gv;
    for(let j=1;j<last;j++){const a=V[j],b=V[j+1],ia=P.indexOf(a);if(P[ia+1]!==b)continue;// este troço já tem as curvas do desembarque
      const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),n=Math.floor(len/90);if(n<1)continue;
      const nx=-dy/len,ny=dx/len,out=[];let sg=1;
      // cada barriga escolhe a sua amplitude (a maior que couber) e, de preferência, o lado contrário ao da anterior
      for(let h=0;h<n;h++){const T=[];for(let i=h?0:1;i<8;i++)T.push((h+i/8)/n);
        const base=T.map(t=>marg(a[0]+dx*t,a[1]+dy*t,op));let q=T.map(t=>[a[0]+dx*t,a[1]+dy*t]);
        find:for(let amp=20;amp>=8;amp-=4)for(const s of [sg,-sg]){const w=T.map(t=>{const k=amp*s*(1-Math.cos(2*Math.PI*(t*n-h)))/2;return[a[0]+dx*t+nx*k,a[1]+dy*t+ny*k];});
          if(fits(w,i=>base[i],op)){q=w;sg=-s;break find;}}
        out.push(...q);}
      P.splice(ia+1,0,...out);
    }
    // cantos: o vértice dá lugar a um arco (Bézier com o vértice de controlo), com o maior raio que couber
    for(let j=2;j<last;j++){const c=V[j],i=P.indexOf(c),R=Math.min(55,0.45*Math.min(Math.hypot(c[0]-V[j-1][0],c[1]-V[j-1][1]),Math.hypot(c[0]-V[j+1][0],c[1]-V[j+1][1])));
      // ponto a r do vértice ao longo da estrada, para trás (s=-1) ou para a frente (s=1)
      const walk=(r,s)=>{let k=i,p=c,left=r;for(;;){const q=P[k+s],d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d>=left)return{k,pt:[p[0]+(q[0]-p[0])*left/d,p[1]+(q[1]-p[1])*left/d]};left-=d;p=q;k+=s;}};
      for(const r of [R,R*0.7,R*0.45]){if(r<8)break;const A=walk(r,-1),B=walk(r,1),q=[A.pt];
        for(let s=1;s<6;s++){const t=s/6,u=1-t;q.push([u*u*A.pt[0]+2*u*t*c[0]+t*t*B.pt[0],u*u*A.pt[1]+2*u*t*c[1]+t*t*B.pt[1]]);}q.push(B.pt);
        const e=[A.pt,c,B.pt].map(p=>marg(p[0],p[1],op)),ref=e[0].map((_,k)=>Math.min(e[0][k],e[1][k],e[2][k]));
        if(fits(q,()=>ref,op)){P.splice(A.k,B.k-A.k+1,...q);break;}}
    }
  });
}

const LDEF={valenca:defValenca,moncao:defMoncao,ancora:defAncora,cerveira:defCerveira,melgaco:defMelgaco};
function duelLevel(id,side){
  const L=LDEF[id]();pushBack(L);
  const f=side?(y=>900-y):(y=>y+DOFF),done=new Set();
  const mv=p=>{if(!p||done.has(p))return;done.add(p);if(Array.isArray(p))p[1]=f(p[1]);else{p.y=f(p.y);if(side&&p.a!=null)p.a=-p.a;}};
  L.wall.forEach(mv);L.gates.forEach(mv);L.inner.forEach(q=>{mv(q.a);mv(q.b);mv(q.g);});
  L.paths.forEach(P=>P.forEach(mv));L.cand.forEach(mv);L.marks.forEach(mv);L.desemb.forEach(mv);
  L.labels.forEach(l=>{if(!done.has(l)){done.add(l);l[2]=f(l[2]);}});
  (L.sandbars||[]).forEach(q=>{q[1]=f(q[1]);});
  const a=f(L.south.y0),b=f(L.south.y1);L.south.y0=Math.min(a,b);L.south.y1=Math.max(a,b);L.south.ly=f(885);
  if(L.south.road)L.road=[[310,640],[322,780],[335,900]].map(([x,y])=>[x,f(y)]);
  L.coast=L.sea;L.sea=false;L.side=side;L.compass=0;
  return L;
}
let LV=null,PATHS=[],SLOTS=[];
function loadLevel(id){
  LV=typeof id==='string'?LEVELS[id]:id;PATHS=LV.paths.map(mkPath);SLOTS=[];
  const wall=LV.wall,n=wall.length;
  LV.tips.forEach(({i,name})=>{
    const t=wall[i];
    if(LV.style==='medieval'){SLOTS.push({x:t[0],y:t[1],kind:'bal',name,tower:null});return;}
    const a=wall[(i-1+n)%n],b=wall[(i+1)%n];
    const la=Math.hypot(a[0]-t[0],a[1]-t[1]),lb=Math.hypot(b[0]-t[0],b[1]-t[1]);
    const dx=(a[0]-t[0])/la+(b[0]-t[0])/lb,dy=(a[1]-t[1])/la+(b[1]-t[1])/lb,L=Math.hypot(dx,dy);
    SLOTS.push({x:t[0]+dx/L*15,y:t[1]+dy/L*15,kind:'bal',name,tower:null});
  });
  LV.cand.forEach(([x,y,inside])=>{
    if(inside){if(dPath(x,y)>=30&&!SLOTS.some(s=>Math.hypot(s.x-x,s.y-y)<36))SLOTS.push({x,y,kind:'in',name:tr('Plataforma','Platform'),tower:null});return;}
    if(dPath(x,y)<32||inPoly(x,y,wall)||dPoly(x,y,wall)<(LV.style==='medieval'?26:16)||nearWater(x,y,18))return;
    if(SLOTS.some(s=>Math.hypot(s.x-x,s.y-y)<36))return;
    if(LV.southRiver&&y>785)return;
    SLOTS.push({x,y,kind:'rev',name:LV.style==='medieval'?tr('Casa fortificada','Fortified house'):tr('Revelim','Ravelin'),tower:null});
  });
  LV.goal={x:PATHS[0].pts[PATHS[0].pts.length-1][0],y:PATHS[0].pts[PATHS[0].pts.length-1][1]};
  // o edifício mais perto do fim do caminho é o coração da praça: desenha-se por frame (06 salta-o) e mostra as vidas
  let hm=null,hd=60;LV.marks.forEach(m=>{const d=Math.hypot(m.x-LV.goal.x,m.y-LV.goal.y);if(d<hd){hd=d;hm=m;}});
  LV.marks.forEach(m=>m.heart=m===hm);
  LV.heart=hm?{x:hm.x,y:hm.y,m:hm}:{x:LV.goal.x,y:LV.goal.y-20,m:{w:24,h:24,keep:true}};
  // portas destrutíveis (também o postigo da estrada dos nadadores): distância de cada uma ao longo de cada caminho
  LV.pathGates=PATHS.map(P=>{const out=[];LV.gates.forEach((g,i)=>{
    for(const sg of P.seg){if(dSeg(g.x,g.y,sg.a,sg.b)<3){const dx=sg.b[0]-sg.a[0],dy=sg.b[1]-sg.a[1];
      out.push({i,d:sg.s+Math.max(0,Math.min(1,((g.x-sg.a[0])*dx+(g.y-sg.a[1])*dy)/(dx*dx+dy*dy)))*sg.L});break;}}});return out.sort((a,b)=>a.d-b.d);});
}
function dPath(x,y){let m=1e9;for(const P of PATHS)for(const s of P.seg.slice(1))m=Math.min(m,dSeg(x,y,s.a,s.b));return m;}

function waveDef(w){
  const g=[['peao',6+Math.round(w*2),0.8]];
  if(w>=3)g.push(['cav',Math.floor(w*1.2),0.65]);
  // atiradores logo a seguir, para chegarem às portas ainda fechadas
  if(w>=3)g.push(['arqc',Math.floor(w*0.7),0.9]);
  if(w>=4)g.push(['torre',Math.max(1,Math.floor((w-2)/2)),2.6]);
  if(w>=6)g.push(['bomb',Math.max(1,Math.floor((w-3)/3)),3.2]);
  if(w>=6)g.push(['nad',3+Math.floor(w/2),0.7]);
  if(w>=5)g.push(['esc',w-2,1.0]);
  if(w>=6&&w%2===0)g.push(['cont',Math.floor(w/3),1.1]);
  if(w>=8)g.push(['cura',Math.max(1,Math.floor((w-5)/3)),2.0]);
  if(w>=7)g.push(['ari',Math.floor((w-4)/2),2.4]);
  if(w>=12)g.push(['sap',Math.floor((w-9)/3),1.4]);
  if(w>=13)g.push(['band',Math.floor((w-10)/3),1.6]);
  if(w>=14)g.push(['gait',Math.floor((w-11)/3),1.4]);
  if(w>=15)g.push(['pereg',Math.floor((w-12)/2),1.1]);

  // em Melgaço os contrabandistas conhecem o rio de cor
  if(LV.id==='melgaco'&&w>=4)g.push(['cont',1+Math.floor(w/4),1.2]);
  if(w%10===0)g.push([BOSS[LV.id],1,3]);
  else if(w%5===0)g.push(['cap',Math.ceil(w/5),4]);
  // os tipos vêm misturados em proporção (e não aos blocos); as lendas e o Capitão Paco fecham a vaga
  const tail=g.filter(([t])=>FOES[t].boss||t==='cap'),body=g.filter(x=>!tail.includes(x)),left=body.map(x=>x[1]),q=[];
  for(let n=left.reduce((a,b)=>a+b,0);n>0;n--){let bi=-1,bv=9;body.forEach((x,i)=>{if(!left[i])return;const v=(x[1]-left[i]+0.5)/x[1];if(v<bv){bv=v;bi=i;}});
    left[bi]--;q.push({t:body[bi][0],gap:body[bi][2]});}
  if(q.length)q[q.length-1].gap=1.6;
  tail.forEach(([t,c,gap])=>{for(let i=0;i<c;i++)q.push({t,gap:i===c-1?1.6:gap});});
  return q;
}

let AC=null,master=null,sfxG=null,voxG=null,musG=null,sndMode=LS.get('snd',2),lastSay=0;const lastS={};
// volumes (0..1) escolhidos nas Opções: geral, música, efeitos e vozes
const VOL=Object.assign({master:1,music:1,sfx:1,voice:0.8},LS.get('vol',{}));
function applyVol(){if(!AC)return;const t=AC.currentTime;master.gain.setTargetAtTime(0.45*VOL.master,t,0.03);sfxG.gain.setTargetAtTime(VOL.sfx,t,0.03);voxG.gain.setTargetAtTime(VOL.voice,t,0.03);musG.gain.setTargetAtTime(VOL.music,t,0.03);}
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.45*VOL.master;master.connect(AC.destination);
    [sfxG,voxG,musG]=[VOL.sfx,VOL.voice,VOL.music].map(v=>{const g=AC.createGain();g.gain.value=v;g.connect(master);return g;});}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function tone(type,f0,f1,dur,vol,delay){const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+dur+0.03);}
function noise(dur,vol,fc,delay,dest){const t=AC.currentTime+(delay||0),len=Math.max(1,Math.floor(AC.sampleRate*dur)),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;
  const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t);}
function sfx(n){
  if(!sndMode||!AC||offSide())return;const now=performance.now();if(lastS[n]&&now-lastS[n]<(n==='arrow'||n==='hit'?90:70))return;lastS[n]=now;
  try{switch(n){
    case'arrow':tone('triangle',900,300,0.08,0.06);break;
    case'bolt':tone('sawtooth',520,120,0.12,0.06);break;
    case'boom':noise(0.4,0.45,500);tone('sine',120,40,0.4,0.25);break;
    case'oil':noise(0.3,0.12,2200);break;
    case'coin':tone('square',988,null,0.06,0.04);tone('square',1319,null,0.12,0.04,0.06);break;
    case'drum':for(let i=0;i<4;i++){tone('sine',110,50,0.25,0.45,i*0.22);noise(0.08,0.18,800,i*0.22);}break;
    case'bell':[0,0.55,1.1].forEach(d=>{tone('sine',660,null,1.4,0.16,d);tone('sine',1650,null,0.8,0.05,d);});break;
    case'hit':noise(0.05,0.1,1500);break;
    case'lose':tone('sawtooth',300,80,1.2,0.12);break;
    case'win':[523,659,784,1047].forEach((f,i)=>tone('triangle',f,null,0.45,0.13,i*0.15));break;
    case'leak':tone('square',200,100,0.25,0.06);break;
    case'smash':noise(0.2,0.4,900);tone('sine',90,40,0.25,0.3);break;
    case'horn':tone('sawtooth',220,null,0.6,0.06);tone('sawtooth',330,null,0.6,0.05,0.3);break;
    case'roar':noise(0.6,0.35,380);tone('sawtooth',140,55,0.6,0.12);break;
    case'ach':[784,988,1175].forEach((f,i)=>tone('triangle',f,null,0.25,0.1,i*0.09));break;
  }}catch(e){}
}
/* Vozes sintetizadas: o texto é convertido em sílabas e cada vogal é cantada
   com os seus formantes reais. Não depende das vozes do sistema, soa igual em todo o lado. */
const VOX={
  pt:{f0:120,dur:0.085,drift:-0.25,vol:0.20,wave:'sawtooth',reduce:true},      // soldados portugueses
  her:{f0:225,dur:0.08,drift:-0.15,vol:0.18,wave:'sawtooth',reduce:true},      // heroínas
  es:{f0:165,dur:0.062,drift:0.12,vol:0.19,wave:'sawtooth',trill:true},        // castelhanos: rápidos e exclamativos
  paco:{f0:86,dur:0.11,drift:0.05,vol:0.24,wave:'sawtooth',trill:true}          // Capitão Paco, voz grossa
};
const FORM={a:[800,1250,2600],e:[480,1900,2600],i:[300,2300,3000],o:[500,880,2500],u:[330,760,2400],y:[420,1500,2500]};
let voxUntil=0;
function strip(t){return t.toLowerCase().normalize('NFD').replace(/ã|õ/g,m=>m).replace(/[\u0300-\u036f]/g,'');}
function sylls(text){
  const t=strip(text).replace(/[^a-zç!?¡¿ ,.]/g,'');const out=[];let cons='';
  for(let i=0;i<t.length;i++){const ch=t[i];
    if('aeiou'.includes(ch)){const next=t[i+1]||' ';const end=!/[a-zç]/.test(next);out.push({c:cons,v:ch,end});cons='';}
    else if(/[a-zç]/.test(ch))cons+=ch;
    else{if(cons){out.push({c:cons,v:null,end:true});cons='';}out.push({p:ch});}}
  if(cons)out.push({c:cons,v:null,end:true});
  return out.slice(0,34);
}
function consonant(c,t,V){
  const last=c[c.length-1];
  if(/[szcçfxj]|ch/.test(c)&&!/[ptkbdg]$/.test(c)){noise(0.05,V.vol*0.55,5200,t-AC.currentTime,voxG);return 0.05;}
  if(/[ptkqbdg]/.test(last)){noise(0.018,V.vol*0.8,2600,t-AC.currentTime,voxG);return 0.025;}
  if(/r/.test(c)&&V.trill){for(let k=0;k<3;k++)noise(0.012,V.vol*0.5,1400,t-AC.currentTime+k*0.022,voxG);return 0.06;}
  if(/[mn]/.test(last)){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=V.f0;g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(V.vol*0.5,t+0.01);g.gain.linearRampToValueAtTime(0,t+0.05);o.connect(g);g.connect(voxG);o.start(t);o.stop(t+0.06);return 0.04;}
  return 0.02;
}
function vowel(v,t,dur,f0,V){
  const F=FORM[v]||FORM.a,o=AC.createOscillator();o.type=V.wave;
  o.frequency.setValueAtTime(f0*(1+(Math.random()-0.5)*0.06),t);o.frequency.linearRampToValueAtTime(f0*(1+V.drift*0.15),t+dur);
  const vib=AC.createOscillator(),vg=AC.createGain();vib.frequency.value=5.5;vg.gain.value=f0*0.02;vib.connect(vg);vg.connect(o.frequency);
  const out=AC.createGain(),pk=V.vol*5;out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(pk,t+0.012);
  out.gain.setValueAtTime(pk,t+dur*0.75);out.gain.linearRampToValueAtTime(0,t+dur);
  F.forEach((fr,i)=>{const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fr;bp.Q.value=i===0?6:9;
    const g=AC.createGain();g.gain.value=[1,0.6,0.25][i];o.connect(bp);bp.connect(g);g.connect(out);});
  out.connect(voxG);o.start(t);vib.start(t);o.stop(t+dur+0.02);vib.stop(t+dur+0.02);
}
function speak(text,who){
  const V=VOX[who],sy=sylls(text);let t=AC.currentTime+0.03;const n=sy.length;
  const exclaim=/[!¡]/.test(text),ask=/[?¿]/.test(text);let k=0;
  for(const s of sy){
    if(s.p){t+=s.p===','?0.12:s.p===' '?0.035:0.1;continue;}
    k++;const prog=k/Math.max(1,n);
    let f0=V.f0*(1+V.drift*prog);if(exclaim&&k===1)f0*=1.25;if(ask&&prog>0.75)f0*=1.3;if(exclaim&&prog>0.85)f0*=who==='es'||who==='paco'?1.2:0.9;
    if(s.c)t+=consonant(s.c,t,V);
    if(s.v){let v=s.v,d=V.dur*(0.85+Math.random()*0.3);
      if(V.reduce&&s.end&&(v==='e'||v==='o')&&n>1){v=v==='e'?'y':'u';d*=0.5;}   // vogais finais fechadas, à portuguesa
      if(s.end&&!V.reduce)d*=1.25;
      vowel(v,t,d,f0,V);t+=d;}
  }
  return t-AC.currentTime;
}
/* Falas reais: sintetizador de fala SAM, alimentado com transcrições fonéticas
   escritas à mão para português de Portugal e para castelhano. Gera o áudio no
   próprio jogo, por isso soa igual em todos os dispositivos. */

  'Conseguiste! Viva Portugal!':'KOWNSIXGIY5SHTIX. VIY5VAH PUWRTUWGAA5L!'
};
const SAMV={pt:{speed:74,pitch:70,throat:118,mouth:132},her:{speed:78,pitch:40,throat:150,mouth:150},
            es:{speed:62,pitch:56,throat:128,mouth:140},paco:{speed:88,pitch:96,throat:100,mouth:110}};
const samCache=new Map();
function samBuffer(text,who){
  const key=who+'|'+text;if(samCache.has(key))return samCache.get(key);
  let out=null;
  try{
    const ph=PH[text];
    // em inglês, as falas portuguesas traduzidas são lidas pelo leitor inglês do próprio SAM
    const en=!ph&&LANG==='en'&&(who==='pt'||who==='her');
    if((ph||en)&&typeof window.SamJs==='function'){
      const sam=new window.SamJs(Object.assign({phonetic:!!ph},SAMV[who]));
      const raw=ph?sam.buf32(ph.replace(/!/g,'.'),true):sam.buf32(text.replace(/[«»“”—¤…]/g,'').replace(/’/g,"'").replace(/!/g,'.'),false);
      if(raw&&raw.length){
        let mean=0;for(let i=0;i<raw.length;i++)mean+=raw[i];mean/=raw.length;
        let pk=0;for(let i=0;i<raw.length;i++)pk=Math.max(pk,Math.abs(raw[i]-mean));
        const g=pk>0?0.7/pk:1,ab=AC.createBuffer(1,raw.length,22050),d=ab.getChannelData(0);
        for(let i=0;i<raw.length;i++)d[i]=(raw[i]-mean)*g;
        out=ab;
      }
    }
  }catch(e){out=null;}
  samCache.set(key,out);return out;
}
function say(text,lang,force,who){
  if(sndMode<2||!AC||offSide())return;
  const now=AC.currentTime;
  if(!force&&(now<voxUntil+1.5))return;
  who=who||(lang==='es-ES'?'es':'pt');
  if(S&&S.coop&&!S.remote)S.voiceQ.push([text,who]);
  try{
    const buf=samBuffer(text,who);
    if(buf){const src=AC.createBufferSource();src.buffer=buf;const g=AC.createGain();g.gain.value=0.85;src.connect(g);g.connect(voxG);src.start();voxUntil=now+buf.duration;}
    else{const d=speak(text,who);voxUntil=now+d;}
  }catch(e){}
}
/* ================= Música medieval (procedural, sem ficheiros) ================= */
// duas peças originais em modo dórico: uma cantiga calma para o menu e uma dança (estampida) para o jogo, com transições suaves
const MUS={on:LS.get('mus',1)!==0,want:null,cur:null,bus:null,tr:{},timer:null,vol:-1};
const mf=m=>440*Math.pow(2,(m-69)/12);
function musOut(){if(MUS.bus)return MUS.bus;
  const bus=AC.createGain();bus.gain.value=0;const dry=AC.createGain();dry.gain.value=0.85;
  // sala de pedra: reverberação curta feita com ruído a decair
  const len=Math.floor(AC.sampleRate*2),ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  const cv=AC.createConvolver();cv.buffer=ir;const wet=AC.createGain();wet.gain.value=0.32;
  bus.connect(dry);dry.connect(musG);bus.connect(cv);cv.connect(wet);wet.connect(musG);
  return MUS.bus=bus;}
function mEnv(out,t,a,dur,vol,rel){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);
  g.gain.setValueAtTime(vol,t+Math.max(a,dur-rel));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(out);return g;}
function mOsc(type,f,t,dur,dest,det){const o=AC.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.connect(dest);o.start(t);o.stop(t+dur+0.05);return o;}
// alaúde / harpa: dedilhado que abre e fecha o filtro
function iLute(out,m,t,dur,vol){const f=AC.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.setValueAtTime(3200,t);f.frequency.exponentialRampToValueAtTime(500,t+Math.min(0.9,dur));
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  f.connect(g);g.connect(out);mOsc('triangle',mf(m),t,dur,f);mOsc('sawtooth',mf(m),t,dur,f,6);}
// flauta de bisel com vibrato que entra devagar
function iFlute(out,m,t,dur,vol){const g=mEnv(out,t,0.06,dur,vol,0.08),v=AC.createOscillator(),vg=AC.createGain();v.frequency.value=5.2;vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(mf(m)*0.006,t+0.35);
  v.connect(vg);const o=mOsc('sine',mf(m),t,dur,g);vg.connect(o.frequency);v.start(t);v.stop(t+dur+0.05);const h=AC.createGain();h.gain.value=0.18;h.connect(g);const o2=mOsc('triangle',mf(m)*2,t,dur,h);vg.connect(o2.frequency);}
// charamela: palheta nasalada
function iShawm(out,m,t,dur,vol){const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1300;f.Q.value=0.8;const g=mEnv(out,t,0.025,dur,vol,0.05);f.connect(g);
  mOsc('square',mf(m),t,dur,f);mOsc('sawtooth',mf(m),t,dur,f,-7);}
// bordão (sanfona): nota longa e grave
function iDrone(out,m,t,dur,vol){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=520;const g=mEnv(out,t,0.5,dur,vol,0.6);f.connect(g);mOsc('sawtooth',mf(m),t,dur,f);mOsc('sawtooth',mf(m+7),t,dur,f,4);}
function iDrum(out,t,vol,low){const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);g.connect(out);
  const o=AC.createOscillator();o.frequency.setValueAtTime(low?95:150,t);o.frequency.exponentialRampToValueAtTime(low?48:80,t+0.2);o.connect(g);o.start(t);o.stop(t+0.3);
  const len=Math.floor(AC.sampleRate*0.06),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1200;const ng=AC.createGain();ng.gain.value=vol*0.5;s.connect(f);f.connect(ng);ng.connect(out);s.start(t);}
function iJingle(out,t,vol){const len=Math.floor(AC.sampleRate*0.07),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6500;const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(out);s.start(t);}
// pautas: [nota midi (0 = pausa), duração em colcheias]
const CH={Dm:[50,57,62,65],C:[48,55,60,64],Am:[45,52,57,60],F:[41,48,53,57],G:[43,50,55,59],Em:[40,47,52,55],D:[50,57,62,66]};
const SONGS={
  menu:{bpm:84,bar:6,// cantiga em 6/8, ré dórico
    mel:[[74,3],[76,1],[77,2],[76,2],[74,2],[72,2],[74,3],[69,3],[72,2],[69,2],[67,2],[69,2],[72,2],[74,2],[76,3],[72,3],[74,2],[72,1],[69,1],[67,2],[69,6],
         [77,2],[79,2],[81,2],[79,3],[77,3],[76,2],[77,2],[79,2],[77,3],[76,1],[74,2],[72,2],[74,2],[76,2],[74,2],[72,2],[69,2],[72,3],[76,3],[74,6]],
    ch:['Dm','C','Dm','C','F','C','G','Am','F','C','C','Dm','Am','Dm','Am','Dm'],
    play(out,st,t,e,loop){const b=Math.floor(st/6),i=st%6,c=CH[this.ch[b%16]];
      iLute(out,[c[0],c[1],c[2],c[3],c[2],c[1]][i]+(i===0?0:12),t,e*2.6,i===0?0.07:0.045);

  game:{bpm:132,bar:8,// estampida em lá dórico
    mel:[[69,1],[69,1],[76,2],[74,1],[72,1],[71,1],[72,1],[74,2],[71,2],[67,2],[71,2],[69,1],[69,1],[76,2],[74,1],[72,1],[71,1],[72,1],[71,2],[69,4],[0,2],
         [72,1],[74,1],[76,2],[79,2],[76,2],[78,2],[76,1],[74,1],[76,4],[79,1],[78,1],[76,1],[74,1],[72,2],[71,2],[69,6],[0,2],
         [76,2],[76,1],[78,1],[79,2],[76,2],[74,2],[74,1],[76,1],[78,2],[74,2],[72,2],[72,1],[74,1],[76,2],[72,2],[71,2],[67,2],[69,2],[71,2],
         [76,2],[76,1],[78,1],[79,2],[76,2],[74,2],[74,1],[76,1],[78,2],[74,2],[72,1],[74,1],[76,1],[72,1],[71,2],[67,2],[69,6],[0,2]],
    ch:['Am','G','Am','Am','C','D','G','Am','Em','D','C','G','Em','D','G','Am'],
    play(out,st,t,e,loop){const b=Math.floor(st/8),i=st%8,c=CH[this.ch[b%16]];
      if(i===0||i===4)iLute(out,c[0],t,e*1.8,0.07);else if(i===2||i===6)iLute(out,c[1],t,e*1.4,0.05);
      if(i===0)iDrum(out,t,0.16,true);else if(i===3)iDrum(out,t,0.07);else if(i===4)iDrum(out,t,0.12,true);else if(i===6||i===7)iDrum(out,t,0.05);
      if(i%2)iJingle(out,t,0.035);
      if(st%32===0)iDrone(out,45,t,e*32+0.3,0.03);
      return loop%2?iFlute:iShawm;}}
};
for(const k in SONGS){const s=SONGS[k];s.notes=[];let p=0;for(const[m,d]of s.mel){if(m)s.notes[p]=[m,d];p+=d;}s.len=p;}
function musTrack(name){const def=SONGS[name],g=AC.createGain();g.gain.value=0.0001;g.connect(musOut());
  return{name,def,g,step:0,loop:0,next:AC.currentTime+0.15,stopAt:0};}
function musStep(tr){const d=tr.def,e=60/d.bpm/2,st=tr.step%d.len;
  const inst=d.play(tr.g,st,tr.next,e,tr.loop),n=d.notes[st];
  if(n)inst(tr.g,n[0],tr.next,n[1]*e*0.95,inst===iLute?0.09:inst===iShawm?0.05:0.07);
  tr.next+=e;tr.step++;if(tr.step%d.len===0)tr.loop++;}
function musTick(){if(!AC)return;const now=AC.currentTime;
  const target=MUS.on&&sndMode>0&&!document.hidden?(MUS.cur==='game'&&S&&(S.paused||S.over)?0.35:1):0;
  if(target!==MUS.vol&&MUS.bus){MUS.vol=target;MUS.bus.gain.cancelScheduledValues(now);MUS.bus.gain.setTargetAtTime(target*0.9,now,0.4);}
  for(const k in MUS.tr){const tr=MUS.tr[k];
    if(tr.stopAt&&now>tr.stopAt){tr.g.disconnect();delete MUS.tr[k];continue;}
    if(tr.next<now-0.2)tr.next=now+0.05;// separador em segundo plano: salta em vez de despejar notas atrasadas
    if(target>0)while(tr.next<now+0.3)musStep(tr);else tr.next=Math.max(tr.next,now);}}
// muda de peça com uma transição cruzada
function setMusic(name){MUS.want=name;if(!AC||AC.state!=='running')return;musOut();if(MUS.cur===name&&MUS.tr[name]&&!MUS.tr[name].stopAt)return;
  const now=AC.currentTime,old=MUS.cur&&MUS.tr[MUS.cur];
  if(old){old.g.gain.cancelScheduledValues(now);old.g.gain.setValueAtTime(Math.max(0.0001,old.g.gain.value),now);old.g.gain.exponentialRampToValueAtTime(0.0001,now+2.2);old.stopAt=now+2.4;delete MUS.tr[MUS.cur];MUS.tr[MUS.cur+'_out'+now]=old;}
  MUS.cur=name;if(!name)return;
  const tr=musTrack(name);tr.next=now+(old?0.9:0.1);tr.g.gain.setValueAtTime(0.0001,now);tr.g.gain.exponentialRampToValueAtTime(1,now+(old?3:1.5));MUS.tr[name]=tr;
  if(!MUS.timer)MUS.timer=setInterval(musTick,90);musTick();}

function launchBoat(pp){
  const w=Math.max(1,S.wave),n=S.cOpen?3:2,p=pp!=null?pp:S.side++%n;
  // a partir da vaga 10 cada barco traz dois de apoio (curandeiro, porta-estandarte, gaiteiro): da fila ou de reforço (no duelo não)
  const sup=w>=10&&pp==null?['cura',...(w>=13?['band']:[]),...(w>=14?['gait']:[])]:null,res=sup?2:0;
  const first=FSZ[S.queue[0].t]+res,av=BK.filter(k=>BOATS[k].from<=w);
  let x=Math.random()*av.reduce((a,k)=>a+BOATS[k].w(w),0),k=av[0];
  for(const kk of av){x-=BOATS[kk].w(w);if(x<=0){k=kk;break;}}
  if(BOATS[k].cap<first)k=BK.find(kk=>BOATS[kk].cap>=first)||'galeao';
  // carrega o que couber entre os próximos da fila (assim os barcos vêm mistos)
  const B=BOATS[k],load=[];let used=0,gap=0;
  if(sup)for(let n=0;n<2;n++){const i=S.queue.findIndex(q=>sup.includes(q.t));let t;
    if(i>=0){t=S.queue[i].t;gap+=S.queue[i].gap;S.queue.splice(i,1);}else t=sup[Math.floor(Math.random()*sup.length)];load.push(t);used+=FSZ[t];}
  for(let i=0;i<S.queue.length&&i<48&&used<B.cap;){const q=S.queue[i],z=FSZ[q.t];
    if(z&&used+z<=B.cap){load.push(q.t);used+=z;gap+=q.gap;S.queue.splice(i,1);}else i++;}
  const land=PATHS[p].seg[0].L,b={id:++EID,k,p,d:0,stop:Math.max(4,land-B.L/2+5),st:'go',al:0,uT:0,mv:true,x:0,y:0,a:0,o:0,
    lane:[0,1,-1,2,-2].find(l=>!S.boats.some(o=>o.p===p&&o.lane===l))||0};// faixa: com a margem ocupada, atraca ao lado
  const es=load.map(t=>{const e=mkFoe(t,p,0);e.ride=b.id;return e;});
  seatBoat(b,es);es.forEach(e=>{S.enemies.push(e);if(e.f.boss)announce(e.f);});

function seatBoat(b,es){
  const B=BOATS[b.k],h=B.L/2,two=B.B>=16;let x=h-9,col=0,rowW=0;
  es.sort((a,c)=>FSZ[c.t]-FSZ[a.t]).forEach(e=>{const sp=e.r*1.25;

    else{e.sx=x-sp*0.5;e.sy=(col?1:-1)*B.B*0.2;rowW=Math.max(rowW,sp+1);col^=1;if(!col){x-=rowW;rowW=0;}}});
  const top=h-9,lo=-h+6,mn=Math.min(...es.map(e=>e.sx-e.r*0.5));
  if(mn<lo)es.forEach(e=>{e.sx=top-(top-e.sx)*(top-lo)/(top-mn);});

}

      if(p.tg&&!p.tg.dead){p.lx=p.tg.x;p.ly=p.tg.y;}
      const dx=p.lx-p.x,dy=p.ly-p.y,d=Math.hypot(dx,dy),st=p.sp*dt;p.ang=Math.atan2(dy,dx);
      if(d<=st+4){p.done=true;
        if(p.split){let n=0;for(const o of S.enemies){if(n>=2)break;if(o!==p.tg&&!o.dead&&Math.hypot(o.x-p.lx,o.y-p.ly)<45){hurt(o,p.dmg*0.5,false,'hero',true);n++;}}}
        if(p.tg&&!p.tg.dead&&!p.tg.under){hurt(p.tg,p.dmg,p.pierce,p.src);if(p.burn&&!p.tg.dead){p.tg.burnT=p.burn.t;p.tg.burnD=p.burn.dps;p.tg.burnSrc=p.src;}
          if(p.stun&&!p.tg.dead)p.tg.stunT=Math.max(p.tg.stunT,p.tg.f.boss?p.stun/2:p.stun);}}
      else{p.x+=dx/d*st;p.y+=dy/d*st;}
    }
  }
  for(const f of S.fx){
    if(f.k==='rain'){const hitsDue=Math.floor(f.t/0.4);while(f.hits<Math.min(3,hitsDue)){f.hits++;
      for(const e of S.enemies)if(!e.dead&&!e.under&&Math.hypot(e.x-f.x,e.y-f.y)<=f.r)hurt(e,30+S.wave*2.5,false,null,true);sfx('arrow');}}
  }
  S.proj=S.proj.filter(p=>!p.done);
  updateEproj(dt);
  S.enemies=S.enemies.filter(e=>!e.dead);
  if(S.born.length){for(const c of S.born){const q=posAt(PATHS[c.p],c.d);c.a=q.a;c.x=q.x;c.y=q.y;S.enemies.push(c);}S.born=[];}
  if(!S.spawning&&!S.enemies.length&&S.pendingBonus>0){
    addGold('all',S.pendingBonus);if(!S.hero.dead)heroXP(8+S.wave);
    S.texts.push({x:W/2,y:470,s:tr('Vaga repelida! +','Wave repelled! +')+S.pendingBonus+' ¤',t:0,T:2.2,big:true});S.pendingBonus=0;sfx('coin');saveGame();
    if(S.wave%3===0&&(S.infinite||S.wave<MAXW)){if(S.bot)botCard();else offerCards();}}
  if(!S.infinite&&S.wave>=MAXW&&!S.spawning&&!S.enemies.length&&!S.over){endGame(true);return;}
  ageVisuals(dt);
}
function ageVisuals(dt){
  for(const f of S.fx)f.t+=dt;S.fx=S.fx.filter(f=>f.t<f.T);
  for(const x of S.texts)x.t+=dt;S.texts=S.texts.filter(x=>x.t<x.T);
  for(const G of S.gates)if(G.hitT>0)G.hitT-=dt;
  for(const p of S.parts){p.t+=dt;
    if(p.k==='smoke'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=8*dt;}
    else if(p.k==='flag'){p.vy+=90*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
    else if(p.k==='bread'){p.vy+=260*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    else if(p.k==='chip'){p.vy+=320*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.97;p.rot+=p.vr*dt;}}
  S.parts=S.parts.filter(p=>p.t<p.T);
  for(const t of S.towers){if(t.kick>0)t.kick=Math.max(0,t.kick-dt*7);if(t.hitT>0)t.hitT-=dt;if(t.broken&&!(t.fixT>0)&&Math.random()<dt*2)smoke(t.x+(Math.random()-0.5)*14,t.y-4,1);}
  S.comboPop=Math.max(0,S.comboPop-dt*4);
  // o coração a arder deita fumo
  if(S.started&&!S.over&&LV.heart){const st=heartStage();if(st>=2&&Math.random()<dt*(st===3?5:2.5))smoke(LV.heart.x+(Math.random()-0.5)*14,LV.heart.y-12,1);}
}

}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function polyPath(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath();}
function label(c,s,x,y,size,italic,col){

  c.lineWidth=5;c.lineJoin='round';c.strokeStyle='rgba(236,224,194,.95)';c.strokeText(s,x,y);c.fillStyle=col||'#2e2419';c.fillText(s,x,y);

// ocupação do fundo: caixas já usadas por casas, árvores e vinhas (nada se sobrepõe)
let OCC=[];
const occFree=(x0,y0,x1,y1)=>!OCC.some(b=>x0<b[2]&&x1>b[0]&&y0<b[3]&&y1>b[1]);
/* casas em alçado, como as capelas: paredes caiadas ou de granito, telhado de telha (ou colmo) tracejado, porta e janelas.
   Variantes: casa térrea, sobrado de dois pisos, casa de granito com chaminé, casa com alpendre, palheiro de colmo e espigueiro. */
const HWALL=['#ece3cb','#e2d3ae','#d9c08a','#e6d9bf'],HROOF=['#b5563a','#a4583a','#b76d45','#9a4a30'];
function house(c,r,x,y,k0){
  const v=r(),kind=v<0.3?0:v<0.48?1:v<0.64?2:v<0.78?3:v<0.9?4:5,k=(k0||1)*(0.8+r()*0.3),fl=r()<0.5?-1:1;
  const w=(kind===1?13:kind===3?17:kind===5?12:14)*k,hw=w/2+(kind===3?1:2)*k,top=(kind===1?20:kind===5?15:14)*k;
  if(!occFree(x-hw,y-top,x+hw,y+3*k))return false;OCC.push([x-hw,y-top,x+hw,y+3*k]);
  const wall=kind===2?'#b3aa94':HWALL[Math.floor(r()*HWALL.length)],roof=kind===4?'#b08850':HROOF[Math.floor(r()*HROOF.length)];
  c.save();c.translate(x,y);c.scale(k*fl,k);c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=0.9;
  c.fillStyle='rgba(46,36,25,.22)';c.beginPath();c.ellipse(2,1.2,9,2,0,0,Math.PI*2);c.fill();
  const roofT=(x0,x1,yb,yt,col)=>{// telhado de quatro águas visto de frente: trapézio com riscos de telha
    c.fillStyle=col;c.beginPath();c.moveTo(x0-1.2,yb);c.lineTo(x1+1.2,yb);c.lineTo(x1-2,yt);c.lineTo(x0+2,yt);c.closePath();c.fill();c.stroke();
    c.strokeStyle=col==='#b08850'?'rgba(90,60,20,.55)':'rgba(60,20,10,.45)';c.lineWidth=0.5;c.beginPath();
    for(let xx=x0+1;xx<x1;xx+=col==='#b08850'?1.4:2.2){c.moveTo(xx,yb);c.lineTo(xx+(xx<(x0+x1)/2?0.8:-0.8),yt);}c.stroke();c.strokeStyle=INK;c.lineWidth=0.9;
    c.beginPath();c.moveTo(x0+2,yt);c.lineTo(x1-2,yt);c.lineWidth=1.3;c.stroke();c.lineWidth=0.9;};
  const door=(dx,h)=>{c.fillStyle='#6e4b2a';c.beginPath();c.moveTo(dx-1.3,0);c.lineTo(dx-1.3,-h+1.3);c.arc(dx,-h+1.3,1.3,Math.PI,0);c.lineTo(dx+1.3,0);c.closePath();c.fill();c.lineWidth=0.6;c.stroke();c.lineWidth=0.9;};
  const win=(wx,wy,lit)=>{c.fillStyle='#3a3025';c.fillRect(wx-1,wy-1.2,2,2.4);if(lit){c.fillStyle='rgba(232,194,74,.5)';c.fillRect(wx-0.4,wy-0.8,0.8,1.6);}};
  const stones=(x0,x1,y0,y1)=>{c.strokeStyle='rgba(46,36,25,.3)';c.lineWidth=0.4;c.beginPath();for(let yy=y0+2;yy<y1;yy+=2.2){c.moveTo(x0,yy);c.lineTo(x1,yy);
    for(let xx=x0+((yy|0)%2?1:2.2);xx<x1;xx+=2.6){c.moveTo(xx,yy);c.lineTo(xx,yy-2.2);}}c.stroke();c.strokeStyle=INK;c.lineWidth=0.9;};
  if(kind===0){// casa térrea
    c.fillStyle=wall;c.fillRect(-6,-7,12,7);c.strokeRect(-6,-7,12,7);door(-2.5,4.6);win(2.6,-3.8,r()<0.3);roofT(-6,6,-7,-13,roof);

    c.strokeStyle='#6e4b2a';c.lineWidth=0.8;c.beginPath();c.moveTo(-5.5,-7);c.lineTo(5.5,-7);c.moveTo(-5.5,-8.6);c.lineTo(5.5,-8.6);for(let xx=-4.5;xx<5;xx+=1.5){c.moveTo(xx,-7);c.lineTo(xx,-8.6);}c.stroke();c.strokeStyle=INK;c.lineWidth=0.9;
    roofT(-5.5,5.5,-13,-19,roof);
  }else if(kind===2){// casa de granito com chaminé
    c.fillStyle=wall;c.fillRect(-6,-7,12,7);stones(-6,6,-7,0);c.strokeRect(-6,-7,12,7);door(2.4,4.8);win(-2.6,-3.8);
    c.fillStyle='#9a917c';c.fillRect(-4.5,-14,2.2,4);c.strokeRect(-4.5,-14,2.2,4);roofT(-6,6,-7,-12.5,roof);c.fillStyle='#9a917c';c.fillRect(-4.5,-14,2.2,2);
  }else if(kind===3){// casa com alpendre (anexo mais baixo ao lado)
    c.fillStyle=wall;c.fillRect(-7.5,-8,9,8);c.strokeRect(-7.5,-8,9,8);door(-3,4.8);win(-0.8,-5);roofT(-7.5,1.5,-8,-13.5,roof);
    c.fillStyle=HWALL[1];c.fillRect(1.5,-4.8,6,4.8);c.strokeRect(1.5,-4.8,6,4.8);c.fillStyle='#3a3025';c.fillRect(3,-3.6,3,3.6);
    c.strokeStyle='#6e4b2a';c.lineWidth=0.7;c.beginPath();c.moveTo(4.5,-3.6);c.lineTo(4.5,0);c.stroke();c.strokeStyle=INK;c.lineWidth=0.9;
    c.fillStyle=roof;c.beginPath();c.moveTo(1,-4.8);c.lineTo(8.3,-4.8);c.lineTo(7.2,-7.4);c.lineTo(1,-8.6);c.closePath();c.fill();c.stroke();
  }else if(kind===4){// palheiro com telhado de colmo
    c.fillStyle=wall;c.fillRect(-5.5,-5.5,11,5.5);stones(-5.5,5.5,-5.5,0);c.strokeRect(-5.5,-5.5,11,5.5);c.fillStyle='#6e4b2a';c.fillRect(-1.6,-4,3.2,4);c.strokeRect(-1.6,-4,3.2,4);
    c.fillStyle=roof;c.beginPath();c.moveTo(-7,-5.5);c.quadraticCurveTo(0,-6.5,7,-5.5);c.quadraticCurveTo(5,-12,0,-13.5);c.quadraticCurveTo(-5,-12,-7,-5.5);c.closePath();c.fill();c.stroke();
    c.strokeStyle='rgba(90,60,20,.6)';c.lineWidth=0.5;c.beginPath();for(let xx=-5.5;xx<6;xx+=1.4){c.moveTo(xx,-5.8);c.quadraticCurveTo(xx*0.7,-9,xx*0.35,-12.6);}c.stroke();
  }else{// espigueiro: celeiro de granito sobre pés, com cruz no topo
    c.fillStyle='#b3aa94';[-4.5,4.5].forEach(px=>{c.fillRect(px-1,-4,2,4);c.strokeRect(px-1,-4,2,4);c.beginPath();c.ellipse(px,-4.3,1.8,0.7,0,0,Math.PI*2);c.fill();c.stroke();});
    c.fillStyle='#c7bda6';c.fillRect(-6,-10.5,12,6);c.strokeRect(-6,-10.5,12,6);
    c.strokeStyle='rgba(46,36,25,.55)';c.lineWidth=0.5;c.beginPath();for(let xx=-4.5;xx<5;xx+=1.5){c.moveTo(xx,-10);c.lineTo(xx,-5);}c.stroke();c.strokeStyle=INK;c.lineWidth=0.9;
    roofT(-6,6,-10.5,-12.8,'#9a917c');
    c.strokeStyle='#5a4630';c.lineWidth=0.9;c.beginPath();c.moveTo(4,-12.8);c.lineTo(4,-15.5);c.moveTo(3,-14.6);c.lineTo(5,-14.6);c.moveTo(-4,-12.8);c.lineTo(-4,-14.6);c.stroke();
  }

}
/* ---- enfeites do campo: árvores, pinheiros, arbustos, vinhas e pedras, em traço de gravura ---- */
// árvores de perfil, como nos mapas antigos: tronco, copa em lóbulos com contorno a tinta, sombra tracejada e brilho
const LOBES=[[0,-11,4.6],[-4.5,-8.5,4],[4.5,-8.5,4],[-5,-4,3.6],[5,-4,3.8],[0,-5,4.4],[-1.5,-13.5,3]];
function crown(c,x,y,k,L,fill){// contorno da união: primeiro os lóbulos com traço grosso, depois o recheio por cima
  c.strokeStyle='#2e2a18';c.lineWidth=1.8;c.beginPath();L.forEach(([dx,dy,r])=>{c.moveTo(x+(dx+r)*k,y+dy*k);c.arc(x+dx*k,y+dy*k,r*k,0,Math.PI*2);});c.stroke();
  c.fillStyle=fill;c.beginPath();L.forEach(([dx,dy,r])=>{c.moveTo(x+(dx+r)*k,y+dy*k);c.arc(x+dx*k,y+dy*k,r*k,0,Math.PI*2);});c.fill();}
function tree(c,x,y,k,r){
  c.fillStyle='rgba(70,55,30,.22)';c.beginPath();c.ellipse(x+4*k,y+1*k,8*k,2.6*k,0,0,Math.PI*2);c.fill();

  // sombra do lado direito/baixo, em tracejado de gravura
  c.save();c.beginPath();LOBES.forEach(([dx,dy,rr])=>{c.moveTo(x+(dx+rr)*k,y+dy*k);c.arc(x+dx*k,y+dy*k,rr*k,0,Math.PI*2);});c.clip();
  c.fillStyle='rgba(40,50,20,.28)';c.beginPath();c.arc(x+5*k,y-3*k,7*k,0,Math.PI*2);c.fill();
  c.strokeStyle='rgba(30,36,14,.55)';c.lineWidth=0.6;c.beginPath();for(let t=-2;t<9;t+=2.2){c.moveTo(x+t*k,y-1*k);c.lineTo(x+(t+5)*k,y-8*k);}c.stroke();
  c.fillStyle='rgba(215,222,160,.75)';c.beginPath();c.arc(x-2.8*k,y-12*k,2*k,0,Math.PI*2);c.arc(x-5.5*k,y-8.5*k,1.3*k,0,Math.PI*2);c.fill();c.restore();
}
function pine(c,x,y,k){

  c.fillStyle='#6e4b2a';c.strokeStyle='#2e2419';c.lineWidth=0.8;c.fillRect(x-1*k,y-4*k,2*k,5*k);c.strokeRect(x-1*k,y-4*k,2*k,5*k);

    c.fillStyle='#4f6a3a';c.strokeStyle='#22301a';c.lineWidth=1;c.beginPath();c.moveTo(x-w*k,y+ty*k);c.lineTo(x,y+(ty-h*1.5)*k);c.lineTo(x+w*k,y+ty*k);c.quadraticCurveTo(x,y+(ty+1.4)*k,x-w*k,y+ty*k);c.fill();c.stroke();

}
function bush(c,x,y,k){

function rock(c,x,y,k,r){c.fillStyle='#b3aa94';c.strokeStyle='#5a5240';c.lineWidth=0.8;c.beginPath();c.ellipse(x,y,3.5*k,2.6*k,r()*3,0,Math.PI*2);c.fill();c.stroke();}
// onde se pode pôr um enfeite: fora de água, estradas, muralhas, bandeiras, edifícios, legendas e do que já lá está
function decoOK(x,y,rad,labs){
  if(nearWater(x,y,10+rad)||(LV.southRiver&&y>782-rad))return false;
  if(DUEL&&sideAt(x,y)!==LV.side)return false;
  if(x<EX0+14+rad||x>EX1-14-rad||y<EY0+14+rad||y>EY1-14-rad)return false;
  if(dPath(x,y)<16+rad||inPoly(x,y,LV.wall)||dPoly(x,y,LV.wall)<(LV.style==='bastion'?38:24)+rad)return false;
  if(SLOTS.some(s=>Math.hypot(s.x-x,s.y-y)<22+rad)||LV.marks.some(m=>Math.hypot(m.x-x,m.y-y)<Math.max(m.w,m.h)+rad+6))return false;
  if(Math.hypot(x-540,y-845)<50+rad)return false;
  if(labs.some(b=>x>b[0]-rad&&x<b[2]+rad&&y>b[1]-rad&&y<b[3]+rad))return false;
  return occFree(x-rad,y-rad,x+rad,y+rad);
}
function drawDeco(c,X0,X1,Y0,Y1){
  const r=rng(311+LV.id.length*41),lab=(s,x,y,z)=>{const w=s.length*z*0.3+8;return[x-w,y-z,x+w,y+z];};
  const labs=[...LV.labels.map(([s,x,y,z])=>lab(s,x,y,z)),...LV.desemb.map(([x,y])=>lab('Desembarque',x,y,11)),lab('Rio Minho',150,120,22),
    ...(LV.across?[lab(LV.across,130,18,15)]:[]),...(LV.south.label?[lab(LV.south.label,LV.southRiver?300:200,LV.southRiver?790:885,13)]:[]),
    ...LV.marks.filter(m=>m.label).map(m=>lab(m.label,m.x,m.y+m.h/2+9,11))];
  const put=(x,y,rad)=>{if(!decoOK(x,y,rad,labs))return false;OCC.push([x-rad,y-rad,x+rad,y+rad]);return true;};
  const coast=LV.sea||LV.coast;
  // vinhas (vinho verde!) em manchas retangulares
  const nv=Math.round((X1-X0)*(Y1-Y0)/90000);
  for(let i=0;i<nv*3&&i<60;i++){const x=X0+r()*(X1-X0),y=Y0+r()*(Y1-Y0),w=34+r()*26,h=20+r()*12,a=(r()-0.5)*0.5;
    if(put(x,y,Math.hypot(w,h)/2))vines(c,x,y,a,w,h,r);}
  // arvoredos: metade à volta das muralhas (onde o mapa parecia vazio), metade espalhados
  const items=[];

function houseOK1(x,y,inside){

function drawCompass(c,x,y){c.save();c.translate(x,y);c.rotate(LV.compass||0);c.strokeStyle='#2e2419';c.lineWidth=1;

  if(so.road){const R=LV.road||[[310,640],[322,780],[335,900]];c.strokeStyle='#b9a47a';c.lineWidth=8;c.lineCap='round';c.beginPath();R.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();}

  }else{c.strokeStyle='#4e4a32';c.lineWidth=30;c.stroke();c.strokeStyle='#9aa46e';c.lineWidth=27;c.stroke();}

      const a=Math.atan2(s.y-cy,s.x-cx),tip=[s.x+Math.cos(a)*20,s.y+Math.sin(a)*20];
      const l=[s.x+Math.cos(a+2.2)*17,s.y+Math.sin(a+2.2)*17],rr=[s.x+Math.cos(a-2.2)*17,s.y+Math.sin(a-2.2)*17];

    else{c.fillStyle='#c7b894';c.strokeStyle='#3e3222';c.lineWidth=1.6;c.fillRect(s.x-16,s.y-16,32,32);c.strokeRect(s.x-16,s.y-16,32,32);}
  });
  polyPath(c,LV.wall);c.fillStyle='#e2d3ae';c.fill();
  {const ys=LV.wall.map(p=>p[1]),y0=Math.min(...ys),y1=Math.max(...ys);for(let i=0;i<800;i++){const x=40+r()*520,y=y0+r()*(y1-y0);if(houseOK(x,y,true))house(c,r,x,y);}}
  c.lineJoin='round';c.lineCap='round';

  // contorno escuro só a partir de 16 do desembarque: a ponta junto ao rio fica sem contorno e funde-se com o chão
  const landFrom=(P,d0)=>{const s0=P.seg[1]?P.seg[1].s+d0:P.seg[0].s,q=posAt(P,s0);c.beginPath();c.moveTo(q.x,q.y);for(const sg of P.seg.slice(1))if(sg.s+sg.L>s0)c.lineTo(sg.b[0],sg.b[1]);};
  // troço do contorno entre d0 e d1 (a contar do desembarque)
  const landPart=(P,d0,d1)=>{const b=P.seg[1]?P.seg[1].s:P.seg[0].s,q=posAt(P,b+d0);c.beginPath();c.moveTo(q.x,q.y);
    for(const sg of P.seg.slice(1)){if(sg.s>b+d1)break;if(sg.s+sg.L>b+d0&&sg.s+sg.L<b+d1)c.lineTo(sg.b[0],sg.b[1]);}const r=posAt(P,b+d1);c.lineTo(r.x,r.y);};

  // terra batida: manchas e pedrinhas ao longo do caminho
  {const rd=rng(77+LV.id.length);PATHS.forEach(P=>{for(let d=P.seg[0].L;d<P.len;d+=5){const q=posAt(P,d),o=(rd()-0.5)*18,x=q.x-Math.sin(q.a)*o,y=q.y+Math.cos(q.a)*o;
    c.fillStyle=rd()<0.5?'rgba(120,92,58,.22)':'rgba(250,240,210,.25)';c.beginPath();c.arc(x,y,0.6+rd()*1.4,0,Math.PI*2);c.fill();}});}

  LV.inner.forEach(q=>{const g=q.g,L=Math.hypot(q.b[0]-q.a[0],q.b[1]-q.a[1]),ux=(q.b[0]-q.a[0])/L,uy=(q.b[1]-q.a[1])/L;

}

// desenhados num espaço de 16×20 (pés em y≈8, topo da cabeça em y≈-9); a escala vem do raio de cada inimigo
const INK='#2e2419',SKIN='#eab98f',SKIN_D='#c98f66';
function oval(c,x,y,rx,ry,fill,lw){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}if(lw!==0){c.lineWidth=lw||1;c.strokeStyle=INK;c.stroke();}}
// olhos grandes e expressivos; mood: 0 normal, 1 zangado, 2 assustado, 3 manhoso
function faceEyes(c,x,y,mood,blink){
  const sep=1.55;[-sep,sep].forEach((dx,i)=>{
    if(blink){c.strokeStyle=INK;c.lineWidth=0.7;c.beginPath();c.moveTo(x+dx-0.9,y);c.lineTo(x+dx+0.9,y);c.stroke();return;}
    oval(c,x+dx,y,1.15,mood===3?0.6:1.3,'#fff',0.5);
    c.fillStyle=INK;c.beginPath();c.arc(x+dx+0.35,y+(mood===2?-0.2:0.15),mood===2?0.4:0.6,0,Math.PI*2);c.fill();
    if(mood===1){c.strokeStyle=INK;c.lineWidth=0.8;c.beginPath();c.moveTo(x+dx-1.2*(i?-1:1)-0.2,y-1.6);c.lineTo(x+dx+1.1*(i?-1:1),y-1);c.stroke();}
  });
}
function mustache(c,x,y,big){c.fillStyle='#3a2616';c.beginPath();const w=big?3.6:2.4;
  c.moveTo(x,y-0.3);c.quadraticCurveTo(x-w*0.6,y-0.9,x-w,y+0.2);c.quadraticCurveTo(x-w*0.5,y+0.1,x,y+0.6);
  c.quadraticCurveTo(x+w*0.5,y+0.1,x+w,y+0.2);c.quadraticCurveTo(x+w*0.6,y-0.9,x,y-0.3);c.fill();}
function legs(c,ph,moving,col){const sn=moving?Math.sin(ph):0,cs=moving?Math.cos(ph):0;
  [[-1.8,1],[1.8,-1]].forEach(([x,k])=>{const lift=Math.max(0,cs*k)*0.7;c.save();c.translate(x,4.4-lift);c.rotate(-sn*k*0.42);
    c.fillStyle=col||'#3a2e24';c.strokeStyle=INK;c.lineWidth=0.6;c.beginPath();c.rect(-0.9,0,1.8,3.3);c.fill();c.stroke();
    oval(c,0.5,3.4,1.3,0.7,'#2e2419',0);c.restore();});}
function torso(c,col,trim){oval(c,0,1.8,4.6,4.2,col,1);if(trim){c.fillStyle=trim;c.fillRect(-4.2,2.6,8.4,1.1);c.strokeStyle=INK;c.lineWidth=0.5;c.strokeRect(-4.2,2.6,8.4,1.1);}}
function head(c,y){oval(c,0,y,3.9,3.7,SKIN,1);c.fillStyle='rgba(200,110,80,.35)';c.beginPath();c.arc(-2.3,y+1.3,0.8,0,Math.PI*2);c.arc(2.6,y+1.3,0.8,0,Math.PI*2);c.fill();}
function morion(c,y,col,crest){// capacete espanhol com crista e aba virada
  c.fillStyle=col||'#b9b4a8';c.strokeStyle=INK;c.lineWidth=0.9;
  c.beginPath();c.moveTo(-5.2,y-0.6);c.quadraticCurveTo(-3,y-1.4,0,y-1.2);c.quadraticCurveTo(3,y-1.4,5.2,y-0.6);c.quadraticCurveTo(3,y+0.4,0,y+0.2);c.quadraticCurveTo(-3,y+0.4,-5.2,y-0.6);c.fill();c.stroke();

  c.fillStyle=tip||'#c9c2b0';c.strokeStyle=INK;c.lineWidth=0.6;c.beginPath();c.moveTo(x,top-3.2);c.lineTo(x-1.1,top);c.lineTo(x+1.1,top);c.closePath();c.fill();c.stroke();}

// inimigo comum em alçado; vira-se para onde anda, balança ao andar e fica tonto quando atordoado
function drawChibi(e,water){
  const u=e.r/8,moving=!(e.cur===0||e.stunT>0||e.blocked),ph=S.t*11+e.id*1.7,bob=moving?Math.abs(Math.sin(ph))*0.9:Math.sin(S.t*2+e.id)*0.25;

    c.fillStyle='#d8d0bc';c.beginPath();c.moveTo(1,-1.5);c.lineTo(7.5,-1.5);c.lineTo(7.5,3.5);c.quadraticCurveTo(4.3,8.2,1,3.5);c.closePath();c.fill();c.stroke();// escudo

    c.fillStyle=e.col;c.strokeStyle=INK;c.lineWidth=0.9;c.beginPath();c.moveTo(-4.3,-3.3);c.quadraticCurveTo(-4.4,-9.5,0.5,-9.8);c.quadraticCurveTo(5,-9.2,4.2,-4.8);c.quadraticCurveTo(0.5,-7.8,-4.3,-3.3);c.fill();c.stroke();// capuz
    c.beginPath();c.moveTo(0.5,-9.8);c.quadraticCurveTo(-3,-10.5,-5.5,-8);c.stroke();
    const draw=e.aim!=null&&e.rcd!=null?Math.max(0,1-e.rcd/e.f.ranged.rate):0;
    c.strokeStyle='#6e4b2a';c.lineWidth=1.2;c.beginPath();c.arc(3.5,0,6,-1.2,1.2);c.stroke();
    c.strokeStyle='rgba(46,36,25,.75)';c.lineWidth=0.5;const sx=3.5+6*Math.cos(1.2),sy=6*Math.sin(1.2);c.beginPath();c.moveTo(sx,-sy);c.lineTo(sx-draw*3.5,0);c.lineTo(sx,sy);c.stroke();
    if(draw>0.2){c.strokeStyle='#6e4b2a';c.lineWidth=0.7;c.beginPath();c.moveTo(sx-draw*3.5,0);c.lineTo(10,0);c.stroke();}
    c.fillStyle='#8a5a32';c.fillRect(-5.8,-1,2,5.5);c.strokeStyle=INK;c.lineWidth=0.5;c.strokeRect(-5.8,-1,2,5.5);// aljava
  }else if(T==='cont'){
    c.fillStyle='#b08850';c.strokeStyle=INK;c.lineWidth=0.9;c.beginPath();c.ellipse(-3.8,-1,4.4,4.8,-0.3,0,Math.PI*2);c.fill();c.stroke();// saco às costas
    c.fillStyle='#e8c24a';c.beginPath();c.arc(-4.4,-0.4,1.6,0,Math.PI*2);c.fill();c.lineWidth=0.5;c.stroke();
    c.strokeStyle='#6e4b2a';c.lineWidth=0.8;c.beginPath();c.moveTo(-6,-5.2);c.lineTo(-3,-6.8);c.stroke();
    torso(c,e.col,null);head(c,-4.2);faceEyes(c,1,-4.5,3,blink);
    c.fillStyle='#1e1e1e';c.fillRect(-3.8,-5.4,7.8,1.7);// máscara de bandido
    c.fillStyle='#fff';c.fillRect(-0.4,-5.2,1.3,1.2);c.fillRect(2.3,-5.2,1.3,1.2);c.fillStyle=INK;c.fillRect(0.2,-4.9,0.6,0.7);c.fillRect(2.9,-4.9,0.6,0.7);
    c.fillStyle='#2b2b2b';c.beginPath();c.ellipse(0,-7.3,5.6,1.2,0,0,Math.PI*2);c.fill();c.beginPath();c.arc(0,-7.6,3.2,Math.PI,0);c.fill();// chapéu
    c.strokeStyle='#9b2226';c.lineWidth=0.8;c.beginPath();c.moveTo(-3,-7.9);c.lineTo(3,-7.9);c.stroke();

    head(c,-4.2);faceEyes(c,0.4,-4.4,e.stunT>0?2:0,blink);
    c.fillStyle='#6e4b2a';c.beginPath();c.arc(0,-5.2,3.9,Math.PI*1.05,-0.05);c.fill();c.fillStyle=SKIN;c.beginPath();c.arc(0,-7,1.9,0,Math.PI*2);c.fill();// tonsura de frade

/* ---- sprites: o que não mexe desenha-se uma vez num canvas à parte (à resolução do ecrã, em degraus de 2×) e depois só se copia ---- */
const SPR=new Map();
function sprite(c,key,x,y,w,h,f){const m=c.getTransform(),k=Math.min(8,2**Math.ceil(Math.log2(Math.max(1,Math.hypot(m.a,m.b))))),id=key+'@'+k;
  let s=SPR.get(id);if(!s){s=document.createElement('canvas');s.width=Math.ceil(w*k);s.height=Math.ceil(h*k);const g=s.getContext('2d');g.scale(k,k);g.translate(-x,-y);g.lineJoin='round';f(g);SPR.set(id,s);
    // canvas pequenos ficam na memória do CPU e seriam enviados à GPU a cada frame; um ImageBitmap fica lá de vez
    if(window.createImageBitmap)createImageBitmap(s).then(b=>SPR.set(id,b),()=>{});}
  c.drawImage(s,x,y,w,h);}

/* ---- torres a sério (menos o trabuco): cada tipo tem o seu material e cresce com o nível ---- */

  c.fillStyle=col;c.beginPath();c.moveTo(x,y-L);c.lineTo(x+5.5,y-L+1+w);c.lineTo(x+4.5,y-L+3+w*0.6);c.lineTo(x+5.5,y-L+5+w);c.lineTo(x,y-L+4);c.closePath();c.fill();c.lineWidth=0.5;c.stroke();}
function drawTowerBuilding(c,t){
  const m=TMAT[t.k],lv=t.lv,col=towerCol(t.k),rx=lv>=4?13.5:13,ry=5.5,yB=9,yT=yB-TW_H[lv],sq=m.shape==='square',ph=2.6,wood=m.wood&&lv<3;
  // sombra no chão

  if(lv>=4){c.fillStyle=`rgba(232,194,74,${0.14+0.08*Math.sin(S.t*3)})`;c.beginPath();c.ellipse(0,yB,rx+6,ry+4,0,0,Math.PI*2);c.fill();}
  const rim=sq?[...[-1,-0.5,0,0.5,1].map(u=>[u*(rx-1.7),yT-ry+0.4])]:[...Array(5)].map((_,i)=>{const a=Math.PI*1.12+i*Math.PI*0.76/4;return[Math.cos(a)*(rx-1.5),yT+Math.sin(a)*(ry-0.4)];});
  sprite(c,'tb'+t.k+lv+col,-20,-28,40,48,c=>{
  // corpo

    if(lv>=2){c.stroke();c.fillStyle='#a39478';c.fillRect(-rx,yB-4,rx*2,ry+6);c.beginPath();
      for(let k=0;k<2;k++){const y=yB-2+k*3;c.moveTo(-rx,y+ry*0.6);c.lineTo(rx,y+ry*0.6);for(let x=-rx+(k?2:4);x<rx;x+=5){c.moveTo(x,y+ry*0.6-3);c.lineTo(x,y+ry*0.6);}}}}

      const step=m.brick?4:6;for(let x=-rx+(k%2?step/2:0);x<rx;x+=step){const yy=sq?y:y+ry*Math.sqrt(Math.max(0,1-(x*x)/(rx*rx)));c.moveTo(x,yy-st);c.lineTo(x,yy);}}}
  c.stroke();
  if(sq){[-rx,rx-3].forEach(x=>{for(let y=yT+ry,k=0;y<yB+ry;y+=3,k++){c.fillStyle=k%2?m.lite:m.wall;c.fillRect(x+(k%2?0:(x<0?0:-1)),y,k%2?3:4,3);}});}

  if(lv>=2){const my=yT+ry+5.2;c.fillStyle='#1e1812';[-6.5,6.5].forEach(x=>{c.fillRect(x-0.7,my-2.6,1.4,4);c.fillRect(x-1.8,my-1.2,3.6,0.9);});}
  const dy=sq?yB+ry:yB+ry;c.fillStyle='#3a2616';c.strokeStyle=INK;c.lineWidth=0.8;c.beginPath();c.moveTo(-2.4,dy);c.lineTo(-2.4,dy-3);c.arc(0,dy-3,2.4,Math.PI,0);c.lineTo(2.4,dy);c.fill();c.stroke();
  // cachorros (matacães) no caldeirão
  if(m.brick&&lv>=2){c.fillStyle=m.dark;c.strokeStyle=INK;c.lineWidth=0.5;for(let i=0;i<7;i++){const a=0.25+i*(Math.PI-0.5)/6,x=Math.cos(a)*(rx+0.5),y=yT+Math.sin(a)*ry+2.4;c.fillRect(x-1,y,2,2.2);c.strokeRect(x-1,y,2,2.2);}}

  // parapeito da frente

  front.forEach(([x,y])=>merlon(c,x,y,3.4,2.6,m,wood));

  if(lv>=4){
    towerBanner(c,sq?rx-2:rx-3,yT-ph-4,'#e8c24a',3,9);}
}
