/* barcos castelhanos: casco visto de cima (roda com o rumo), remos a remar, e mastros com velas às riscas de Castela em alçado */
function hullPath(c,h,w){c.beginPath();c.moveTo(-h,-w*0.72);c.quadraticCurveTo(-h*0.1,-w*1.06,h*0.5,-w*0.92);c.quadraticCurveTo(h*0.9,-w*0.55,h,0);
  c.quadraticCurveTo(h*0.9,w*0.55,h*0.5,w*0.92);c.quadraticCurveTo(-h*0.1,w*1.06,-h,w*0.72);c.quadraticCurveTo(-h*1.06,0,-h,-w*0.72);c.closePath();}
function drawBoat(b,c=ctx){// c: outro canvas (barcos do mapa do menu, parados e sem partida a decorrer)
  const mn=c!==ctx;if(!mn&&S.weather==='nevoeiro'||b.al<=0)return;
  const B=BOATS[b.k],h=B.L/2,w=B.B/2,t=RM()||mn?0:S.t,mv=b.mv&&!RM(),al=Math.min(1,b.al);
  c.save();c.globalAlpha=al;c.translate(b.x,b.y);c.rotate(b.a+Math.sin(t*(mv?3:1.5)+b.id)*0.025);c.lineJoin='round';c.lineCap='round';
  // esteira e ondinhas na proa
  c.strokeStyle='rgba(240,248,250,.75)';c.lineWidth=1.2;
  if(mv){for(let k=0;k<3;k++){const p=(t*1.1+k/3)%1;c.globalAlpha=al*(1-p)*0.8;c.beginPath();c.moveTo(-h-3-p*16,-w*0.5-p*9);c.lineTo(-h+3,0);c.lineTo(-h-3-p*16,w*0.5+p*9);c.stroke();}c.globalAlpha=al;}
  c.beginPath();c.arc(h-2,0,w*0.9+Math.sin(t*5+b.id)*1,-1.1,1.1);c.stroke();
  c.save();c.translate(2.5,3);hullPath(c,h,w);c.fillStyle='rgba(30,50,60,.25)';c.fill();c.restore();
  // remos: vão para trás e para a frente
  if(B.oars){const sw=mv?Math.sin(t*5+b.id):0.2,L=w*1.3+5;
    for(let i=0;i<B.oars;i++){const ox=h*0.4-i*(h*0.95)/Math.max(1,B.oars-1);
      [-1,1].forEach(sd=>{const x0=ox,y0=sd*w*0.8,x1=x0-sw*L*0.45,y1=y0+sd*L*0.9;
        c.strokeStyle='#5a3d20';c.lineWidth=1.3;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();
        c.fillStyle='#9a6a3a';c.strokeStyle=INK;c.lineWidth=0.6;c.beginPath();c.ellipse(x1,y1,1.2,2.6,Math.atan2(y1-y0,x1-x0)+Math.PI/2,0,Math.PI*2);c.fill();c.stroke();
        if(mv&&Math.abs(sw)>0.85){c.strokeStyle='rgba(240,248,250,.8)';c.lineWidth=0.8;c.beginPath();c.arc(x1,y1,3.5,0,Math.PI*2);c.stroke();}});}}
  // casco e convés com tábuas e bancos
  hullPath(c,h,w);c.fillStyle='#6e4b2a';c.fill();c.strokeStyle=INK;c.lineWidth=1.4;c.stroke();
  c.save();c.scale(0.84,0.72);hullPath(c,h,w);c.restore();c.fillStyle='#9a6a3a';c.fill();
  c.save();c.clip();c.strokeStyle='rgba(60,35,15,.45)';c.lineWidth=0.5;c.beginPath();for(let y=-w;y<w;y+=2.6){c.moveTo(-h,y);c.lineTo(h,y);}c.stroke();
  c.strokeStyle='#6e4b2a';c.lineWidth=1.5;c.beginPath();for(let x=h*0.4;x>-h*0.8;x-=Math.max(7,h*0.95/Math.max(1,B.oars-1))){c.moveTo(x,-w);c.lineTo(x,w);}c.stroke();c.restore();
  // castelos de proa e de popa da nau
  if(B.castle)[[h*0.55,h*0.95],[-h*1.0,-h*0.55]].forEach(([x0,x1])=>{c.fillStyle='#b98a55';c.strokeStyle=INK;c.lineWidth=1;c.beginPath();c.rect(x0,-w*0.62,x1-x0,w*1.24);c.fill();c.stroke();
    c.fillStyle='#6e4b2a';for(let y=-w*0.55;y<w*0.55;y+=3.2){c.fillRect(x0+0.6,y,1.4,1.6);c.fillRect(x1-2,y,1.4,1.6);}});
  c.fillStyle='#e8c24a';c.strokeStyle=INK;c.lineWidth=0.6;c.beginPath();c.arc(h-1.5,0,1.3,0,Math.PI*2);c.fill();c.stroke();// figura de proa dourada
  c.restore();
  // mastros e velas (ou só a bandeirinha da popa no batel), sem rodar
  const at=x=>[b.x+Math.cos(b.a)*x,b.y+Math.sin(b.a)*x];
  c.save();c.globalAlpha=al;c.lineJoin='round';
  if(!B.masts){const[px,py]=at(-h+4);c.strokeStyle=INK;c.lineWidth=1;c.beginPath();c.moveTo(px,py);c.lineTo(px,py-12);c.stroke();
    const f=Math.sin(t*7+b.id);c.fillStyle='#b8302a';c.beginPath();c.moveTo(px,py-12);c.lineTo(px+7,py-10.5+f);c.lineTo(px,py-8.5);c.closePath();c.fill();c.stroke();}
  else (B.masts===3?[h*0.4,-h*0.05,-h*0.5]:B.masts===2?[h*0.25,-h*0.35]:[h*0.05]).forEach((mx,i)=>{const[px,py]=at(mx),H=B.L*(B.masts===3?0.52:B.masts===2?0.62:0.6)*(i?0.82:1),sw=B.B*(i?0.85:1.05),st=py-H+3,sb=py-H*0.38,bil=(mv?1:0.5)*(2+Math.sin(t*2+b.id+i)*0.7);
    c.strokeStyle=INK;c.lineWidth=1.6;c.beginPath();c.moveTo(px,py);c.lineTo(px,py-H);c.stroke();
    const sail=()=>{c.beginPath();c.moveTo(px-sw/2,st);c.lineTo(px+sw/2,st);c.quadraticCurveTo(px+sw/2+bil,(st+sb)/2,px+sw/2-0.5,sb);c.quadraticCurveTo(px,sb+bil*1.4,px-sw/2+0.5,sb);c.quadraticCurveTo(px-sw/2-bil,(st+sb)/2,px-sw/2,st);c.closePath();};
    sail();c.fillStyle='#e8c24a';c.fill();c.save();c.clip();c.fillStyle='#b8302a';const n=B.masts>=2?5:4;for(let k=0;k<n;k+=2)c.fillRect(px-sw/2+k*sw/n,st-2,sw/n,sb-st+6);
    c.strokeStyle='rgba(60,30,10,.35)';c.lineWidth=0.5;c.beginPath();c.moveTo(px-sw/2,(st+sb)/2+bil*0.5);c.quadraticCurveTo(px,(st+sb)/2+bil*1.6,px+sw/2,(st+sb)/2+bil*0.5);c.stroke();c.restore();
    sail();c.strokeStyle=INK;c.lineWidth=1;c.stroke();
    c.strokeStyle='#5a3d20';c.lineWidth=1.5;c.beginPath();c.moveTo(px-sw/2-2,st);c.lineTo(px+sw/2+2,st);c.stroke();
    const f=Math.sin(t*7+b.id+i);c.fillStyle='#b8302a';c.strokeStyle=INK;c.lineWidth=0.6;c.beginPath();c.moveTo(px,py-H);c.lineTo(px+8,py-H+1.5+f);c.lineTo(px,py-H+3.2);c.closePath();c.fill();c.stroke();});
  c.restore();
}
// Coração da praça: o edifício no fim do caminho. Mostra as vidas: racha, perde ameias, arde, a bandeira rasga-se.
function drawHeart(){
  const g=LV.heart;if(!g)return;const m=g.m;
  const st=S.lives<=0?4:heartStage(),hit=S.heartHit/0.45;
  if(/Igreja/.test(m.label||''))return drawChurch(g,st,hit);
  if(m.keep)return drawKeep(g,st,hit);
  if(m.label===tr('Paiol','Powder store'))return drawPaiol(g,st,hit);
  const w=Math.max(26,m.w*1.2),h=Math.max(22,m.h*1.25),tw=12,th=14;

  ctx.fillStyle='rgba(46,36,25,.28)';ctx.fillRect(-w/2+3,-h/2+3,w,h);
  // corpo e ameias (as que caem vão faltando)
  ctx.fillStyle=hit>0?`rgb(${201+40*hit|0},${184-60*hit|0},${148-60*hit|0})`:'#c9b894';ctx.strokeStyle='#2e2419';ctx.lineWidth=1.5;
  ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeRect(-w/2,-h/2,w,h);
  const nm=Math.round(w/7),gone=[[],[1],[1,4],[0,1,3,4],[0,1,2,3,4,5]][st];
  for(let i=0;i<nm;i++){if(gone.includes(i%6))continue;const x=-w/2+1+i*(w-2)/nm;ctx.fillStyle='#8d7f66';ctx.fillRect(x,-h/2-4,(w-2)/nm*0.55,4);ctx.strokeRect(x,-h/2-4,(w-2)/nm*0.55,4);}

  if(st<4){ctx.fillStyle='#b9ab8c';ctx.fillRect(-tw/2,-h/2-th,tw,th);ctx.strokeRect(-tw/2,-h/2-th,tw,th);
    ctx.fillStyle='#2e2419';ctx.fillRect(-2,-h/2-th+4,4,5);}
  else{ctx.fillStyle='#6d624e';for(let i=0;i<6;i++)ctx.fillRect(-tw/2+(i*7%tw),-h/2-4-(i*5%9),4,3);}
  const top=-h/2-th;
  if(st<4&&/Igreja/.test(m.label||'')){ctx.beginPath();ctx.moveTo(-4,top-4);ctx.lineTo(4,top-4);ctx.stroke();}
  // rachas
  ctx.strokeStyle='rgba(46,36,25,.85)';ctx.lineWidth=1.1;
  if(st>=1){ctx.beginPath();ctx.moveTo(-w/2+4,-h/2+2);ctx.lineTo(-w/2+8,-2);ctx.lineTo(-w/2+5,3);ctx.lineTo(-w/2+10,h/2-1);ctx.stroke();}
  if(st>=2){ctx.beginPath();ctx.moveTo(w/2-3,-h/2+1);ctx.lineTo(w/2-9,-1);ctx.lineTo(w/2-6,4);ctx.lineTo(w/2-12,h/2-2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-3,-h/2-th+2);ctx.lineTo(1,-h/2-6);ctx.lineTo(-2,-h/2+4);ctx.stroke();}
  // bandeira (branca com as quinas azuis, como a de D. Afonso Henriques) no topo da torre
  const PH=24,py=top-(/Igreja/.test(m.label||'')?6:0);

    const fw=st>=3?12:20,fh=st>=3?9:13,wv=k=>Math.sin(S.t*6-k*0.45)*2*(k/fw);

    ctx.fillStyle=st>=3?'#cfc6b0':'#f4efe2';ctx.fill();ctx.stroke();
    if(st<3){ctx.fillStyle='#2f4a9e';const cx=px+fw/2,cy=py-PH+fh/2+wv(fw/2);ctx.fillRect(cx-1.3,cy-4.5,2.6,9);ctx.fillRect(cx-4.5,cy-1.3,9,2.6);}}

  if(st>=2){const fl=(x,y,s)=>{const f=Math.sin(S.t*18+x)*0.25+1;ctx.fillStyle='rgba(230,110,30,.85)';ctx.beginPath();ctx.moveTo(x-s,y);ctx.quadraticCurveTo(x,y-s*2.6*f,x+s,y);ctx.fill();
      ctx.fillStyle='rgba(250,200,70,.9)';ctx.beginPath();ctx.moveTo(x-s*0.5,y);ctx.quadraticCurveTo(x,y-s*1.5*f,x+s*0.5,y);ctx.fill();};

}

    ctx.fillStyle='rgba(232,194,74,.55)';ctx.fillRect(x-0.5,1,1,3);});

  ctx.strokeStyle='rgba(60,20,10,.5)';ctx.lineWidth=0.6;ctx.beginPath();[-6.5,-9].forEach((y,j)=>{const k=(y+4)/-8;ctx.moveTo(-11+3*k,y);ctx.lineTo(15-3*k,y);});

const VW=()=>(W+2*MX)/VIEW.z,VH=()=>(H+2*MY)/VIEW.z;

const OVP=()=>Math.min(140,Math.max(90,innerWidth*0.22)),TOPX=120,bgPx=()=>(EX1-EX0)*(EY1-EY0)*(scale*dpr)**2;
function clampView(){VIEW.ox=Math.max(EX0,Math.min(EX1-VW(),VIEW.ox));VIEW.oy=Math.max(EY0,Math.min(EY1-VH(),VIEW.oy));}
let bzT=null;
function bgZoomCheck(){const nb=VIEW.z>1.5?Math.max(1,Math.min(2,Math.sqrt(24e6/bgPx()))):1;
  if(nb!==BZ){clearTimeout(bzT);bzT=setTimeout(()=>{BZ=nb;drawBG();},160);}}
function setZoom(nz,wx,wy,sx,sy){
  nz=Math.max(1,Math.min(DUEL?5:3,nz));
  if(wx==null){wx=VIEW.ox+VW()/2;wy=VIEW.oy+VH()/2;sx=(W+2*MX)*scale/2;sy=(H+2*MY)*scale/2;}
  VIEW.z=nz;VIEW.ox=wx-sx/(scale*nz);VIEW.oy=wy-sy/(scale*nz);clampView();bgZoomCheck();
}
function toWorld(cx,cy){const r=cv.getBoundingClientRect();return{x:VIEW.ox+(cx-r.left)/(scale*VIEW.z),y:VIEW.oy+(cy-r.top)/(scale*VIEW.z),sx:cx-r.left,sy:cy-r.top};}
const PTR=new Map();let G={k:'none'};
cv.addEventListener('pointerdown',e=>{
  audio();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PTR.size===1)G={k:'tap',x0:e.clientX,y0:e.clientY,ox:VIEW.ox,oy:VIEW.oy};
  else if(PTR.size===2){const[a,b]=[...PTR.values()];const m=toWorld((a.x+b.x)/2,(a.y+b.y)/2);G={k:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:VIEW.z,wx:m.x,wy:m.y};}
});
cv.addEventListener('pointermove',e=>{
  if(!PTR.has(e.pointerId))return;PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(G.k==='pinch'&&PTR.size>=2){const[a,b]=[...PTR.values()];const r=cv.getBoundingClientRect();

  else if((G.k==='tap'||G.k==='pan')&&PTR.size===1){const dx=e.clientX-G.x0,dy=e.clientY-G.y0;
    if(G.k==='tap'&&Math.hypot(dx,dy)>8)G.k='pan';
    if(G.k==='pan'){VIEW.ox=G.ox-dx/(scale*VIEW.z);VIEW.oy=G.oy-dy/(scale*VIEW.z);clampView();}}

function ptrEnd(e){

// animações no mapa: torre a nascer, brilho ao melhorar, bandeiras ao vento
function towerAnimScale(t){

  if(t._lv!==t.lv){t._lv=t.lv;t.upAt=now;}

}
function drawTowerFx(t){
  if(RM())return;const now=performance.now();
  const b=(now-t.bornAt)/450;
  if(b<1){ctx.strokeStyle=`rgba(110,80,50,${0.6*(1-b)})`;ctx.lineWidth=3*(1-b)+1;ctx.beginPath();ctx.arc(t.x,t.y,14+b*22,0,Math.PI*2);ctx.stroke();}
  if(t.upAt){const u=(now-t.upAt)/650;
    if(u<1){ctx.strokeStyle=`rgba(232,194,74,${1-u})`;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(t.x,t.y,12+u*28,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=`rgba(255,230,140,${1-u})`;
      for(let i=0;i<8;i++){const a=i*Math.PI/4+u*1.5,r=10+u*34,x=t.x+Math.cos(a)*r,y=t.y+Math.sin(a)*r,s=3*(1-u)+1;
        ctx.beginPath();ctx.moveTo(x,y-s*1.6);ctx.lineTo(x+s*0.5,y);ctx.lineTo(x,y+s*1.6);ctx.lineTo(x-s*0.5,y);ctx.closePath();ctx.fill();}}
    else t.upAt=0;}
}
// lugar para construir: plataforma de pedra com anel a rodar e bandeira; brilha a dourado quando há ouro para uma torre
function drawSlot(s,i,can){
  const rm=RM(),t=rm?0:S.t,sel=S.sel===i,ph=i*0.9,x=s.x,y=s.y;
  const pulse=rm?0:Math.sin(t*3+ph),R=15+(sel?1.5+pulse*0.6:0);
  const side=S.local?(sideOf(s)===1?'47,74,115':'155,34,38'):null;
  ctx.save();
  // sombra e brilho
  ctx.fillStyle='rgba(46,36,25,.22)';ctx.beginPath();ctx.ellipse(x+2,y+3,R+1,R*0.72,0,0,Math.PI*2);ctx.fill();
  if(can&&!sel){ctx.globalAlpha=0.22+0.14*pulse;ctx.translate(x,y);sprite(ctx,'slotG',-R-9,-R-9,2*R+18,2*R+18,c=>{const g=c.createRadialGradient(0,0,R*0.6,0,0,R+9);g.addColorStop(0,'rgba(232,194,74,1)');g.addColorStop(1,'rgba(232,194,74,0)');
    c.fillStyle=g;c.beginPath();c.arc(0,0,R+9,0,Math.PI*2);c.fill();});ctx.translate(-x,-y);ctx.globalAlpha=1;}
  // plataforma: anel de pedras e chão de terra batida (a de quem não está escolhido vem do sprite)
  if(!sel){ctx.translate(x,y);sprite(ctx,'slotP',-R-2,-R-2,2*R+4,2*R+4,c=>slotPlat(c,0,0,R,false));ctx.translate(-x,-y);}else slotPlat(ctx,x,y,R,true);
  // anel tracejado a rodar (dourado se dá para construir, vermelho se escolhido, cor do jogador no mesmo ecrã)
  ctx.save();ctx.translate(x,y);ctx.rotate(t*(sel?1.6:0.5)+ph);
  ctx.setLineDash([2.6,2.8]);ctx.lineWidth=sel?2:1.4;
  ctx.strokeStyle=sel?'#9b2226':side?`rgba(${side},.95)`:can?'#b8860b':'rgba(46,36,25,.55)';
  ctx.beginPath();ctx.arc(0,0,R-8,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  // escolhido: anel exterior com quatro marcas a rodar ao contrário
  if(sel){ctx.save();ctx.translate(x,y);ctx.rotate(-t*1.2);ctx.strokeStyle='#9b2226';ctx.lineWidth=2.2;
    for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(0,0,R+4,k*Math.PI/2+0.25,k*Math.PI/2+1.2);ctx.stroke();}ctx.restore();}
  // bandeira espetada, um pouco maior, a ondular
  const bob=rm?0:Math.sin(t*2.2+ph)*0.6;
  ctx.translate(x,y-2+bob);ctx.scale(1.35,1.35);
  ctx.fillStyle='rgba(46,36,25,.35)';ctx.beginPath();ctx.ellipse(0.4,5,2.2,0.9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2e2419';ctx.fillRect(-0.7,-8,1.4,13);ctx.fillStyle='#c9971c';ctx.beginPath();ctx.arc(0,-8.3,1.1,0,Math.PI*2);ctx.fill();
  drawFlag(0,0,i*0.7);
  ctx.restore();
}
function slotPlat(c,x,y,R,sel){
  c.fillStyle='#c6b287';c.strokeStyle=INK;c.lineWidth=2;c.beginPath();c.arc(x,y,R,0,Math.PI*2);c.fill();c.stroke();
  const n=11;for(let k=0;k<n;k++){const a0=k/n*Math.PI*2+0.08,a1=(k+1)/n*Math.PI*2-0.08;
    c.strokeStyle=k%3===0?'#9a8a6c':k%3===1?'#b3a282':'#7f7058';c.lineWidth=3.6;c.beginPath();c.arc(x,y,R-2.6,a0,a1);c.stroke();}
  c.fillStyle=sel?'#f3dcc4':'#e6d6ae';c.beginPath();c.arc(x,y,R-5,0,Math.PI*2);c.fill();
  c.strokeStyle='rgba(78,63,42,.55)';c.lineWidth=0.8;c.stroke();
}
function drawFlag(x,y,seed){
  const tm=RM()?0:S.t*6+seed,w=(k)=>Math.sin(tm+k*1.3)*1.1;
  ctx.fillStyle='#1f5c3a';ctx.beginPath();ctx.moveTo(x+0.8,y-7);ctx.lineTo(x+4,y-7+w(1));ctx.lineTo(x+7,y-7+w(2));ctx.lineTo(x+7,y-3+w(2));ctx.lineTo(x+4,y-3+w(1));ctx.lineTo(x+0.8,y-3);ctx.closePath();ctx.fill();
  ctx.fillStyle='#9b2226';ctx.beginPath();ctx.moveTo(x+0.8,y-3);ctx.lineTo(x+4,y-3+w(1));ctx.lineTo(x+7,y-3+w(2));ctx.lineTo(x+7,y-1+w(2));ctx.lineTo(x+4,y-1+w(1));ctx.lineTo(x+0.8,y-1);ctx.closePath();ctx.fill();
}

  const w=ar<0.9?1560:1600,h=w/ar;return{x:0,y:540+h*0.3-h/2,w,h,fs:ar<0.9?1.65:1.25,port:true};}

let ROOM=null;
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')ROOM=await window.claude.use('room');}catch(e){ROOM=null;}})();
let NET={};
const ET=Object.keys(FOES),PRIK=Object.keys(PRI);
/* Transporte: dentro do claude.ai usa a capacidade room; noutros sites usa PeerJS (WebRTC direto).
   Os dois expõem a mesma interface: emit(tópico,dados), on(tópico,fn), onPeers(fn), leave(). */
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
const PEER_SRC='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
let peerLoad=null;
function loadPeer(){
  if(window.Peer)return Promise.resolve();if(peerLoad)return peerLoad;
  peerLoad=new Promise((res,rej)=>{const s=document.createElement('script');s.src=PEER_SRC;s.async=true;
    s.onload=()=>window.Peer?res():rej({code:'peerjs'});s.onerror=()=>{peerLoad=null;rej({code:'peerjs'});};document.head.appendChild(s);});
  return peerLoad;
}
function peerJoin(code,role){
  return loadPeer().then(()=>new Promise((res,rej)=>{
    const hs={},conns={},leaveHs=[],hostId='minhodef-'+code;let myId=null,done=false;
    // STUN para descobrir o endereço público; TURN (servidores do PeerJS) para quando a ligação direta é bloqueada
    const opts={debug:0,config:{iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},{urls:'stun:stun.cloudflare.com:3478'},
      {urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}]}};
    const peer=role==='host'?new window.Peer(hostId,opts):new window.Peer(opts);
    const fail=e=>{if(done)return;done=true;clearTimeout(sigT);try{peer.destroy();}catch(_){}rej(e);};
    // sem resposta do servidor de sinalização: não ficar à espera para sempre
    const sigT=setTimeout(()=>fail({code:'signal-timeout'}),15000);
    const R={
      emit:(t,d)=>{const msg={t,d};Object.values(conns).forEach(c=>{try{if(c.open)c.send(msg);}catch(_){}});
        (hs[t]||[]).forEach(h=>h({data:JSON.parse(JSON.stringify(d)),peer:myId,isMe:true,sameTab:true}));return Promise.resolve();},
      on:(t,h)=>{(hs[t]=hs[t]||[]).push(h);return()=>{};},
      onPeers:h=>{leaveHs.push(h);return()=>{};},
      leave:()=>{try{peer.destroy();}catch(_){}}
    };
    const wire=c=>{conns[c.peer]=c;
      c.on('data',m=>{if(!m||typeof m!=='object'||typeof m.t!=='string')return;(hs[m.t]||[]).forEach(h=>h({data:m.d,peer:c.peer,isMe:false,sameTab:false}));});
      c.on('close',()=>{delete conns[c.peer];leaveHs.forEach(h=>h({joined:[],left:[{peer:c.peer}]}));});};
    // o anfitrião fica a saber quando alguém tenta entrar mas a ligação direta não abre
    const watchIn=c=>{const t=setTimeout(()=>{if(!c.open)toast(tr('<b>Alguém tentou entrar</b>, mas a ligação entre os dois aparelhos falhou. Experimentem estar na mesma rede Wi-Fi.','<b>Someone tried to join</b>, but the connection between the two devices failed. Try being on the same Wi-Fi network.'));},12000);
      c.on('open',()=>clearTimeout(t));};
    peer.on('error',e=>fail({code:e&&e.type||'erro'}));
    peer.on('open',id=>{myId=id;clearTimeout(sigT);
      if(role==='host'){peer.on('connection',c=>{watchIn(c);c.on('open',()=>wire(c));});done=true;res(R);}
      else{const c=peer.connect(hostId,{reliable:true,serialization:'json'});
        c.on('open',()=>{if(done)return;wire(c);done=true;res(R);});
        c.on('error',()=>fail({code:'conn-failed'}));
        // o servidor encontrou a sala (senão dava peer-unavailable), mas a ligação direta não abriu
        setTimeout(()=>fail({code:'conn-failed'}),15000);}
    });
  }));
}
/* Na sala do claude.ai só quem tem acesso de Contributor ou mais pode emitir eventos; quem só vê (Viewer) pode apenas mudar a
   sua presença. Cada lado tenta emit e, se for recusado, passa a mandar as mensagens pela presença: uma fila numerada que
   os outros leem em onPeers. Os tópicos de estado (st, tw) guardam só a última versão; os outros caducam ao fim de 4 s. */
function claudeRoom(NR){
  const hs={},seen={},STATE={st:1,tw:1};let mode='ev',seq=0,q=[],cleanT=null;
  const me=()=>{const p=NR.peers().find(x=>x.sameTab);return p?p.peer:null;};
  const deliver=(t,m)=>(hs[t]||[]).forEach(h=>{try{h(m);}catch(e){console.error(e);}});
  const flush=()=>{
    const now=Date.now();q=q.filter(x=>STATE[x.t]||x.x>now);
    const arr=q.map(x=>[x.s,x.t,x.d]);let s=JSON.stringify(arr);
    while(s.length>3700&&arr.length>1){let i=arr.findIndex(a=>STATE[a[1]]);if(i<0||i===arr.length-1)i=0;arr.splice(i,1);s=JSON.stringify(arr);}
    NR.presence({q:arr}).catch(()=>{});
    clearTimeout(cleanT);if(q.some(x=>!STATE[x.t]))cleanT=setTimeout(flush,1000);
  };
  const viaPresence=(t,d)=>{
    const p=me();deliver(t,{data:JSON.parse(JSON.stringify(d==null?null:d)),peer:p,isMe:true,sameTab:true});
    seq++;if(STATE[t])q=q.filter(x=>x.t!==t);q.push({s:seq,t,d,x:Date.now()+4000});flush();
  };
  NR.onPeers(ch=>{
    ch.left.forEach(p=>{delete seen[p.peer];});
    [...ch.joined,...ch.updated].forEach(p=>{
      if(p.sameTab)return;const arr=p.presence&&p.presence.q;if(!Array.isArray(arr))return;
      let last=seen[p.peer]||0;
      arr.filter(a=>Array.isArray(a)&&typeof a[0]==='number'&&typeof a[1]==='string').sort((a,b)=>a[0]-b[0]).forEach(a=>{
        if(a[0]<=last)return;last=a[0];deliver(a[1],{data:a[2],peer:p.peer,by:p.by,isMe:p.isMe,sameTab:false,guest:p.guest});});
      seen[p.peer]=last;
    });
  });
  return{
    get small(){return mode==='pr';},
    emit(t,d){
      if(mode==='pr'){viaPresence(t,d);return Promise.resolve();}
      return NR.emit(t,d).catch(e=>{if(e&&e.code==='not_permitted'){mode='pr';viaPresence(t,d);}});
    },
    on(t,h){(hs[t]=hs[t]||[]).push(h);return NR.on(t,h);},
    onPeers:h=>NR.onPeers(h),
    leave(){clearTimeout(cleanT);return NR.leave();}
  };
}
async function joinRoom(code,role){
  if(IN_CLAUDE){for(let i=0;i<30&&!ROOM;i++)await new Promise(r=>setTimeout(r,100));
    if(!ROOM)throw {code:'room'};return claudeRoom(await ROOM.join('md-'+code));}
  return peerJoin(code,role);
}
function netErr(e){const c=e&&e.code||'';

const pickW=o=>{let x=Math.random()*Object.values(o).reduce((a,b)=>a+b,0);for(const k in o){x-=o[k];if(x<=0)return k;}return Object.keys(o)[0];};
function botCard(){const p=CARDS.filter(c=>!(c.once&&S.cards.includes(c.id))&&(!c.ok||c.ok()));if(p.length)applyCard(pick(p));}
function botThink(dt){
  S.bT=(S.bT==null?1.5:S.bT)-dt;if(S.bT>0||S.over)return;S.bT=0.6+Math.random()*0.8-S.di*0.12;
  const h=S.hero,prog=e=>e.d/PATHS[e.p].len;
  if(heroPend(h)>0)doAct({a:'heroUp',b:Math.random()<0.5?0:1},1);
  if(S.wave>=1){
    const land=S.enemies.filter(e=>!e.dead&&!e.ride&&!inRiver(e.x,e.y));
    if(S.cd.bell<=0)doAct({a:'abil',k:'bell'},1);
    if(S.cd.rain<=0&&land.length>=4){const e=land.reduce((a,b)=>prog(a)>prog(b)?a:b);doAct({a:'abil',k:'rain',x:Math.round(e.x),y:Math.round(e.y)},1);}
    if(S.cd.gate<=0&&(S.gates.some(G=>!G.broken&&G.hp<G.max*0.3)||land.filter(e=>prog(e)>0.8).length>=3))doAct({a:'abil',k:'gate'},1);
    if(S.cd.hero<=0&&!h.dead&&land.filter(e=>Math.hypot(e.x-h.x,e.y-h.y)<75).length>=3)doAct({a:'heroSp'},1);
  }
  if(!S.bScore)S.bScore=SLOTS.map(s=>{let n=0;PATHS.forEach(P=>{for(let d=P.seg[0].L;d<P.len;d+=12){const q=posAt(P,d);if(Math.hypot(q.x-s.x,q.y-s.y)<125)n++;}});return n;});
  const free=SLOTS.map((s,i)=>i).filter(i=>!SLOTS[i].tower).sort((a,b)=>S.bScore[b]-S.bScore[a]);
  const want=3+Math.floor(S.wave*0.6),ups=S.towers.filter(t=>t.lv<5&&!t.broken).map(t=>({t,c:TYPES[t.k].up[t.lv-1]})).sort((a,b)=>a.c-b.c);
  const build=()=>{const k=S.towers.length?pickW({arq:3,bes:2.5,tra:2,cal:1.6}):'arq';return{c:TYPES[k].cost,go:()=>doAct({a:'build',i:free[0],k},1)};};
  let plan=null;const ruin=S.towers.find(t=>t.broken&&!(t.fixT>0));
  if(ruin)plan={c:fixCost(ruin),go:()=>doAct({a:'fix',i:ruin.si},1)};
  else if(free.length&&(S.towers.length<want||!ups.length))plan=build();
  else if(ups.length){const u=ups[0];plan={c:u.c,go:()=>doAct(u.t.lv===2?{a:'br',i:u.t.si,b:Math.random()<0.5?0:1}:{a:'up',i:u.t.si},1)};}
  // mandar tropas: só com defesa montada e sem gastar o ouro do próximo plano; é mais atrevido nas dificuldades altas
  if(S.wave>=1&&S.towers.length>=3&&Math.random()<([0.2,0.32,0.45][S.di]||0.3)){const res=plan?plan.c*0.7:0;
    const ok=SENDS.map((D,i)=>i).filter(i=>SENDS[i].w<=S.wave&&S.gold-SENDS[i].c>=res);
    if(ok.length&&sendTroop(ok[Math.max(0,ok.length-1-Math.floor(Math.random()*3))]))return;}
  if(plan&&S.gold>=plan.c)plan.go();
}

function duelNet(now){

    if(now-NET.lastSt>=150){NET.lastSt=now;NET.R.emit('st',snapshot()).catch(()=>{});}

function duelWire(R){
  const ok=m=>DUEL&&DUEL.net&&!DUEL.over&&m.peer===NET.partner;
  R.on('st',m=>{if(ok(m))withSide(1-DUEL.me,()=>applySnap(m.data));});
  R.on('tw',m=>{if(ok(m))withSide(1-DUEL.me,()=>applyTw(m.data));});
  R.on('send',m=>{const d=m.data||{};if(ok(m)&&FOES[d.t]&&d.n>0&&d.n<=12)withSide(DUEL.me,()=>queueSend(d.t,d.n|0));});

  R.on('dend',m=>{if(ok(m))duelLose(1-DUEL.me);});

function offerCards(){
  if(S.remote||S.over)return;
  let three;
  if(S.offer)three=S.offer.map(id=>CARDS.find(c=>c.id===id));// reabre a mesma escolha (ex.: depois do menu de pausa)
  else{const pool=CARDS.filter(c=>!(c.once&&S.cards.includes(c.id))&&(!c.ok||c.ok()));
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    three=pool.slice(0,3);if(!three.length)return;S.offer=three.map(c=>c.id);sfx('horn');}

async function showBoard(lvl,back){
  const tabs=LEVEL_ORDER.map(id=>`<button data-b="${id}" aria-pressed="${id===lvl}">${LEVELS[id].name}</button>`).join('');
  showModal(`<h2>${tr('Recordes','Leaderboard')}</h2><div class="seg">${tabs}</div><div id="board"><p class="small">${tr('A carregar…','Loading…')}</p></div>`,[{label:tr('Voltar','Back'),main:true,keep:true,fn:back}]);
  $('mcard').querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>showBoard(b.dataset.b,back)));
  const box=$('board');const mine=bestTxt(lvl);
  let html=`<p>${tr('O teu melhor aqui','Your best here')}: ${mine}.</p>`;
  if(!DB){box.innerHTML=html+tr(`<p class="small">A tabela partilhada só aparece quando o jogo está aberto no claude.ai. Partilha o link do artefacto com colegas para competirem.</p>`,`<p class="small">The shared leaderboard only appears when the game is open on claude.ai. Share the artifact link with friends to compete.</p>`);return;}
  try{
    const snap=await DB.collection('scores').orderBy('s_'+lvl,'desc').limit(15).get();
    const rows=snap.docs.map(d=>({id:d.id,sc:(d.data()||{})['s_'+lvl]})).filter(r=>typeof r.sc==='number').slice(0,10);
    if(!rows.length){box.innerHTML=html+tr('<p class="small">Ninguém defendeu esta praça ainda. Sê o primeiro.</p>','<p class="small">Nobody has defended this fortress yet. Be the first.</p>');return;}
    const ps=USER?await USER.profiles(rows.map(r=>r.id)):{};
    box.innerHTML=html+tr('<table><tr><th>#</th><th>Defensor</th><th>Resultado</th></tr></table>','<table><tr><th>#</th><th>Defender</th><th>Result</th></tr></table>');
    const tb=box.querySelector('table');
    rows.forEach((r,i)=>{const row=document.createElement('tr');const nm=(ps[r.id]&&ps[r.id].name)||tr('Defensor anónimo','Anonymous defender');
      [String(i+1),nm+(r.id===UID?tr(' (tu)',' (you)'):''),scoreTxt(r.sc)].forEach(v=>{const td=document.createElement('td');td.textContent=v;row.appendChild(td);});tb.appendChild(row);});
    if(!UID)box.insertAdjacentHTML('beforeend',tr('<p class="small">Entra na tua conta para o teu resultado aparecer aqui.</p>','<p class="small">Log in for your score to appear here.</p>'));
  }catch(e){box.innerHTML=html+tr('<p class="small">Não foi possível carregar a tabela partilhada agora.</p>','<p class="small">Couldn’t load the shared leaderboard right now.</p>');}
}
function endGame(win){
  if(DUEL)return duelLose(S.dside);
  S.over=true;S.paused=false;
  if(S.coop&&NET.role==='host'){
    const d={win:!!win,wave:S.wave,lives:S.lives,kills:S.stats.kills,gold:S.stats.gold,time:Math.round(S.stats.time)};
    [0,600,1500].forEach(ms=>setTimeout(()=>{if(NET.R)NET.R.emit('end',d).catch(()=>{});},ms));
    if(win)unlock('amigos');
  }
  if(!S.coop){const wave=win?S.wave:Math.max(0,S.wave-(S.infinite?0:1));submitScore(S.lvl,S.infinite?S.wave:(win?MAXW:wave),S.di);clearSave();}
  if(win){
    sfx('win');setTimeout(()=>say(tr('Conseguiste! Viva Portugal!','You did it! Long live Portugal!'),'pt-PT',true),700);
    if(S.lives===S.startLives)unlock('semtoalha');
    if(S.built.size===1&&S.built.has('cal'))unlock('soazeite');
    if(S.di===2)unlock('maispaco');
    const wins=LS.get('wins',{}),nh=!wins[S.lvl]&&Object.keys(HEROES).find(k=>HEROES[k].map===S.lvl);
    wins[S.lvl]=1;LS.set('wins',wins);if(LEVEL_ORDER.every(k=>wins[k]))unlock('minho');
    if(nh)setTimeout(()=>{toast(tr(`<b>Nova lenda do teu lado!</b> ${ic(HEROES[nh].icon)} ${HEROES[nh].name} mudou de lado e já pode ser escolhido como herói.`,`<b>A legend joins you!</b> ${ic(HEROES[nh].icon)} ${HEROES[nh].name} switched sides and can now be picked as a hero.`));sfx('ach');},1200);
    if(S.campaign!=null&&!S.infinite){LS.set('camp',Math.max(campProg(),S.campaign+1));if(S.campaign>=CAMP.length-1)unlock('campanha');}
  }else{sfx('lose');setTimeout(()=>say('¡Campeones, campeones!','es-ES',true),900);}
  if(win&&S.local)unlock('amigos');
  S.endWin=win;showEnd(win);
}

  if(win&&!S.infinite)setTimeout(confetti,250);else if(!win)defeatFx(true);
  const st=S.stats,best=S.towers.slice().sort((a,b)=>(b.dmgDone||0)-(a.dmgDone||0))[0];
  const mm=Math.floor(st.time/60),ss=String(Math.floor(st.time%60)).padStart(2,'0');
  const stats=`<div class="stats-end">
    <span>${tr('Espanhóis despachados','Spaniards dispatched')}</span><span>${st.kills}</span>
    <span>${tr('Toalhas salvas','Towels saved')}</span><span>${st.kills*2}</span>
    <span>${tr('Ouro ganho','Gold earned')}</span><span>${st.gold} ${ic('coin')}</span>
    <span>${tr('Torre mais eficaz','Best tower')}</span><span>${best?ic(TYPES[best.k].icon)+' '+(best.lv>=3?TYPES[best.k].br[best.br].name:TYPES[best.k].name)+' ('+Math.round(best.dmgDone||0)+tr(' de dano)',' damage)'):tr('nenhuma, que vergonha','none, shame on you')}</span>
    <span>${S.hero.D.short}</span><span>${S.hero.kills} ${tr('derrotados, nível','defeated, level')} ${S.hero.lv}</span>${S.coop?(S.local?tr('<span>Modo</span><span>Mesmo ecrã</span>','<span>Mode</span><span>Same screen</span>'):tr('<span>Modo</span><span>Cooperativo</span>','<span>Mode</span><span>Co-op</span>')):''}
    <span>${tr('Maior matança','Best streak')}</span><span>${st.combo||0} ${tr('seguidos','in a row')}</span>
    ${S.cards.length?`<span>${tr('Bênçãos e pactos','Blessings & pacts')}</span><span>${S.cards.map(id=>{const c=CARDS.find(x=>x.id===id);return c?ic(c.ic):'';}).join(' ')}</span>`:''}
    <span>${tr('Sino tocado','Bell rung')}</span><span>${st.bells} ${tr('vezes','times')}</span>
    <span>${tr('Tempo de cerco','Siege time')}</span><span>${mm}:${ss}</span></div>`;
  const M=END_MSG[S.lvl],coopNet=S.coop&&!S.local,where=LV.full||tr('Cerco de ','Siege of ')+LV.name;
  let tag,title,body,it;
  if(win&&!S.infinite){
    tag=tr('Vitória','Victory');title=tr('Conseguiste! Fodeste os Espanhóis todos','You did it! You kicked every Spaniard’s arse');
    body=M.win.map(t=>'<p>'+t+'</p>').join('')+stats+`<p class="small">${tr(`Vidas restantes: ${S.lives}. Espanhóis que voltaram sem toalhas: todos.`,`Lives left: ${S.lives}. Spaniards who went home without towels: all of them.`)}</p>`;
    it=coopNet?[{l:ic('map')+' Menu',main:1,fn:()=>{netLeave();showMenu();}}]:[
      ...(S.campaign!=null?[S.campaign<CAMP.length-1?{l:ic('castle')+' '+tr('Próximo capítulo','Next chapter'),main:1,fn:()=>{menuSel.chap=S.campaign+1;showChapter(S.campaign+1);}}
          :{l:ic('scroll')+' '+tr('Epílogo','Epilogue'),main:1,fn:()=>showModal(tr('<h2>O Alto Minho está livre</h2><p>','<h2>The Alto Minho is free</h2><p>')+EPILOGO+'</p>',[{label:'Menu',main:true,keep:true,fn:showMenu}])}]:[]),
      {l:ic('infinite')+' '+tr('Continuar em modo infinito','Keep going in endless mode'),main:S.campaign==null,close:1,fn:()=>{S.over=false;S.infinite=true;S.nextT=18;}},
      {l:ic('hourglass')+' '+tr('Outra vez','Again'),close:1,fn:restartGame},
      {l:ic('trophy')+' '+tr('Recordes','Leaderboard'),fn:()=>showBoard(S.lvl,()=>showEnd(win))},
      {l:ic('map')+' Menu',fn:showMenu}];
  }else{
    tag=S.infinite?tr('Fim do cerco','Siege over'):tr('Derrota','Defeat');
    title=S.infinite?tr(`Aguentaste até à vaga ${S.wave}`,`You held out until wave ${S.wave}`):M.loseTitle;
    body=`<p>${S.infinite?M.inf.replace('{x}',S.wave-MAXW):M.lose.replace('{w}',S.wave)}</p>${stats}`;
    it=coopNet?[{l:ic('map')+' Menu',main:1,fn:()=>{netLeave();showMenu();}}]:[
      {l:ic('swords')+' '+tr('Vingança!','Revenge!'),main:1,close:1,fn:restartGame},
      {l:ic('trophy')+' '+tr('Recordes','Leaderboard'),fn:()=>showBoard(S.lvl,()=>showEnd(win))},
      {l:ic('map')+' Menu',fn:showMenu}];
  }
  endCard(tag,where,title,win&&!S.infinite,body,it);
}
// cartão de fim (vitória/derrota, também no duelo): o mesmo do menu principal e da pausa, por cima do mapa desfocado
function endCard(tag,where,title,good,body,it){
  document.body.classList.add('inpause');
  const big=it.filter(x=>x.main),small=it.filter(x=>!x.main),rows=[];for(let k=0;k<small.length;k+=2)rows.push(small.slice(k,k+2));
  const btn=x=>`<button data-e="${it.indexOf(x)}"${x.main?' class="main"':''}>${x.l}</button>`;
  showModal(`<div class="menu endm"><h2 class="logo">Minho<span>Defenders</span></h2><p class="tag">${tag} · ${where}</p>
    <h3 class="etitle ${good?'win':'lose'}">${title}</h3>${body}
    <div class="mlist">${big.map(btn).join('')}${rows.map(r=>r.length>1?`<div class="row">${r.map(btn).join('')}</div>`:btn(r[0])).join('')}</div></div>`,[]);
  $('mcard').querySelectorAll('[data-e]').forEach(b=>b.addEventListener('click',()=>{audio();const x=it[+b.dataset.e];if(x.close)closeModal();x.fn();}));
}

/* ---- 11-ciclo.js ---- */
/* ================= Ciclo ================= */
function resize(){
  const st=$('stage'),bw=st.clientWidth-6,bh=st.clientHeight-6;
  scale=Math.max(0.2,Math.min(bw/W,bh/H));dpr=Math.min(window.devicePixelRatio||1,2.5);
  MX=Math.max(0,(bw/scale-W)/2);MY=Math.max(0,(bh/scale-H)/2);{const p=OVP()/scale;EX0=-MX-p;EX1=W+MX+p;EY0=-MY-p-TOPX;EY1=H+MY+p;}
  cv.style.width=Math.floor(bw)+'px';cv.style.height=Math.floor(bh)+'px';
  cv.width=Math.round(bw*dpr);cv.height=Math.round(bh*dpr);ovc.width=cv.width;ovc.height=cv.height;
  if(VIEW.z<=1.001){VIEW.z=1;VIEW.ox=-MX;VIEW.oy=-MY;}else clampView();
  if(bgPx()*BZ*BZ>24e6)BZ=1;
  drawBG();
}
// textos fixos do HTML no idioma escolhido
function applyStaticLang(){
  if(LANG!=='en')return;
  const T=(sel,txt)=>{const e=document.querySelector(sel);if(e)e.textContent=txt;};
  const A=(sel,at,txt)=>{const e=document.querySelector(sel);if(e)e.setAttribute(at,txt);};
  T('#stWave small','Wave');T('#stEco small','Income');T('#stFoe small','Opponent');A('#stEco','title','Income: gold every 6 s (rises with every troop sent)');A('#stFoe','title','Opponent’s fortress lives');A('#sendT','aria-label','Send troops');A('#send','aria-label','Send troops');T('#stGold small','Gold');T('#gold2w small','Partner');T('#stLives small','Fortress');
  A('.wxs','title','Weather');A('#gold2w','title','Partner’s gold');A('#stLives','title','Fortress lives');
  T('#bWaveT','Call wave');T('#pausedTxt','Paused');A('#bSpeed','aria-label','Speed');A('#bPause','aria-label','Pause');A('#bSound','aria-label','Sound');
  A('#zoomb [data-z="in"]','aria-label','Zoom in');A('#zoomb [data-z="out"]','aria-label','Zoom out');A('#zoomb [data-z="reset"]','aria-label','Show whole map');
  T('[data-ab="rain"] .an','Arrows');T('[data-ab="gate"] .an','Gates');T('[data-ab="bell"] .an','Bell');T('[data-ab="fix"] .an','Repair');T('#heroNm','Heroine');A('#cardsHud','title','Blessings & pacts');A('#abil','aria-label','Powers');A('#abilT','aria-label','Powers');
}
applyStaticLang();
new ResizeObserver(resize).observe($('stage'));
applyOpt();
// aviso (uma vez): o sistema está a pedir movimento reduzido e por isso os bonecos estão parados
if(OPT.anim==='auto'&&RM_Q.matches&&!LS.get('rmTip',0)){LS.set('rmTip',1);setTimeout(()=>toast(ic('warn')+' '+tr('O teu sistema pede movimento reduzido, por isso as animações estão paradas. Em <b>Opções › Animações</b> escolhe «Sempre» para as ver.','Your system asks for reduced motion, so animations are paused. In <b>Options › Animations</b> pick “Always” to see them.')),2600);}
newGame(menuSel.lvl in LEVELS?menuSel.lvl:'valenca',menuSel.di,menuSel.hero in HEROES?menuSel.hero:'padeira');
resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>drawBG());
let prev=performance.now(),shaking=false;
// tremor, clarão e pancada no coração decaem em tempo real (continuam durante o congelamento de impacto)
function juice(dt){
  S.shake=Math.max(0,S.shake-dt*24);S.flash=Math.max(0,S.flash-dt*1.3);
  // a pancada no coração decai nas duas praças do duelo (senão a do adversário ficava vermelha para sempre)
  for(const d of DUEL?DUEL.sides:[{S}])d.S.heartHit=Math.max(0,d.S.heartHit-dt);
  const a=RM()?0:Math.min(14,S.shake)*scale*VIEW.z*0.7;
  if(a>0.25){cv.style.transform=`translate(${((Math.random()*2-1)*a).toFixed(1)}px,${((Math.random()*2-1)*a).toFixed(1)}px)`;shaking=true;}
  else if(shaking){cv.style.transform='';shaking=false;}
}
function loop(now){
  const dt=Math.min(0.05,(now-prev)/1000);prev=now;
  if(S&&S.offer&&!S.remote&&!S.over&&$('modal').hidden)offerCards();
  if(DUEL){if(!DUEL.over&&(DUEL.net||(!S.paused&&$('modal').hidden)))duelTick(dt);}
  else if(S&&S.remote){if(!S.over)guestTick(dt);}
  else if(S&&S.started&&!S.paused&&!S.over&&($('modal').hidden||S.coop)){
    if(S.stop>0)S.stop-=dt;// congelamento de impacto
    else{let t=dt*S.speed;while(t>0){const st=Math.min(0.02,t);update(st);t-=st;if(S.over||S.stop>0)break;}}}
  if(S)juice(dt);
  if(S&&S.coop&&!S.remote)netSend(now);
  if(DUEL&&DUEL.net)duelNet(now);
  hud();if(!(MBG.on&&now>MBG.cover))draw();// com o mapa do menu a tapar tudo não vale a pena desenhar
  requestAnimationFrame(loop);
}
showBoot(showMenu);requestAnimationFrame(loop);

})();
