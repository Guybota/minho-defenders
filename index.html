<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minho Defenders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/sam-js@0.3.1/dist/samjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6d8b6; --ink:#2e2419; --soft:#6b5a42; --panel:#dccaa0; --line:#8a7350;
  --red:#9b2226; --btn:#efe3c6; --btnink:#2e2419; --dis:#b9a987; --sel:#f7e7b8;
  --gold:#c9971c; --good:#6f9a3a; --shadow:rgba(46,36,25,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1712; --ink:#ecdfc2; --soft:#b3a07c; --panel:#2a221a; --line:#6d5a3e;
    --red:#d0544a; --btn:#3a2f23; --btnink:#ecdfc2; --dis:#5a4d3c; --sel:#5a4630; --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1712; --ink:#ecdfc2; --soft:#b3a07c; --panel:#2a221a; --line:#6d5a3e;
  --red:#d0544a; --btn:#3a2f23; --btnink:#ecdfc2; --dis:#5a4d3c; --sel:#5a4630; --shadow:rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
/* sem zoom do navegador por duplo toque (iPad/telemóvel): o jogo tem o seu próprio zoom no mapa */
html,body,button,input,#modal,#panel{touch-action:manipulation;-webkit-text-size-adjust:100%}
html.big{font-size:118%}

/* ---------- Esqueleto: HUD em cima, mapa ao centro, poderes em baixo; painel desliza por cima do mapa ---------- */
body{background:var(--bg);color:var(--ink);font-family:'IM Fell English',Georgia,'Times New Roman',serif;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"hud" "stage" "abil";height:100%;height:100dvh;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#hud{grid-area:hud;padding:.4rem .55rem;border-bottom:1px solid var(--line);background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;
  box-shadow:0 2px 10px var(--shadow);position:relative;z-index:5}
#hud .top{flex:0 0 auto}
#hud .stats{flex:1 1 380px;min-width:0}
#hud .bar{flex:1 1 320px}
#stage{grid-area:stage;min-height:0;display:flex;align-items:center;justify-content:center;padding:.25rem;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at center,transparent 55%,var(--shadow) 140%)}
#abil{grid-area:abil}

/* ---------- Botões ---------- */
button{font:inherit;color:var(--btnink);background:var(--btn);border:1px solid var(--line);border-radius:4px;padding:.3rem .6rem;cursor:pointer;min-height:38px;
  transition:transform .08s ease,border-color .15s,background-color .15s,box-shadow .15s}
button:not(:disabled):hover{border-color:var(--red)}
button:not(:disabled):active{transform:translateY(1px) scale(.97)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button:disabled{color:var(--dis);cursor:not-allowed}
button.main{background:var(--red);color:#fbf1dc;border-color:var(--red);box-shadow:0 2px 0 rgba(0,0,0,.25)}
button.main:disabled{background:var(--btn);color:var(--dis);border-color:var(--line);box-shadow:none}
button[aria-pressed="true"]{background:var(--sel);border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}

/* ---------- HUD ---------- */
.top{display:flex;align-items:center;gap:.5rem}
.top h1{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.08rem;margin:0 auto 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx{font-size:1.1rem}
.stats{display:flex;gap:.35rem}
.stats .st{flex:1 1 0;min-width:0}
.stats .wxs{flex:0 0 auto;order:9;padding:.2rem .4rem;justify-content:center}
/* em retrato o título não cabe: o mapa precisa da altura */
@media (orientation:portrait),(max-width:699px){.top{display:none}}
.st{position:relative;display:flex;align-items:center;gap:.35rem;background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:.2rem .45rem .35rem;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.st .si{font-size:1.15rem;line-height:1}
.sv{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.sv small{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.sv b{font-weight:400;font-size:1.18rem;font-variant-numeric:tabular-nums;display:inline-block;transform-origin:left center;white-space:nowrap}
.meter{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(46,36,25,.18)}
.meter i{display:block;height:100%;width:0;background:var(--good);transition:width .35s ease}
#stWave .meter i{background:var(--gold)}
#stLives.low .meter i{background:var(--red)}
.st.bump b{animation:bump .38s ease-out}
.st.hurt{animation:hurt .5s ease-out}
@keyframes bump{0%{transform:scale(1.35)}100%{transform:none}}
@keyframes hurt{0%{transform:none;background:var(--red)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-1px)}100%{transform:none}}
.bar{display:flex;gap:.35rem}
.bar button{min-width:40px;padding:.3rem .45rem}
#bWave{flex:1;position:relative;overflow:hidden;font-size:1.02rem}
#bWaveF{position:absolute;left:0;bottom:0;height:4px;width:0;background:rgba(251,241,220,.75);pointer-events:none}
#bWave.pulse{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(155,34,38,.55)}100%{box-shadow:0 0 0 12px rgba(155,34,38,0)}}

/* ---------- Mapa ---------- */
canvas{display:block;touch-action:none;box-shadow:0 0 0 1px var(--line),0 6px 22px var(--shadow);border-radius:2px}
#zoomb{position:absolute;left:.45rem;top:.45rem;display:flex;flex-direction:column;gap:.3rem;z-index:2}
#zoomb button{width:38px;height:38px;padding:0;font-size:1.1rem;border-radius:50%;opacity:.92;box-shadow:0 2px 6px var(--shadow)}

/* ---------- Poderes ---------- */
#abil{display:flex;justify-content:center;gap:.5rem;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);
  box-shadow:0 -2px 10px var(--shadow);position:relative;z-index:5}
.ab{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05rem;padding:.3rem .4rem .25rem;min-height:58px;
  flex:0 1 104px;min-width:0;border-radius:14px;box-shadow:0 2px 0 var(--shadow)}
.ab .ai{font-size:1.65rem;line-height:1.1;transition:opacity .2s,filter .2s,transform .2s}
.ab:not(:disabled):not(.cd):hover .ai{transform:translateY(-2px) scale(1.08)}
.ab .an{font-size:.72rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--soft)}
.ab[aria-pressed="true"] .an{color:var(--red)}
.ab em{position:absolute;top:2px;right:5px;font-style:normal;font-size:.72rem;color:var(--soft);font-variant-numeric:tabular-nums}
.ab i{position:absolute;left:0;right:0;bottom:0;background:rgba(46,36,25,.35);height:0;pointer-events:none}
.ab.cd .ai{opacity:.45;filter:grayscale(1)}
/* poder indisponível (a recarregar ou antes da 1.ª vaga): botão inteiro desvanecido e escurecido; o contador fica legível */
#abil.open .ab.cd{opacity:.9;background:color-mix(in srgb,var(--bg) 66%,#1e160e);box-shadow:0 2px 6px var(--shadow);border-color:var(--dis)}
.ab.cd .ai{opacity:.5;filter:grayscale(1) brightness(.6)}
.ab.cd .an{opacity:.55}
.ab.cd em{color:#fbf1dc;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.ab.ready{animation:ready .6s ease-out}
@keyframes ready{0%{box-shadow:0 0 0 0 rgba(201,151,28,.8);border-color:var(--gold)}100%{box-shadow:0 0 0 10px rgba(201,151,28,0)}}

/* ---------- Painel (torre, heroína, construir) ---------- */
#panel{position:absolute;z-index:4;left:.4rem;right:.4rem;bottom:.4rem;max-height:62%;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:1rem .65rem .7rem;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line);
  transform:translateY(calc(100% + 1rem));opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .32s cubic-bezier(.2,.9,.25,1.05),opacity .22s ease,visibility 0s linear .32s}
#panel::before{content:"";position:absolute;left:50%;top:.35rem;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line);opacity:.6}
#panel.open{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .34s cubic-bezier(.2,.9,.25,1.12),opacity .18s ease,visibility 0s}
@media (orientation:landscape) and (min-width:700px){
  #panel{left:auto;right:.5rem;top:.5rem;bottom:.5rem;width:clamp(290px,30vw,390px);max-height:none;padding-top:.7rem;transform:translateX(calc(100% + 1rem))}
  #panel::before{display:none}
  #panel.open{transform:none}
}
.cardsHud{flex:0 0 auto!important;padding:.2rem .45rem;font-size:1.05rem;letter-spacing:.05em;justify-content:center}
#panel.in>*{animation:sheet .22s ease-out backwards}
#panel.in>*:nth-child(2){animation-delay:.04s}#panel.in>*:nth-child(3){animation-delay:.08s}
@keyframes sheet{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hint{color:var(--soft);font-style:italic;line-height:1.45;max-width:60ch;margin:0}
.hint+.hint{margin-top:.35rem;font-style:normal}
.ph{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.35rem}
.ph b{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.05rem}
.ph button{min-height:32px;width:32px;padding:0;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.35rem}
.build{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.35rem .2rem .4rem;line-height:1.15;border-radius:6px;box-shadow:0 2px 0 var(--shadow)}
.build .ic{font-size:1.55rem}
.build .nm{font-size:.82rem;text-align:center}
.build .cs{font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 .45rem;margin-top:.1rem}
.build:disabled{opacity:.6;box-shadow:none}
.build:disabled .cs{color:var(--red);border-color:var(--red)}
.tinfo{display:flex;gap:.3rem;flex-wrap:wrap;font-size:.88rem;margin-bottom:.45rem}
.tinfo span{white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.05rem .5rem}
.tinfo span.warn{border-color:var(--red);color:var(--red)}
.acts{display:flex;gap:.35rem;flex-wrap:wrap}
.acts .br{flex:1 1 9rem;text-align:left;line-height:1.2}
.acts .br small{display:block;color:inherit;opacity:.85;font-size:.78rem}
.acts .up{flex:1 1 100%}
.coopbox{display:flex;gap:.4rem;margin-top:.5rem}
.coopbox input{font:inherit;flex:1;min-width:0;padding:.4rem .6rem;border:1px solid var(--line);border-radius:4px;background:var(--btn);color:var(--btnink);text-transform:uppercase;letter-spacing:.2em}

/* ---------- Janelas ---------- */
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,22,14,.62);padding:1rem;z-index:10;animation:fade .2s ease-out}
#modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.card{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--line);max-width:32rem;width:100%;padding:1.2rem 1.3rem;border-radius:6px;
  box-shadow:0 10px 34px rgba(0,0,0,.4),inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--line);max-height:calc(100% - 1rem);overflow:auto}
.card.enter{animation:cardIn .26s ease-out}
.card.enter::after{content:"";position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(155,34,38,.08) 42%,rgba(155,34,38,.3) 50%,rgba(155,34,38,.08) 58%,transparent 100%);
  background-size:100% 220%;animation:sweep .42s ease-out forwards}
@keyframes cardIn{0%{opacity:0;transform:translateY(10px) scale(.985)}60%{opacity:1;transform:translateY(-2px)}100%{transform:none}}
@keyframes sweep{0%{background-position:0 100%;opacity:1}100%{background-position:0 0;opacity:0}}
.card h2{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.6rem;margin:0 0 .4rem;line-height:1.15}
.card h3{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.05rem;margin:.9rem 0 .35rem}
.card p{line-height:1.5;margin:.45rem 0}
.card .small{font-size:.9rem;color:var(--soft)}
.seg{display:grid;gap:.35rem;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr))}
.seg button{line-height:1.2;padding:.45rem .4rem}
.seg small{display:block;font-size:.76rem;color:var(--soft)}
.mbtns{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.mbtns button{flex:1 1 auto;min-height:44px}
.stats-end{display:grid;grid-template-columns:auto auto;gap:.2rem 1rem;font-size:.95rem;margin:.6rem 0}
.stats-end span:nth-child(odd){color:var(--soft)}
.ach{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0;border-bottom:1px dotted var(--line)}
.ach .ai{font-size:1.3rem;width:1.8rem;text-align:center}
.ach.off{opacity:.45}
.ach b{font-weight:400;display:block}
.ach small{color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:.25rem .3rem;border-bottom:1px dotted var(--line);text-align:left;font-weight:400}
th{color:var(--soft)}

/* menu principal: lista de botões grandes */
.menu{max-width:22rem;margin:0 auto}
.menu .logo{font-size:2.3rem;line-height:1;margin:.2rem 0 .1rem;letter-spacing:.02em}
.menu .logo span{display:block;color:var(--red)}
.menu .tag{margin:.1rem 0 .2rem;color:var(--soft);font-style:italic}
.menu .status{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);border-top:1px solid var(--line);padding-top:.5rem;margin:.6rem 0 .7rem}
.menu .status b{font-weight:400;color:var(--red)}
.mlist{display:flex;flex-direction:column;gap:.45rem}
.mlist>button{min-height:50px;font-size:1.12rem;text-align:left;padding:.4rem .9rem;border-left:5px solid var(--line);box-shadow:0 2px 0 var(--shadow);
  animation:cardIn .3s ease-out backwards}
.mlist>button.main{border-left-color:#fbf1dc}
.mlist>button:not(.main):hover{border-left-color:var(--red)}
.mlist>button:nth-child(2){animation-delay:.03s}.mlist>button:nth-child(3){animation-delay:.06s}.mlist>button:nth-child(4){animation-delay:.09s}.mlist>button:nth-child(5){animation-delay:.12s}
.mlist .row{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.mlist .row button{min-height:44px}
.version{font-size:.75rem;color:var(--soft);margin-top:.8rem;text-align:center}

/* ecrã de arranque: o pregão da praça */
.boot{font-size:1.02rem;min-height:15rem;display:flex;flex-direction:column;gap:.15rem}
.boot .bh{font-family:'IM Fell English SC',Georgia,serif;font-size:1.3rem;margin:0 0 .5rem;border-bottom:1px solid var(--line);padding-bottom:.3rem}
.boot .ln{display:flex;align-items:baseline;gap:.4rem;margin:.15rem 0;animation:lnIn .22s ease-out backwards}
.boot .ln .dots{flex:1;border-bottom:1px dotted var(--soft);transform:translateY(-.25em)}
.boot .ln b{font-weight:400;color:var(--good)}
.boot .ln.red{color:var(--red);font-size:1.25rem;margin-top:.4rem}
@keyframes lnIn{from{opacity:0;transform:translateX(-6px)}}
.bbar{height:5px;border:1px solid var(--line);border-radius:3px;margin-top:auto;overflow:hidden}
.bbar i{display:block;height:100%;width:100%;background:var(--red);animation:fill 2.1s linear backwards}
@keyframes fill{from{width:0}}

/* bênçãos e pactos */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.5rem;margin-top:.7rem}
.bcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.2rem;padding:.7rem .5rem .8rem;line-height:1.2;
  border:2px solid var(--line);border-radius:6px;background:var(--btn);box-shadow:0 3px 0 var(--shadow);animation:deal .35s ease-out backwards}
.bcard:nth-child(2){animation-delay:.08s}.bcard:nth-child(3){animation-delay:.16s}
.bcard:hover,.bcard:focus-visible{border-color:var(--red);transform:translateY(-2px)}
.bcard .ci{font-size:2rem}
.bcard em{font-style:normal;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.bcard b{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.02rem}
.bcard small{font-size:.85rem;color:var(--soft)}
.bcard.pacto{border-style:dashed;border-color:var(--red)}
.bcard.pacto em{color:var(--red)}
@keyframes deal{from{opacity:0;transform:translateY(14px) rotate(-2deg)}to{opacity:1;transform:none}}

/* avisos */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + .6rem);transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:.4rem;pointer-events:none;width:min(92vw,24rem)}
.toast{background:var(--bg);border:1px solid var(--red);border-left-width:5px;border-radius:5px;padding:.5rem .7rem;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:.95rem;animation:toastIn .25s ease-out}
.toast b{font-weight:400;color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}}

@media (max-width:420px){ .top h1{font-size:.98rem} .sv b{font-size:1.05rem} .st .si{font-size:1rem} .ab .an{font-size:.75rem} .menu .logo{font-size:2rem} }
@media (max-width:360px){ .ab .an{display:none} .sv small{display:none} }
/* --- mapa do Minho por trás do menu --- */
#menubg{position:fixed;inset:0;z-index:9;pointer-events:none;background:#e9dcbc;overflow:hidden}
#menubg svg{position:absolute;inset:0;width:100%;height:100%}
#menubg.show{animation:bgIn .9s ease-out both}
#menubg.leave{animation:bgLeave .95s cubic-bezier(.55,0,.8,.3) forwards}
@keyframes bgIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes bgLeave{0%{opacity:1;transform:none;filter:none}60%{opacity:.9}100%{opacity:0;transform:scale(2.4);filter:blur(4px)}}
#menubg .route{stroke-dasharray:6 7;animation:route 1.6s linear infinite}
@keyframes route{to{stroke-dashoffset:-26}}
#menubg .boat{animation:bob 2.6s ease-in-out infinite}
#menubg .boat:nth-of-type(2n){animation-duration:3.1s;animation-delay:-.8s}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
#menubg .wave{animation:waves 5s ease-in-out infinite alternate}
@keyframes waves{to{transform:translateX(-14px)}}
#menubg .pin{animation:pin 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pin{50%{transform:scale(1.18)}}
body.inmenu #modal{background:rgba(30,22,14,.22)}
body.inmenu #modal .card{box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--line)}
/* --- animações extra --- */
button{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,248,230,.45);transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none}
button.main .ripple{background:rgba(255,255,255,.35)}
@keyframes ripple{to{transform:scale(1);opacity:0}}
#modal{animation:mIn .18s ease-out}
#modal.closing{animation:mOut .17s ease-in forwards}
#modal.closing .card{animation:cOut .17s ease-in forwards}
@keyframes mIn{from{opacity:0}}
@keyframes mOut{to{opacity:0}}
@keyframes cOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
#stGold{position:relative;overflow:visible}
.gchip{position:absolute;right:.3rem;top:-.2rem;font-weight:700;font-size:.95rem;color:#2f6a1e;text-shadow:0 1px 0 rgba(255,255,255,.7);pointer-events:none;animation:gchip 1.1s ease-out forwards}
.gchip.neg{color:var(--red)}
@keyframes gchip{0%{transform:translateY(6px) scale(.7);opacity:0}15%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:translateY(-26px) scale(1);opacity:0}}
.ico{width:1.2em;height:1.2em;display:inline-block;vertical-align:-.24em;flex:none}
.coin{position:fixed;left:0;top:0;z-index:40;font-size:20px;line-height:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.banner{position:absolute;left:0;right:0;top:15%;display:flex;justify-content:center;pointer-events:none;z-index:3}
.banner .rib{position:relative;background:linear-gradient(#fbf3df,#ecdcb6);border:2px solid #3e3222;box-shadow:0 6px 20px rgba(0,0,0,.35);padding:.5rem 2.6rem .55rem;text-align:center;color:#2e2419;
  animation:ribIn .5s cubic-bezier(.2,1.4,.4,1) both, ribOut .45s ease-in 1.8s forwards}
.banner .rib::before,.banner .rib::after{content:"";position:absolute;top:14px;width:28px;height:100%;background:#d8c49a;border:2px solid #3e3222;z-index:-1}
.banner .rib::before{left:-22px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
.banner .rib::after{right:-22px;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
.banner b{display:block;font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:2rem;letter-spacing:.06em;line-height:1.1}
.banner small{display:block;font-style:italic;color:#6b5a42;font-size:.95rem;animation:fade .4s ease-out .25s both}
.banner.boss .rib{border-color:#9b2226;background:linear-gradient(#fbe9e2,#f0cfc2)}
.banner.boss small{color:#9b2226;font-weight:700}
@keyframes ribIn{0%{transform:scaleX(.05) scaleY(.6);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes ribOut{to{transform:translateY(-18px) scale(.94);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;left:0;top:0;border-radius:1px}
#stage canvas{transition:filter 1.2s ease}
#stage.defeat canvas{filter:grayscale(.75) sepia(.35) brightness(.85)}
button.afford{animation:afford .7s ease-out}
@keyframes afford{0%{box-shadow:0 0 0 0 rgba(232,194,74,.9)}100%{box-shadow:0 0 0 10px rgba(232,194,74,0)}}
/* ---------- UI integrada no mapa: sem barras, só peças a flutuar por cima ---------- */
:root{--glass:color-mix(in srgb,var(--bg) 93%,transparent)}
body{grid-template-rows:minmax(0,1fr);grid-template-areas:"stage"}
#stage{padding:0}
#stage canvas{box-shadow:none;border-radius:0}
#hud{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + .5rem);left:calc(env(safe-area-inset-left,0px) + .5rem);right:calc(env(safe-area-inset-right,0px) + .5rem);
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:.4rem;padding:0;border:0;background:none;box-shadow:none;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .top{display:none}
#hud .stats{flex:0 1 auto;display:flex;gap:0;background:var(--bg);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:.15rem .25rem;
  box-shadow:0 4px 14px var(--shadow),inset 0 0 0 2px var(--glass),inset 0 0 0 3px var(--line)}
#hud .st{flex:0 0 auto;background:none;border:0;box-shadow:none;padding:.2rem .5rem .35rem;border-radius:8px}
#hud .st+.st{border-left:1px dotted var(--line)}
#hud .sv small{display:none}
#hud .sv b{font-size:1.15rem}
#hud .bar{flex:0 0 auto;display:flex;gap:.35rem;margin-left:auto}
#hud .bar button:not(#bWave){width:42px;height:42px;min-width:0;min-height:0;padding:0;border-radius:50%;background:var(--bg);background:var(--glass);box-shadow:0 3px 10px var(--shadow)}
#bWave{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);
  min-width:min(16rem,64vw);min-height:50px;border-radius:999px;font-size:1.05rem;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 2px rgba(251,241,220,.35)}
#bWave:not(:disabled):active{transform:translateX(-50%) translateY(1px) scale(.97)}
#bWave:disabled{background:var(--glass);opacity:.92}
#abil{position:fixed;z-index:6;left:calc(env(safe-area-inset-left,0px) + .6rem);bottom:calc(env(safe-area-inset-bottom,0px) + .8rem + 72px);top:auto;transform:none;
  flex-direction:column-reverse;align-items:center;gap:.5rem;padding:0;border:0;background:none;box-shadow:none;transition:opacity .25s;pointer-events:none}
#abil .ab{transition:opacity .22s ease,transform .28s cubic-bezier(.2,1.3,.4,1),border-color .15s,background-color .15s}
#abil:not(.open) .ab{opacity:0;transform:translateY(30px) scale(.5);pointer-events:none}
#abil.open .ab{pointer-events:auto}
#abil.open .ab:nth-child(2){transition-delay:.04s}#abil.open .ab:nth-child(3){transition-delay:.08s}#abil.open .ab:nth-child(4){transition-delay:.12s}
#abilT{position:fixed;z-index:6;left:calc(env(safe-area-inset-left,0px) + .5rem);bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);width:64px;height:64px;min-height:0;padding:0;border-radius:50%;
  background:var(--bg);background:var(--glass);border:2px solid var(--line);box-shadow:0 4px 12px var(--shadow);transition:opacity .25s,transform .2s,border-color .15s}
#abilT .ai{font-size:1.9rem;line-height:1;display:inline-block;transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
#abilT[aria-expanded="true"]{border-color:var(--red)}
#abilT[aria-expanded="true"] .ai{transform:rotate(45deg) scale(.9)}
#abilT .dot{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);animation:pulse 1.4s ease-out infinite}
.ab{flex:0 0 auto;width:62px;height:62px;min-height:0;border-radius:50%;padding:.15rem;background:var(--bg);background:var(--glass);box-shadow:0 4px 12px var(--shadow)}
.ab .ai{font-size:1.55rem}
.ab .an{font-size:.58rem;letter-spacing:.02em}
.ab em{top:4px;right:50%;transform:translateX(50%);font-weight:700;color:var(--red)}
#zoomb{left:auto;right:calc(env(safe-area-inset-right,0px) + .5rem);top:50%;transform:translateY(-50%)}
#zoomb button{background:var(--bg);background:var(--glass)}
#panel{z-index:7}
@media (orientation:landscape) and (min-width:700px){
  #panel{top:4.2rem;bottom:.6rem;right:.6rem}
  body.panel-open #zoomb{opacity:0;pointer-events:none}
}
@media (orientation:portrait),(max-width:699px){
  #hud .stats{flex:1 1 100%;justify-content:space-around}
  .ab{width:54px;height:54px}.ab .ai{font-size:1.35rem}.ab .an{display:none}
  #zoomb button{width:34px;height:34px}
  body.panel-open #abil,body.panel-open #abilT,body.panel-open #zoomb{opacity:0;pointer-events:none}
  body.panel-open #abil .ab{pointer-events:none}
  #abilT{width:56px;height:56px}#abil{bottom:calc(env(safe-area-inset-bottom,0px) + .8rem + 64px)}
  body.panel-open #bWave{opacity:0;pointer-events:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>

  </div>

    <button id="bPause" aria-label="Pausa" data-ic="pause"></button>

  </div>
</header>
<div id="stage"><canvas id="c"></canvas>
  <div id="zoomb"><button data-z="in" aria-label="Aproximar">＋</button><button data-z="out" aria-label="Afastar">－</button><button data-z="reset" aria-label="Ver mapa inteiro">⤢</button></div>
  <div id="panel" aria-live="polite"></div></div>
<button id="abilT" aria-label="Poderes" aria-expanded="false" aria-controls="abil"><span class="ai" data-ic="powers"></span><b class="dot" hidden></b></button>

</nav>

/* ================= Geometria ================= */
function mkPath(pts){const seg=[];let len=0;for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push({a,b,L,s:len});len+=L;}return{pts,seg,len};}
function posAt(P,d){
  if(d<=0){const s=P.seg[0];return{x:s.a[0],y:s.a[1],a:Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0])};}
  for(const s of P.seg){if(d<=s.s+s.L){const t=(d-s.s)/s.L;return{x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t,a:Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0])};}}
  const l=P.pts[P.pts.length-1];return{x:l[0],y:l[1],a:0};
}
function dSeg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-dx*t,py-a[1]-dy*t);}
function dPoly(x,y,p){let m=1e9;for(let i=0;i<p.length;i++)m=Math.min(m,dSeg(x,y,p[i],p[(i+1)%p.length]));return m;}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
const riverTop=x=>34+Math.sin(x/70)*7, riverBot=x=>200+Math.sin(x/55+1)*6;
const inRiver=(x,y)=>y<riverBot(x);
function pp(f,r,a){return[f.cx+Math.cos(a)*r*f.sx,f.cy+Math.sin(a)*r*f.sy];}
function starFort(f){const pts=[],tips=[],d=Math.PI/f.n;
  for(let i=0;i<f.n;i++){const a=f.rot+i*2*Math.PI/f.n;
    pts.push(pp(f,f.R*0.72,a-d*0.45),pp(f,f.R*0.86,a-d*0.36),pp(f,f.R,a),pp(f,f.R*0.86,a+d*0.36),pp(f,f.R*0.72,a+d*0.45));tips.push(i*5+2);}
  return{pts,tips};}
function edgeGate(p,i,extra){const a=p[i],b=p[(i+1)%p.length];return Object.assign({x:(a[0]+b[0])/2,y:(a[1]+b[1])/2,a:Math.atan2(b[1]-a[1],b[0]-a[0])},extra||{});}

let LV=null,PATHS=[],SLOTS=[];
function loadLevel(id){
  LV=LEVELS[id];PATHS=LV.paths.map(mkPath);SLOTS=[];
  const wall=LV.wall,n=wall.length;
  LV.tips.forEach(({i,name})=>{
    const t=wall[i];
    if(LV.style==='medieval'){SLOTS.push({x:t[0],y:t[1],kind:'bal',name,tower:null});return;}
    const a=wall[(i-1+n)%n],b=wall[(i+1)%n];
    const la=Math.hypot(a[0]-t[0],a[1]-t[1]),lb=Math.hypot(b[0]-t[0],b[1]-t[1]);
    const dx=(a[0]-t[0])/la+(b[0]-t[0])/lb,dy=(a[1]-t[1])/la+(b[1]-t[1])/lb,L=Math.hypot(dx,dy);
    SLOTS.push({x:t[0]+dx/L*15,y:t[1]+dy/L*15,kind:'bal',name,tower:null});
  });
  LV.cand.forEach(([x,y,inside])=>{
    if(inside){if(dPath(x,y)>=30&&!SLOTS.some(s=>Math.hypot(s.x-x,s.y-y)<36))SLOTS.push({x,y,kind:'in',name:tr('Plataforma','Platform'),tower:null});return;}
    if(dPath(x,y)<32||inPoly(x,y,wall)||dPoly(x,y,wall)<(LV.style==='medieval'?26:16)||y<riverBot(x)+18)return;
    if(SLOTS.some(s=>Math.hypot(s.x-x,s.y-y)<36))return;
    if(LV.southRiver&&y>785)return;
    SLOTS.push({x,y,kind:'rev',name:LV.style==='medieval'?tr('Casa fortificada','Fortified house'):tr('Revelim','Ravelin'),tower:null});
  });
  LV.goal={x:PATHS[0].pts[PATHS[0].pts.length-1][0],y:PATHS[0].pts[PATHS[0].pts.length-1][1]};
  // o edifício mais perto do fim do caminho é o coração da praça: desenha-se por frame (06 salta-o) e mostra as vidas
  let hm=null,hd=60;LV.marks.forEach(m=>{const d=Math.hypot(m.x-LV.goal.x,m.y-LV.goal.y);if(d<hd){hd=d;hm=m;}});
  LV.marks.forEach(m=>m.heart=m===hm);
  LV.heart=hm?{x:hm.x,y:hm.y,m:hm}:{x:LV.goal.x,y:LV.goal.y-20,m:{w:24,h:24,keep:true}};
  // portas destrutíveis (o postigo fica de fora: esse rebenta na vaga 10): distância de cada uma ao longo de cada caminho
  LV.pathGates=PATHS.map(P=>{const out=[];LV.gates.forEach((g,i)=>{if(g.post)return;
    for(const sg of P.seg){if(dSeg(g.x,g.y,sg.a,sg.b)<3){const dx=sg.b[0]-sg.a[0],dy=sg.b[1]-sg.a[1];
      out.push({i,d:sg.s+Math.max(0,Math.min(1,((g.x-sg.a[0])*dx+(g.y-sg.a[1])*dy)/(dx*dx+dy*dy)))*sg.L});break;}}});return out.sort((a,b)=>a.d-b.d);});
}
function dPath(x,y){let m=1e9;for(const P of PATHS)for(const s of P.seg.slice(1))m=Math.min(m,dSeg(x,y,s.a,s.b));return m;}

function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.45;master.connect(AC.destination);}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function tone(type,f0,f1,dur,vol,delay){const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);}
function noise(dur,vol,fc,delay){const t=AC.currentTime+(delay||0),len=Math.max(1,Math.floor(AC.sampleRate*dur)),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;
  const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t);}
function sfx(n){
  if(!sndMode||!AC)return;const now=performance.now();if(lastS[n]&&now-lastS[n]<(n==='arrow'||n==='hit'?90:70))return;lastS[n]=now;

    case'arrow':tone('triangle',900,300,0.08,0.06);break;
    case'bolt':tone('sawtooth',520,120,0.12,0.06);break;

/* Vozes sintetizadas: o texto é convertido em sílabas e cada vogal é cantada
   com os seus formantes reais. Não depende das vozes do sistema, soa igual em todo o lado. */
const VOX={
  pt:{f0:120,dur:0.085,drift:-0.25,vol:0.20,wave:'sawtooth',reduce:true},      // soldados portugueses
  her:{f0:225,dur:0.08,drift:-0.15,vol:0.18,wave:'sawtooth',reduce:true},      // heroínas
  es:{f0:165,dur:0.062,drift:0.12,vol:0.19,wave:'sawtooth',trill:true},        // castelhanos: rápidos e exclamativos
  paco:{f0:86,dur:0.11,drift:0.05,vol:0.24,wave:'sawtooth',trill:true}          // Capitão Paco, voz grossa
};
const FORM={a:[800,1250,2600],e:[480,1900,2600],i:[300,2300,3000],o:[500,880,2500],u:[330,760,2400],y:[420,1500,2500]};
let voxUntil=0;
function strip(t){return t.toLowerCase().normalize('NFD').replace(/ã|õ/g,m=>m).replace(/[\u0300-\u036f]/g,'');}
function sylls(text){
  const t=strip(text).replace(/[^a-zç!?¡¿ ,.]/g,'');const out=[];let cons='';
  for(let i=0;i<t.length;i++){const ch=t[i];
    if('aeiou'.includes(ch)){const next=t[i+1]||' ';const end=!/[a-zç]/.test(next);out.push({c:cons,v:ch,end});cons='';}
    else if(/[a-zç]/.test(ch))cons+=ch;
    else{if(cons){out.push({c:cons,v:null,end:true});cons='';}out.push({p:ch});}}
  if(cons)out.push({c:cons,v:null,end:true});
  return out.slice(0,34);
}
function consonant(c,t,V){
  const last=c[c.length-1];
  if(/[szcçfxj]|ch/.test(c)&&!/[ptkbdg]$/.test(c)){noise(0.05,V.vol*0.55,5200,t-AC.currentTime);return 0.05;}
  if(/[ptkqbdg]/.test(last)){noise(0.018,V.vol*0.8,2600,t-AC.currentTime);return 0.025;}
  if(/r/.test(c)&&V.trill){for(let k=0;k<3;k++)noise(0.012,V.vol*0.5,1400,t-AC.currentTime+k*0.022);return 0.06;}
  if(/[mn]/.test(last)){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=V.f0;g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(V.vol*0.5,t+0.01);g.gain.linearRampToValueAtTime(0,t+0.05);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.06);return 0.04;}
  return 0.02;
}
function vowel(v,t,dur,f0,V){
  const F=FORM[v]||FORM.a,o=AC.createOscillator();o.type=V.wave;
  o.frequency.setValueAtTime(f0*(1+(Math.random()-0.5)*0.06),t);o.frequency.linearRampToValueAtTime(f0*(1+V.drift*0.15),t+dur);
  const vib=AC.createOscillator(),vg=AC.createGain();vib.frequency.value=5.5;vg.gain.value=f0*0.02;vib.connect(vg);vg.connect(o.frequency);
  const out=AC.createGain(),pk=V.vol*5;out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(pk,t+0.012);
  out.gain.setValueAtTime(pk,t+dur*0.75);out.gain.linearRampToValueAtTime(0,t+dur);
  F.forEach((fr,i)=>{const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fr;bp.Q.value=i===0?6:9;
    const g=AC.createGain();g.gain.value=[1,0.6,0.25][i];o.connect(bp);bp.connect(g);g.connect(out);});
  out.connect(master);o.start(t);vib.start(t);o.stop(t+dur+0.02);vib.stop(t+dur+0.02);
}
function speak(text,who){
  const V=VOX[who],sy=sylls(text);let t=AC.currentTime+0.03;const n=sy.length;
  const exclaim=/[!¡]/.test(text),ask=/[?¿]/.test(text);let k=0;
  for(const s of sy){
    if(s.p){t+=s.p===','?0.12:s.p===' '?0.035:0.1;continue;}
    k++;const prog=k/Math.max(1,n);
    let f0=V.f0*(1+V.drift*prog);if(exclaim&&k===1)f0*=1.25;if(ask&&prog>0.75)f0*=1.3;if(exclaim&&prog>0.85)f0*=who==='es'||who==='paco'?1.2:0.9;
    if(s.c)t+=consonant(s.c,t,V);
    if(s.v){let v=s.v,d=V.dur*(0.85+Math.random()*0.3);
      if(V.reduce&&s.end&&(v==='e'||v==='o')&&n>1){v=v==='e'?'y':'u';d*=0.5;}   // vogais finais fechadas, à portuguesa
      if(s.end&&!V.reduce)d*=1.25;
      vowel(v,t,d,f0,V);t+=d;}
  }
  return t-AC.currentTime;
}

            es:{speed:62,pitch:56,throat:128,mouth:140},paco:{speed:88,pitch:96,throat:100,mouth:110}};
const samCache=new Map();
function samBuffer(text,who){
  const key=who+'|'+text;if(samCache.has(key))return samCache.get(key);
  let out=null;
  try{
    const ph=PH[text];
    // em inglês, as falas portuguesas traduzidas são lidas pelo leitor inglês do próprio SAM
    const en=!ph&&LANG==='en'&&(who==='pt'||who==='her');
    if((ph||en)&&typeof window.SamJs==='function'){
      const sam=new window.SamJs(Object.assign({phonetic:!!ph},SAMV[who]));
      const raw=ph?sam.buf32(ph.replace(/!/g,'.'),true):sam.buf32(text.replace(/[«»“”—🧺👀🍞💰🇵🇹…]/g,'').replace(/’/g,"'").replace(/!/g,'.'),false);
      if(raw&&raw.length){
        let mean=0;for(let i=0;i<raw.length;i++)mean+=raw[i];mean/=raw.length;
        let pk=0;for(let i=0;i<raw.length;i++)pk=Math.max(pk,Math.abs(raw[i]-mean));
        const g=pk>0?0.7/pk:1,ab=AC.createBuffer(1,raw.length,22050),d=ab.getChannelData(0);
        for(let i=0;i<raw.length;i++)d[i]=(raw[i]-mean)*g;
        out=ab;
      }
    }
  }catch(e){out=null;}
  samCache.set(key,out);return out;
}
function say(text,lang,force,who){

    if(buf){const src=AC.createBufferSource();src.buffer=buf;const g=AC.createGain();g.gain.value=1.1;src.connect(g);g.connect(master);src.start();voxUntil=now+buf.duration;}
    else{const d=speak(text,who);voxUntil=now+d;}
  }catch(e){}
}

/* ================= Combate ================= */
function tstat(t){
  const T=TYPES[t.k];let s;
  if(t.lv<3){const L=t.lv-1;s={dmg:T.dmg[L],range:T.range[L],rate:T.rate[L],splash:T.splash?T.splash[L]:0,slow:T.slow?T.slow[L]:1,pierce:!!T.pierce,burn:null};}
  else{const B=T.br[t.br];s={dmg:B.dmg,range:B.range,rate:B.rate,splash:B.splash||0,slow:B.slow||1,pierce:!!T.pierce,burn:B.burn||null};
    // nível 4: a especialização escolhida fica mais forte
    if(t.lv>=4){s.dmg*=1.4;s.range*=1.08;s.rate*=0.9;if(s.splash)s.splash*=1.15;if(s.burn)s.burn={dps:s.burn.dps*1.3,t:s.burn.t};if(s.slow<1)s.slow=Math.max(0.1,1-(1-s.slow)*1.2);}}
  const M=S.mods;s.dmg*=M.dmg;s.range*=M.range;s.rate*=M.rate;if(t.k==='cal')s.dmg*=M.oil;
  if(S.weather==='noite'&&!M.sight)s.range*=0.85;
  if(S.weather==='chuva'){if(t.k==='cal')s.dmg*=0.6;s.burn=null;}
  return s;
}
function hurt(e,dmg,pierce,src,silent){
  if(e.dead)return;
  let d=pierce?dmg:Math.max(dmg*0.25,dmg-e.armor);d=Math.min(d,e.hp);
  e.hp-=d;if(src&&typeof src==='object')src.dmgDone=(src.dmgDone||0)+d;
  if(!silent&&Math.random()<0.25)sfx('hit');
  if(e.hp<=0.001)kill(e,src);
}
function kill(e,src){
  e.dead=true;
  const owner=(src&&typeof src==='object'&&src.owner)||'both';
  S.combo++;S.comboT=COMBO_T;S.comboPop=1;
  const tier=COMBO.find(c=>c[0]===S.combo);
  if(tier){S.texts.push({x:W/2,y:600,s:tier[2]+tr(' Ouro ×',' Gold ×')+tier[1],t:0,T:2,big:true});sfx('ach');jolt(2.5);
    if(S.combo>=COMBO[COMBO.length-1][0])unlock('aljubarrota');}
  const gold=Math.round(e.gold*S.mods.gold*comboMult());
  addGold(owner,gold);coinFly(e.x,e.y);S.stats.kills++;S.stats.byType[e.t]=(S.stats.byType[e.t]||0)+1;S.stats.combo=Math.max(S.stats.combo||0,S.combo);
  S.texts.push({x:e.x,y:e.y-10,s:'+'+gold,t:0,T:0.9});
  if(e.gold>=7)sfx('coin');
  S.parts.push({k:'flag',x:e.x,y:e.y-6,vy:-30,rot:0,vr:(Math.random()-0.5)*8,t:0,T:1.1});
  chips(e.x,e.y,e.r>10?7:4,e.col,e.r>10?1.2:0.8);
  if(e.t==='ari'||e.t==='torre')jolt(3);
  if(src==='hero'){S.hero.kills++;S.hero.lv=Math.min(10,1+Math.floor(S.hero.kills/8));if(S.hero.kills>=100)unlock('padeira');}
  if(e.t==='mini'){S.stats.minis++;if(S.stats.minis>=50)unlock('sardinha');}
  if(e.t==='cont'){S.stats.cont++;if(S.stats.cont>=25)unlock('fiscal');}
  if(e.f.boss){
    const b=LS.get('bosses',{});b[e.t]=1;LS.set('bosses',b);if(['merc','coca','polvo','cervo'].every(k=>b[k]))unlock('lendas');
    S.texts.push({x:e.x,y:e.y-34,s:e.f.death,t:0,T:3,sp:true});smoke(e.x,e.y,18);sfx('boom');
    jolt(12);S.stop=0.22;S.flash=Math.max(S.flash,0.3);S.flashC='255,236,190';chips(e.x,e.y,22,e.col,1.8);
    S.fx.push({k:'boom',x:e.x,y:e.y,r:55,t:0,T:0.7});
    if(e.t==='merc'){addGold('both',150);S.texts.push({x:e.x,y:e.y+22,s:tr('Liquidação total! +150 💰','Clearance sale! +150 💰'),t:0,T:2.2});}
  }
  else if(e.t==='cap'){S.texts.push({x:e.x,y:e.y-28,s:tr('«¡Volveré!» — Capitão Paco','«¡Volveré!» — Captain Paco'),t:0,T:2.2,sp:true});jolt(6);S.stop=0.1;say('¡Volveré!','es-ES',true,'paco');unlock('paco');}
  else if(Math.random()<0.14&&e.t!=='mini'){const q=pick(Q.die);S.texts.push({x:e.x,y:e.y-24,s:q,t:0,T:1.4,sp:true});say(q,'es-ES');}
  if(e.f.brood){
    for(let k=0;k<e.f.brood;k++){const c=mkFoe('mini',e.p,Math.max(0,e.d-k*7));c.off=(Math.random()-0.5)*16;S.born.push(c);}
    S.fx.push({k:'boom',x:e.x,y:e.y,r:28,t:0,T:0.5});smoke(e.x,e.y,10);sfx('boom');
    S.texts.push({x:e.x,y:e.y+14,s:pick(Q.torre),t:0,T:1.3,sp:true});
  }
}

const GATE_HP=450;
// força com que cada inimigo arromba uma porta (por segundo)
const gateDps=e=>(e.t==='ari'?55:e.f.boss?40:e.t==='cap'?25:e.t==='torre'?14:e.t==='esc'?8:e.t==='mini'?3:5)*S.diff.dmg;
function breakGate(i){const G=S.gates[i],g=LV.gates[i];G.broken=true;G.hp=0;
  S.fx.push({k:'boom',x:g.x,y:g.y,r:30,t:0,T:0.6});smoke(g.x,g.y,10);chips(g.x,g.y,14,'#7a5230',1.3);sfx('smash');jolt(5);
  S.texts.push({x:g.x,y:g.y-26,s:tr('Arrombaram a porta!','They broke the gate!'),t:0,T:2,big:true});}
function repairGates(){S.gates.forEach((G,i)=>{const g=LV.gates[i];if(g.post)return;if(G.broken||G.hp<G.max){chips(g.x,g.y,6,'#c9971c',0.6);S.fx.push({k:'ring',x:g.x,y:g.y,r:24,t:0,T:0.6,c:'201,151,28'});}
  G.broken=false;G.hp=G.max;});}
function useAbility(k,x,y,who){
  // os poderes só servem depois de a primeira vaga começar (senão o sino dava ouro à vontade antes do jogo começar)
  if(S.over||!S.started||S.wave<1)return;
  if(k==='rain'){
    if(S.cd.rain>0||x==null)return;
    S.cd.rain=ABIL.rain.cd*S.mods.cd;S.fx.push({k:'rain',x,y,r:62,t:0,T:1.3,hits:0});sfx('arrow');
  }else if(k==='gate'){
    if(S.cd.gate>0)return;S.cd.gate=ABIL.gate.cd*S.mods.cd;
    for(const e of S.enemies)if(!inRiver(e.x,e.y))e.stunT=Math.max(e.stunT,e.f.boss?1.5:4);
    repairGates();
    S.texts.push({x:W/2,y:440,s:tr('Portas fechadas e reparadas!','Gates shut and repaired!'),t:0,T:2,big:true});sfx('horn');say(tr('Portas fechadas!','Gates shut!'),'pt-PT',true);
  }else if(k==='bell'){
    if(S.cd.bell>0)return;S.cd.bell=ABIL.bell.cd*S.mods.cd;const g=25+5*S.wave;if(S.local)addGold('all',Math.ceil(g/2));else addGold(who||1,g);S.stats.bells++;
    const m=LV.marks[0];S.fx.push({k:'ring',x:m.x,y:m.y,r:60,t:0,T:1.2,c:'201,151,28'});
    S.texts.push({x:m.x,y:m.y-40,s:tr('Dlim-dlão! +','Ding-dong! +')+g+' 💰',t:0,T:1.8});sfx('bell');if(S.stats.bells>=10)unlock('sino');
  }
}
function heroSpecial(){

function updateHero(dt){
  const h=S.hero;
  if(h.dead){h.respawn-=dt;if(h.respawn<=0){h.dead=false;h.hp=h.max;h.x=LV.goal.x+26;h.y=LV.goal.y+14;h.tx=null;}return;}
  h.max=h.D.hp*(1+0.1*(h.lv-1))*S.mods.hero;
  if(h.tx!=null){const dx=h.tx-h.x,dy=h.ty-h.y,d=Math.hypot(dx,dy),st=100*dt;
    if(d<=st){h.x=h.tx;h.y=h.ty;h.tx=null;}else{h.x+=dx/d*st;h.y+=dy/d*st;h.ang=Math.atan2(dy,dx);}}
  let blk=[];
  for(const e of S.enemies)e.blocked=false;
  if(h.tx==null){for(const e of S.enemies)if(!e.dead&&!e.f.fly&&!inRiver(e.x,e.y)&&Math.hypot(e.x-h.x,e.y-h.y)<(e.f.boss?24:16))blk.push(e);
    blk.sort((a,b)=>b.d-a.d);blk=blk.slice(0,3);blk.forEach(e=>e.blocked=true);}
  if(blk.length){h.quiet=0;let dps=0;blk.forEach(e=>dps+=(e.f.boss?45:e.t==='cap'?30:(e.t==='ari'||e.t==='torre')?12:5));h.hp-=dps*dt*S.diff.dmg;}
  else{h.quiet+=dt;if(h.quiet>2)h.hp=Math.min(h.max,h.hp+10*dt);}
  if(h.hp<=0){h.dead=true;h.respawn=12;S.enemies.forEach(e=>e.blocked=false);S.texts.push({x:h.x,y:h.y-26,s:pick(Q.heroDie),t:0,T:2,sp:true});return;}
  h.cd-=dt;h.swing=Math.max(0,h.swing-dt);
  if(h.cd<=0){
    let tg=null,bd=h.D.range;
    for(const e of S.enemies){if(e.dead||inRiver(e.x,e.y))continue;const d=Math.hypot(e.x-h.x,e.y-h.y);if(d<=bd){bd=d;tg=e;}}
    if(tg){h.cd=h.D.rate;h.ang=Math.atan2(tg.y-h.y,tg.x-h.x);const dmg=h.D.dmg*(1+0.12*(h.lv-1))*S.mods.hero;
      if(h.D.melee){hurt(tg,dmg,false,'hero');h.swing=0.2;sfx('hit');}
      else S.proj.push({k:'bread',x:h.x,y:h.y,tg,lx:tg.x,ly:tg.y,sp:320,dmg,pierce:false,src:'hero'});}
  }
}
function nearestTower(e,R){let b=null,bd=R;for(const t of S.towers){const d=Math.hypot(t.x-e.x,t.y-e.y);if(d<bd&&!(t.disT>0)){bd=d;b=t;}}return b;}
function bossAct(e){
  const b=e.f.boss;
  if(b==='merc'){e.bcd=4;
    for(const o of S.enemies)if(!o.dead&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<85)o.hp=Math.min(o.max,o.hp+o.max*0.08);
    e.hp=Math.min(e.max,e.hp+e.max*0.015);S.fx.push({k:'ring',x:e.x,y:e.y,r:80,t:0,T:0.8,c:'201,151,28'});
    S.texts.push({x:e.x,y:e.y-36,s:pick(['¡Toallas a mitad de precio!',tr('Toalhas fofinhas para todos!','Fluffy towels for everyone!'),'¡Oferta especial!','¡Tres por dos!']),t:0,T:1.6,sp:true});}
  else if(b==='coca'||b==='polvo'){e.bcd=5;const t=nearestTower(e,b==='coca'?150:130);
    if(t){t.disT=b==='coca'?3:4;t.disK=b;S.fx.push({k:b==='coca'?'fire':'tent',x:e.x,y:e.y,x2:t.x,y2:t.y,r:0,t:0,T:0.9});sfx('roar');
      S.texts.push({x:t.x,y:t.y-26,s:b==='coca'?tr('Queimou-nos a torre!','Our tower’s on fire!'):tr('Larga-me, bicho!','Let go of me, beast!'),t:0,T:1.6,sp:true});}}
  else if(b==='cervo'){e.bcd=5;if(!inRiver(e.x,e.y)&&!e.blocked){e.d+=75;smoke(e.x,e.y,8);sfx('smash');S.texts.push({x:e.x,y:e.y-32,s:tr('O Cervo investe!','The Stag charges!'),t:0,T:1.4,sp:true});}}
}
function update(dt){
  S.t+=dt;S.stats.time+=dt;
  for(const k in S.cd)if(S.cd[k]>0)S.cd[k]=Math.max(0,S.cd[k]-dt);
  S.idleT-=dt;if(S.idleT<=0){S.idleT=9+Math.random()*9;if(S.towers.length){const t=pick(S.towers),q=pick(Q.idle);S.texts.push({x:t.x,y:t.y-26,s:q,t:0,T:2.6,sp:true});say(q,'pt-PT');}}
  if(S.spawning){
    S.spawnT-=dt;
    while(S.queue.length&&S.spawnT<=0){const q=S.queue.shift();spawn(q.t);S.spawnT+=q.gap;}
    if(!S.queue.length){S.spawning=false;S.pendingBonus+=20+S.wave*3;S.nextT=(S.infinite||S.wave<MAXW)?18:null;}
  }else if(S.nextT!=null&&S.wave>0){S.nextT-=dt;if(S.nextT<=0){S.nextT=null;startWave(false);}}
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}
  updateHero(dt);
  for(const e of S.enemies){
    if(e.dead)continue;
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=1;}
    if(e.stunT>0){e.stunT-=dt;e.cur=0;if(e.stunT<=0)e.eat=false;}
    else if(e.blocked)e.cur=0;
    else{e.cur=e.spd*e.slowF*(S.weather==='chuva'?0.9:1);e.d+=e.cur*dt;
      if(!e.f.fly)for(const q of LV.pathGates[e.p]){const G=S.gates[q.i];if(G.broken||e.d>=q.d+2)continue;const stop=q.d-e.r-7;
        if(e.d>stop&&e.d<q.d+2){e.d=stop;e.cur=0;G.hp-=gateDps(e)*dt;G.hitT=0.15;if(Math.random()<dt*3)chips(LV.gates[q.i].x,LV.gates[q.i].y,1,'#7a5230',0.5);
          if(G.hp<=0)breakGate(q.i);}break;}}
    if(e.burnT>0){e.burnT-=dt;hurt(e,e.burnD*dt,true,e.burnSrc,true);if(e.dead)continue;}
    if(e.f.boss){e.bcd-=dt;if(e.bcd<=0)bossAct(e);}
    if(e.f.heal){e.healCd-=dt;if(e.healCd<=0){e.healCd=1.5;let any=false;
      for(const o of S.enemies)if(!o.dead&&o.hp<o.max&&Math.hypot(o.x-e.x,o.y-e.y)<60){o.hp=Math.min(o.max,o.hp+o.max*0.06);any=true;}
      if(any)S.fx.push({k:'ring',x:e.x,y:e.y,r:55,t:0,T:0.6,c:'74,140,60'});}}
    const P=PATHS[e.p],p=posAt(P,e.d);e.a=p.a;e.x=p.x-Math.sin(p.a)*e.off;e.y=p.y+Math.cos(p.a)*e.off;
    if(e.d>=P.len){e.dead=true;S.fx.push({k:'ring',x:e.x,y:e.y,r:30,t:0,T:0.6});sfx('leak');
      if(e.f.steal){const g=Math.min(S.gold,20+S.wave*2);S.gold-=g;if(S.coop)S.gold2-=Math.min(S.gold2,g);S.texts.push({x:e.x,y:e.y-26,s:pick(Q.steal)+' −'+g+'💰',t:0,T:1.8,sp:true});}
      else{S.lives-=e.leak;hitHeart(e.leak);if(Math.random()<0.5)S.texts.push({x:e.x,y:e.y-26,s:pick(Q.leak),t:0,T:1.6,sp:true});}}
  }
  if(S.lives<=0&&!S.over){S.lives=0;endGame(false);return;}
  const fog=S.weather==='nevoeiro';
  for(const t of S.towers){
    if(t.disT>0){t.disT-=dt;continue;}
    const st=tstat(t);t.cd-=dt;if(t.cd>0)continue;
    if(t.k==='cal'){
      let any=false;
      for(const e of S.enemies){if(!e.dead&&!e.f.fly&&Math.hypot(e.x-t.x,e.y-t.y)<=st.range){any=true;hurt(e,st.dmg,false,t,true);if(!e.f.noslow){e.slowT=1.2;e.slowF=Math.min(e.slowF,st.slow);}}}
      if(any){t.cd=st.rate;S.fx.push({k:'oil',x:t.x,y:t.y,r:st.range,t:0,T:0.7});sfx('oil');}
      continue;
    }
    let tg=null,best=-Infinity;
    for(const e of S.enemies){
      if(e.dead)continue;const d=Math.hypot(e.x-t.x,e.y-t.y);if(d>st.range)continue;
      if(fog&&!S.mods.sight&&inRiver(e.x,e.y)&&!e.f.boss)continue;
      let v;switch(t.pri){case'forte':v=e.hp;break;case'rapido':v=e.spd*e.slowF;break;case'perto':v=-d;break;default:v=e.d/PATHS[e.p].len;}
      if(v>best){best=v;tg=e;}
    }
    if(!tg)continue;
    t.cd=st.rate;t.kick=1;t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);
    if(t.k==='tra'){
      const sp=240,dist=Math.hypot(tg.x-t.x,tg.y-t.y),tof=Math.max(0.3,dist/sp);
      const fp=posAt(PATHS[tg.p],tg.d+tg.cur*tof);
      S.proj.push({k:'stone',sx:t.x,sy:t.y,tx:fp.x,ty:fp.y,t:0,T:tof,dmg:st.dmg,sr:st.splash,burn:st.burn,src:t});sfx('bolt');
    }else{
      S.proj.push({k:t.k==='arq'?'arrow':'bolt',x:t.x,y:t.y,tg,lx:tg.x,ly:tg.y,sp:t.k==='arq'?480:620,dmg:st.dmg,pierce:st.pierce,burn:st.burn,src:t});
      sfx(t.k==='arq'?'arrow':'bolt');
    }
  }
  for(const p of S.proj){
    if(p.k==='stone'){
      p.t+=dt;
      if(p.t>=p.T){p.done=true;
        for(const e of S.enemies){if(!e.dead&&!e.f.fly&&Math.hypot(e.x-p.tx,e.y-p.ty)<=p.sr){hurt(e,p.dmg,false,p.src,true);if(p.burn&&!e.dead){e.burnT=p.burn.t;e.burnD=p.burn.dps;e.burnSrc=p.src;}}}
        S.fx.push({k:'boom',x:p.tx,y:p.ty,r:p.sr,t:0,T:0.45});chips(p.tx,p.ty,5,p.burn?'#c0561e':'#6d624e');sfx('boom');jolt(0.8);}
    }else{
      if(p.tg&&!p.tg.dead){p.lx=p.tg.x;p.ly=p.tg.y;}
      const dx=p.lx-p.x,dy=p.ly-p.y,d=Math.hypot(dx,dy),st=p.sp*dt;p.ang=Math.atan2(dy,dx);
      if(d<=st+4){p.done=true;if(p.tg&&!p.tg.dead){hurt(p.tg,p.dmg,p.pierce,p.src);if(p.burn&&!p.tg.dead){p.tg.burnT=p.burn.t;p.tg.burnD=p.burn.dps;p.tg.burnSrc=p.src;}}}
      else{p.x+=dx/d*st;p.y+=dy/d*st;}
    }
  }
  for(const f of S.fx){
    if(f.k==='rain'){const hitsDue=Math.floor(f.t/0.4);while(f.hits<Math.min(3,hitsDue)){f.hits++;
      for(const e of S.enemies)if(!e.dead&&Math.hypot(e.x-f.x,e.y-f.y)<=f.r)hurt(e,30+S.wave*2.5,false,null,true);sfx('arrow');}}
  }
  S.proj=S.proj.filter(p=>!p.done);

function ageVisuals(dt){

  for(const G of S.gates)if(G.hitT>0)G.hitT-=dt;

    if(p.k==='smoke'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=8*dt;}
    else if(p.k==='flag'){p.vy+=90*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}

}

function drawHeart(){

  ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeRect(-w/2,-h/2,w,h);

  for(let i=0;i<nm;i++){if(gone.includes(i%6))continue;const x=-w/2+1+i*(w-2)/nm;ctx.fillStyle='#8d7f66';ctx.fillRect(x,-h/2-4,(w-2)/nm*0.55,4);ctx.strokeRect(x,-h/2-4,(w-2)/nm*0.55,4);}
  // torre central (com cruz se for igreja)

    ctx.fillStyle='#2e2419';ctx.fillRect(-2,-h/2-th+4,4,5);}
  else{ctx.fillStyle='#6d624e';for(let i=0;i<6;i++)ctx.fillRect(-tw/2+(i*7%tw),-h/2-4-(i*5%9),4,3);}
  const top=-h/2-th;

  // rachas
  ctx.strokeStyle='rgba(46,36,25,.85)';ctx.lineWidth=1.1;

    ctx.beginPath();ctx.moveTo(-3,-h/2-th+2);ctx.lineTo(1,-h/2-6);ctx.lineTo(-2,-h/2+4);ctx.stroke();}
  // bandeira (branca com as quinas azuis, como a de D. Afonso Henriques) no topo da torre

    const fw=st>=3?12:20,fh=st>=3?9:13,wv=k=>Math.sin(S.t*6-k*0.45)*2*(k/fw);

    ctx.fillStyle=st>=3?'#cfc6b0':'#f4efe2';ctx.fill();ctx.stroke();

  // fogo

/* ================= Zoom ================= */
const VW=()=>(W+2*MX)/VIEW.z,VH=()=>(H+2*MY)/VIEW.z;
function clampView(){VIEW.ox=Math.max(-MX,Math.min(W+MX-VW(),VIEW.ox));VIEW.oy=Math.max(-MY,Math.min(H+MY-VH(),VIEW.oy));}
let bzT=null;
function bgZoomCheck(){const want=VIEW.z>1.5?2:1;const nb=(cv.width*cv.height*want*want>24e6)?1:want;
  if(nb!==BZ){clearTimeout(bzT);bzT=setTimeout(()=>{BZ=nb;drawBG();},160);}}
function setZoom(nz,wx,wy,sx,sy){
  nz=Math.max(1,Math.min(3,nz));
  if(wx==null){wx=VIEW.ox+VW()/2;wy=VIEW.oy+VH()/2;sx=(W+2*MX)*scale/2;sy=(H+2*MY)*scale/2;}
  VIEW.z=nz;VIEW.ox=wx-sx/(scale*nz);VIEW.oy=wy-sy/(scale*nz);clampView();bgZoomCheck();
}
function toWorld(cx,cy){const r=cv.getBoundingClientRect();return{x:VIEW.ox+(cx-r.left)/(scale*VIEW.z),y:VIEW.oy+(cy-r.top)/(scale*VIEW.z),sx:cx-r.left,sy:cy-r.top};}
const PTR=new Map();let G={k:'none'};
cv.addEventListener('pointerdown',e=>{
  audio();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PTR.size===1)G={k:'tap',x0:e.clientX,y0:e.clientY,ox:VIEW.ox,oy:VIEW.oy};
  else if(PTR.size===2){const[a,b]=[...PTR.values()];const m=toWorld((a.x+b.x)/2,(a.y+b.y)/2);G={k:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:VIEW.z,wx:m.x,wy:m.y};}
});
cv.addEventListener('pointermove',e=>{
  if(!PTR.has(e.pointerId))return;PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(G.k==='pinch'&&PTR.size>=2){const[a,b]=[...PTR.values()];const r=cv.getBoundingClientRect();
    setZoom(G.z0*Math.hypot(a.x-b.x,a.y-b.y)/G.d0,G.wx,G.wy,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);}
  else if((G.k==='tap'||G.k==='pan')&&PTR.size===1){const dx=e.clientX-G.x0,dy=e.clientY-G.y0;
    if(G.k==='tap'&&Math.hypot(dx,dy)>8&&VIEW.z>1.01)G.k='pan';
    if(G.k==='pan'){VIEW.ox=G.ox-dx/(scale*VIEW.z);VIEW.oy=G.oy-dy/(scale*VIEW.z);clampView();}}
});
function ptrEnd(e){
  if(!PTR.has(e.pointerId))return;PTR.delete(e.pointerId);
  if(G.k==='tap'&&e.type==='pointerup'&&Math.hypot(e.clientX-G.x0,e.clientY-G.y0)<=8){const w=toWorld(e.clientX,e.clientY);onTap(w.x,w.y);}
  if(PTR.size===0||G.k==='pinch')G={k:'none'};
}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const w=toWorld(e.clientX,e.clientY);setZoom(VIEW.z*(e.deltaY<0?1.15:1/1.15),w.x,w.y,w.sx,w.sy);},{passive:false});
$('zoomb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const z=b.dataset.z;
  if(z==='in')setZoom(VIEW.z*1.35);else if(z==='out')setZoom(VIEW.z/1.35);else setZoom(1);});

function act(a){
  if(!S)return;
  if(S.remote){if(NET.R)NET.R.emit('act',a).catch(()=>{});}
  else doAct(a,S.me||1);
  lastGold=-1;renderPanel();
}
function doAct(a,who){
  if(!S||S.over)return;
  const s=a.i!=null?SLOTS[a.i]:null;
  switch(a.a){
    case'build':{const T=TYPES[a.k];if(!s||s.tower||!T||!pay(who,T.cost))return;S.built.add(a.k);
      s.tower={k:a.k,lv:1,br:0,cd:0,spent:T.cost,x:s.x,y:s.y,ang:-Math.PI/2,pri:'primeiro',dmgDone:0,owner:who,si:a.i};S.towers.push(s.tower);sfx('coin');built(s);
      if(Math.random()<0.6){const q=pick(Q.build);S.texts.push({x:s.x,y:s.y-26,s:q,t:0,T:1.6,sp:true});say(q,'pt-PT');}break;}
    case'up':{const t=s&&s.tower;if(!t||(t.lv!==1&&t.lv!==3))return;const c=TYPES[t.k].up[t.lv===1?0:2];if(!pay(who,c))return;t.spent+=c;t.lv++;sfx('coin');built(s,t.lv===4);break;}
    case'br':{const t=s&&s.tower;if(!t||t.lv!==2)return;const c=TYPES[t.k].up[1];if(!pay(who,c))return;t.spent+=c;t.lv=3;t.br=a.b?1:0;sfx('coin');built(s,true);break;}
    case'pri':{const t=s&&s.tower;if(!t)return;const ks=Object.keys(PRI);t.pri=ks[(ks.indexOf(t.pri)+1)%ks.length];break;}
    case'sell':{const t=s&&s.tower;if(!t||(t.owner||1)!==who)return;const g=Math.floor(t.spent*0.7);if(who===2)S.gold2+=g;else S.gold+=g;
      S.towers=S.towers.filter(x=>x!==t);s.tower=null;break;}
    case'abil':useAbility(a.k,a.x,a.y,who);break;
    case'hero':{const h=S.hero;if(h.dead)return;if(!inRiver(a.x,a.y)&&a.x>12&&a.x<W-12&&a.y<H-12&&!(LV.southRiver&&a.y>790)){h.tx=a.x;h.ty=a.y;}break;}
    case'heroSp':heroSpecial();break;
    case'wave':startWave(true,who);break;
    case'card':{if(!S.offer||!S.offer.includes(a.id))return;const c=CARDS.find(x=>x.id===a.id);S.offer=null;applyCard(c);if(S.coop)S.paused=false;saveGame();break;}
  }
  NET.twDirty=true;
}

  if(!S||S.over)return;

function clearSave(){try{localStorage.removeItem('cerco-save');}catch(e){}}
function loadSave(){
  const d=LS.get('save',null);if(!d||!LEVELS[d.lvl])return;
  newGame(d.lvl,d.di,d.hero);
  Object.assign(S,{gold:d.gold,lives:d.lives,startLives:d.sl,wave:d.wave,cOpen:d.cOpen,infinite:d.inf,campaign:d.camp,stats:d.st,built:new Set(d.built)});
  S.hero.kills=d.hk;S.hero.lv=Math.min(10,1+Math.floor(d.hk/8));
  // efeitos imediatos (vidas, ouro) já estão no que se guardou; só se reaplicam os modificadores
  S.cards=(d.cards||[]).filter(id=>CARDS.some(c=>c.id===id));S.cards.forEach(id=>{const c=CARDS.find(x=>x.id===id);if(!c.now)applyCard(c,true);});
  S.offer=Array.isArray(d.offer)&&d.offer.every(id=>CARDS.some(c=>c.id===id))?d.offer:null;S.dmgStage=heartStage();
  d.tw.forEach(([si,k,lv,br,pri,spent,dmg])=>{const s=SLOTS[si];if(!s)return;const t={k,lv,br,cd:0,spent,x:s.x,y:s.y,ang:-Math.PI/2,pri,dmgDone:dmg,owner:1,si};s.tower=t;S.towers.push(t);});
  if(S.cOpen)drawBG();
  S.started=true;S.paused=false;S.nextT=S.wave>0?18:null;
  toast(tr('Partida retomada depois da vaga ','Game resumed after wave ')+S.wave+'.');
}

let ROOM=null;
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')ROOM=await window.claude.use('room');}catch(e){ROOM=null;}})();
let NET={};
const ET=Object.keys(FOES),PRIK=Object.keys(PRI);
/* Transporte: dentro do claude.ai usa a capacidade room; noutros sites usa PeerJS (WebRTC direto).
   Os dois expõem a mesma interface: emit(tópico,dados), on(tópico,fn), onPeers(fn), leave(). */
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
const PEER_SRC='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
let peerLoad=null;
function loadPeer(){
  if(window.Peer)return Promise.resolve();if(peerLoad)return peerLoad;
  peerLoad=new Promise((res,rej)=>{const s=document.createElement('script');s.src=PEER_SRC;s.async=true;
    s.onload=()=>window.Peer?res():rej({code:'peerjs'});s.onerror=()=>{peerLoad=null;rej({code:'peerjs'});};document.head.appendChild(s);});
  return peerLoad;
}
function peerJoin(code,role){
  return loadPeer().then(()=>new Promise((res,rej)=>{
    const hs={},conns={},leaveHs=[],hostId='minhodef-'+code;let myId=null,done=false;
    // STUN para descobrir o endereço público; TURN (servidores do PeerJS) para quando a ligação direta é bloqueada
    const opts={debug:0,config:{iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},{urls:'stun:stun.cloudflare.com:3478'},
      {urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}]}};
    const peer=role==='host'?new window.Peer(hostId,opts):new window.Peer(opts);
    const fail=e=>{if(done)return;done=true;clearTimeout(sigT);try{peer.destroy();}catch(_){}rej(e);};
    // sem resposta do servidor de sinalização: não ficar à espera para sempre
    const sigT=setTimeout(()=>fail({code:'signal-timeout'}),15000);
    const R={
      emit:(t,d)=>{const msg={t,d};Object.values(conns).forEach(c=>{try{if(c.open)c.send(msg);}catch(_){}});
        (hs[t]||[]).forEach(h=>h({data:JSON.parse(JSON.stringify(d)),peer:myId,isMe:true,sameTab:true}));return Promise.resolve();},
      on:(t,h)=>{(hs[t]=hs[t]||[]).push(h);return()=>{};},
      onPeers:h=>{leaveHs.push(h);return()=>{};},
      leave:()=>{try{peer.destroy();}catch(_){}}
    };
    const wire=c=>{conns[c.peer]=c;
      c.on('data',m=>{if(!m||typeof m!=='object'||typeof m.t!=='string')return;(hs[m.t]||[]).forEach(h=>h({data:m.d,peer:c.peer,isMe:false,sameTab:false}));});
      c.on('close',()=>{delete conns[c.peer];leaveHs.forEach(h=>h({joined:[],left:[{peer:c.peer}]}));});};
    // o anfitrião fica a saber quando alguém tenta entrar mas a ligação direta não abre
    const watchIn=c=>{const t=setTimeout(()=>{if(!c.open)toast(tr('<b>Alguém tentou entrar</b>, mas a ligação entre os dois aparelhos falhou. Experimentem estar na mesma rede Wi-Fi.','<b>Someone tried to join</b>, but the connection between the two devices failed. Try being on the same Wi-Fi network.'));},12000);
      c.on('open',()=>clearTimeout(t));};
    peer.on('error',e=>fail({code:e&&e.type||'erro'}));
    peer.on('open',id=>{myId=id;clearTimeout(sigT);
      if(role==='host'){peer.on('connection',c=>{watchIn(c);c.on('open',()=>wire(c));});done=true;res(R);}
      else{const c=peer.connect(hostId,{reliable:true,serialization:'json'});
        c.on('open',()=>{if(done)return;wire(c);done=true;res(R);});
        c.on('error',()=>fail({code:'conn-failed'}));
        // o servidor encontrou a sala (senão dava peer-unavailable), mas a ligação direta não abriu
        setTimeout(()=>fail({code:'conn-failed'}),15000);}
    });
  }));
}
/* Na sala do claude.ai só quem tem acesso de Contributor ou mais pode emitir eventos; quem só vê (Viewer) pode apenas mudar a
   sua presença. Cada lado tenta emit e, se for recusado, passa a mandar as mensagens pela presença: uma fila numerada que
   os outros leem em onPeers. Os tópicos de estado (st, tw) guardam só a última versão; os outros caducam ao fim de 4 s. */
function claudeRoom(NR){
  const hs={},seen={},STATE={st:1,tw:1};let mode='ev',seq=0,q=[],cleanT=null;
  const me=()=>{const p=NR.peers().find(x=>x.sameTab);return p?p.peer:null;};
  const deliver=(t,m)=>(hs[t]||[]).forEach(h=>{try{h(m);}catch(e){console.error(e);}});
  const flush=()=>{
    const now=Date.now();q=q.filter(x=>STATE[x.t]||x.x>now);
    const arr=q.map(x=>[x.s,x.t,x.d]);let s=JSON.stringify(arr);
    while(s.length>3700&&arr.length>1){let i=arr.findIndex(a=>STATE[a[1]]);if(i<0||i===arr.length-1)i=0;arr.splice(i,1);s=JSON.stringify(arr);}
    NR.presence({q:arr}).catch(()=>{});
    clearTimeout(cleanT);if(q.some(x=>!STATE[x.t]))cleanT=setTimeout(flush,1000);
  };
  const viaPresence=(t,d)=>{
    const p=me();deliver(t,{data:JSON.parse(JSON.stringify(d==null?null:d)),peer:p,isMe:true,sameTab:true});
    seq++;if(STATE[t])q=q.filter(x=>x.t!==t);q.push({s:seq,t,d,x:Date.now()+4000});flush();
  };
  NR.onPeers(ch=>{
    ch.left.forEach(p=>{delete seen[p.peer];});
    [...ch.joined,...ch.updated].forEach(p=>{
      if(p.sameTab)return;const arr=p.presence&&p.presence.q;if(!Array.isArray(arr))return;
      let last=seen[p.peer]||0;
      arr.filter(a=>Array.isArray(a)&&typeof a[0]==='number'&&typeof a[1]==='string').sort((a,b)=>a[0]-b[0]).forEach(a=>{
        if(a[0]<=last)return;last=a[0];deliver(a[1],{data:a[2],peer:p.peer,by:p.by,isMe:p.isMe,sameTab:false,guest:p.guest});});
      seen[p.peer]=last;
    });
  });
  return{
    get small(){return mode==='pr';},
    emit(t,d){
      if(mode==='pr'){viaPresence(t,d);return Promise.resolve();}
      return NR.emit(t,d).catch(e=>{if(e&&e.code==='not_permitted'){mode='pr';viaPresence(t,d);}});
    },
    on(t,h){(hs[t]=hs[t]||[]).push(h);return NR.on(t,h);},
    onPeers:h=>NR.onPeers(h),
    leave(){clearTimeout(cleanT);return NR.leave();}
  };
}
async function joinRoom(code,role){
  if(IN_CLAUDE){for(let i=0;i<30&&!ROOM;i++)await new Promise(r=>setTimeout(r,100));
    if(!ROOM)throw {code:'room'};return claudeRoom(await ROOM.join('md-'+code));}
  return peerJoin(code,role);
}

function offerCards(){
  if(S.remote||S.over)return;
  let three;
  if(S.offer)three=S.offer.map(id=>CARDS.find(c=>c.id===id));// reabre a mesma escolha (ex.: depois do menu de pausa)
  else{const pool=CARDS.filter(c=>!(c.once&&S.cards.includes(c.id))&&(!c.ok||c.ok()));
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    three=pool.slice(0,3);if(!three.length)return;S.offer=three.map(c=>c.id);sfx('horn');}
  if(S.coop)S.paused=true;
  showModal(`<h2>${tr('O povo vem ajudar','The townsfolk lend a hand')}</h2><p class="small">${tr(`Vaga ${S.wave} repelida. Escolhe uma bênção… ou arrisca um pacto.`,`Wave ${S.wave} repelled. Pick a blessing… or risk a pact.`)}</p>
    <div class="cards">${three.map(c=>`<button class="bcard${c.k==='p'?' pacto':''}" data-c="${c.id}"><span class="ci">${ic(c.ic)}</span><em>${c.k==='p'?tr('Pacto','Pact'):tr('Bênção','Blessing')}</em><b>${c.name}</b><small>${c.desc}</small></button>`).join('')}</div>`,[]);
  $('mcard').querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{audio();closeModal();act({a:'card',id:b.dataset.c});}));
}

async function showBoard(lvl,back){
  const tabs=LEVEL_ORDER.map(id=>`<button data-b="${id}" aria-pressed="${id===lvl}">${LEVELS[id].name}</button>`).join('');
  showModal(`<h2>${tr('Recordes','Leaderboard')}</h2><div class="seg">${tabs}</div><div id="board"><p class="small">${tr('A carregar…','Loading…')}</p></div>`,[{label:tr('Voltar','Back'),main:true,keep:true,fn:back}]);
  $('mcard').querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>showBoard(b.dataset.b,back)));
  const box=$('board');const mine=bestTxt(lvl);
  let html=`<p>${tr('O teu melhor aqui','Your best here')}: ${mine}.</p>`;
  if(!DB){box.innerHTML=html+tr(`<p class="small">A tabela partilhada só aparece quando o jogo está aberto no claude.ai. Partilha o link do artefacto com colegas para competirem.</p>`,`<p class="small">The shared leaderboard only appears when the game is open on claude.ai. Share the artifact link with friends to compete.</p>`);return;}
  try{
    const snap=await DB.collection('scores').orderBy('s_'+lvl,'desc').limit(15).get();
    const rows=snap.docs.map(d=>({id:d.id,sc:(d.data()||{})['s_'+lvl]})).filter(r=>typeof r.sc==='number').slice(0,10);
    if(!rows.length){box.innerHTML=html+tr('<p class="small">Ninguém defendeu esta praça ainda. Sê o primeiro.</p>','<p class="small">Nobody has defended this fortress yet. Be the first.</p>');return;}
    const ps=USER?await USER.profiles(rows.map(r=>r.id)):{};
    box.innerHTML=html+tr('<table><tr><th>#</th><th>Defensor</th><th>Resultado</th></tr></table>','<table><tr><th>#</th><th>Defender</th><th>Result</th></tr></table>');
    const tb=box.querySelector('table');
    rows.forEach((r,i)=>{const row=document.createElement('tr');const nm=(ps[r.id]&&ps[r.id].name)||tr('Defensor anónimo','Anonymous defender');
      [String(i+1),nm+(r.id===UID?tr(' (tu)',' (you)'):''),scoreTxt(r.sc)].forEach(v=>{const td=document.createElement('td');td.textContent=v;row.appendChild(td);});tb.appendChild(row);});
    if(!UID)box.insertAdjacentHTML('beforeend',tr('<p class="small">Entra na tua conta para o teu resultado aparecer aqui.</p>','<p class="small">Log in for your score to appear here.</p>'));
  }catch(e){box.innerHTML=html+tr('<p class="small">Não foi possível carregar a tabela partilhada agora.</p>','<p class="small">Couldn’t load the shared leaderboard right now.</p>');}
}
function endGame(win){
  S.over=true;S.paused=false;
  if(S.coop&&NET.role==='host'){
    const d={win:!!win,wave:S.wave,lives:S.lives,kills:S.stats.kills,gold:S.stats.gold,time:Math.round(S.stats.time)};
    [0,600,1500].forEach(ms=>setTimeout(()=>{if(NET.R)NET.R.emit('end',d).catch(()=>{});},ms));
    if(win)unlock('amigos');
  }
  if(!S.coop){const wave=win?S.wave:Math.max(0,S.wave-(S.infinite?0:1));submitScore(S.lvl,S.infinite?S.wave:(win?MAXW:wave),S.di);clearSave();}
  if(win){
    sfx('win');setTimeout(()=>say(tr('Conseguiste! Viva Portugal!','You did it! Long live Portugal!'),'pt-PT',true),700);
    if(S.lives===S.startLives)unlock('semtoalha');
    if(S.built.size===1&&S.built.has('cal'))unlock('soazeite');
    if(S.di===2)unlock('maispaco');
    const wins=LS.get('wins',{});wins[S.lvl]=1;LS.set('wins',wins);if(LEVEL_ORDER.every(k=>wins[k]))unlock('minho');
    if(S.campaign!=null&&!S.infinite){LS.set('camp',Math.max(campProg(),S.campaign+1));if(S.campaign>=3)unlock('campanha');}
  }else{sfx('lose');setTimeout(()=>say('¡Campeones, campeones!','es-ES',true),900);}
  if(win&&S.local)unlock('amigos');
  S.endWin=win;showEnd(win);
}

    lose:tr('Os castelhanos chegaram à torre de menagem na vaga {w}. Pior ainda: desceram o Cervo do monte e puseram-no numa rotunda em Goián. E nenhum barqueiro de Cerveira aceita ir buscá-lo.','The Castilians reached the keep on wave {w}. Worse still: they took the Stag down from the hill and put it on a roundabout in Goián. And no ferryman in Cerveira will go and fetch it.'),
    inf:tr('Cerveira aguentou mais {x} vagas. A Bienal já pensa fazer uma exposição só com os capacetes que ficaram no rio.','Cerveira held for {x} more waves. The Biennial is planning an exhibition of nothing but the helmets left in the river.')}
};
function showEnd(win){
  if(win&&!S.infinite)setTimeout(confetti,250);else if(!win)defeatFx(true);
  const st=S.stats,best=S.towers.slice().sort((a,b)=>(b.dmgDone||0)-(a.dmgDone||0))[0];
  const mm=Math.floor(st.time/60),ss=String(Math.floor(st.time%60)).padStart(2,'0');
  const stats=`<div class="stats-end">
    <span>${tr('Espanhóis despachados','Spaniards dispatched')}</span><span>${st.kills}</span>
    <span>${tr('Toalhas salvas','Towels saved')}</span><span>${st.kills*2}</span>
    <span>${tr('Ouro ganho','Gold earned')}</span><span>${st.gold} ${ic('coin')}</span>
    <span>${tr('Torre mais eficaz','Best tower')}</span><span>${best?ic(TYPES[best.k].icon)+' '+(best.lv>=3?TYPES[best.k].br[best.br].name:TYPES[best.k].name)+' ('+Math.round(best.dmgDone||0)+tr(' de dano)',' damage)'):tr('nenhuma, que vergonha','none, shame on you')}</span>
    <span>${S.hero.D.short}</span><span>${S.hero.kills} ${tr('derrotados, nível','defeated, level')} ${S.hero.lv}</span>${S.coop?(S.local?tr('<span>Modo</span><span>Mesmo ecrã</span>','<span>Mode</span><span>Same screen</span>'):tr('<span>Modo</span><span>Cooperativo</span>','<span>Mode</span><span>Co-op</span>')):''}
    <span>${tr('Maior matança','Best streak')}</span><span>${st.combo||0} ${tr('seguidos','in a row')}</span>
    ${S.cards.length?`<span>${tr('Bênçãos e pactos','Blessings & pacts')}</span><span>${S.cards.map(id=>{const c=CARDS.find(x=>x.id===id);return c?ic(c.ic):'';}).join(' ')}</span>`:''}
    <span>${tr('Sino tocado','Bell rung')}</span><span>${st.bells} ${tr('vezes','times')}</span>
    <span>${tr('Tempo de cerco','Siege time')}</span><span>${mm}:${ss}</span></div>`;
  const M=END_MSG[S.lvl];
  if(win&&!S.infinite){
    showModal(`<h2>${tr('Conseguiste! Fodeste os Espanhóis todos','You did it! You kicked every Spaniard’s arse')}</h2>${M.win.map(t=>'<p>'+t+'</p>').join('')}${stats}<p class="small">${tr(`Vidas restantes: ${S.lives}. Espanhóis que voltaram sem toalhas: todos.`,`Lives left: ${S.lives}. Spaniards who went home without towels: all of them.`)}</p>`,
      S.coop&&!S.local?[{label:'Menu',main:true,keep:true,fn:()=>{netLeave();showMenu();}}]:
      [...(S.campaign!=null?[S.campaign<3?{label:tr('Próximo capítulo ▶','Next chapter ▶'),main:true,keep:true,fn:()=>{menuSel.chap=S.campaign+1;showChapter(S.campaign+1);}}
          :{label:tr('Epílogo ▶','Epilogue ▶'),main:true,keep:true,fn:()=>showModal(tr('<h2>O Alto Minho está livre</h2><p>','<h2>The Alto Minho is free</h2><p>')+EPILOGO+'</p>',[{label:'Menu',main:true,keep:true,fn:showMenu}])}]:[]),
       {label:tr('Continuar em modo infinito','Keep going in endless mode'),main:S.campaign==null,fn:()=>{S.over=false;S.infinite=true;S.nextT=18;}},
       {label:tr('Outra vez, que isto soube bem','Again, that was fun'),fn:restartGame},
       {label:'Menu',keep:true,fn:showMenu}]);
  }else{
    const title=S.infinite?tr(`Aguentaste até à vaga ${S.wave}`,`You held out until wave ${S.wave}`):M.loseTitle;
    const txt=S.infinite?M.inf.replace('{x}',S.wave-MAXW):M.lose.replace('{w}',S.wave);
    showModal(`<h2>${title}</h2><p>${txt}</p>${stats}`,
      S.coop&&!S.local?[{label:'Menu',main:true,keep:true,fn:()=>{netLeave();showMenu();}}]:
      [{label:tr('Vingança!','Revenge!'),main:true,fn:restartGame},
       {label:tr('Recordes','Leaderboard'),keep:true,fn:()=>showBoard(S.lvl,()=>showEnd(win))},
       {label:'Menu',keep:true,fn:showMenu}]);
  }
}

/* ---- 11-ciclo.js ---- */
/* ================= Ciclo ================= */
function resize(){
  const st=$('stage'),bw=st.clientWidth-6,bh=st.clientHeight-6;
  scale=Math.max(0.2,Math.min(bw/W,bh/H));dpr=Math.min(window.devicePixelRatio||1,2.5);
  MX=Math.max(0,(bw/scale-W)/2);MY=Math.max(0,(bh/scale-H)/2);
  cv.style.width=Math.floor(bw)+'px';cv.style.height=Math.floor(bh)+'px';
  cv.width=Math.round(bw*dpr);cv.height=Math.round(bh*dpr);ovc.width=cv.width;ovc.height=cv.height;
  if(VIEW.z<=1.001){VIEW.z=1;VIEW.ox=-MX;VIEW.oy=-MY;}else clampView();
  if(cv.width*cv.height*BZ*BZ>24e6)BZ=1;
  drawBG();
}
// textos fixos do HTML no idioma escolhido
function applyStaticLang(){
  if(LANG!=='en')return;
  const T=(sel,txt)=>{const e=document.querySelector(sel);if(e)e.textContent=txt;};
  const A=(sel,at,txt)=>{const e=document.querySelector(sel);if(e)e.setAttribute(at,txt);};
  T('#stWave small','Wave');T('#stGold small','Gold');T('#gold2w small','Partner');T('#stLives small','Fortress');
  A('.wxs','title','Weather');A('#gold2w','title','Partner’s gold');A('#stLives','title','Fortress lives');
  T('#bWaveT','Call wave');A('#bSpeed','aria-label','Speed');A('#bPause','aria-label','Pause');A('#bSound','aria-label','Sound');
  A('#zoomb [data-z="in"]','aria-label','Zoom in');A('#zoomb [data-z="out"]','aria-label','Zoom out');A('#zoomb [data-z="reset"]','aria-label','Show whole map');
  T('[data-ab="rain"] .an','Arrows');T('[data-ab="gate"] .an','Gates');T('[data-ab="bell"] .an','Bell');T('#heroNm','Heroine');A('#cardsHud','title','Blessings & pacts');A('#abil','aria-label','Powers');A('#abilT','aria-label','Powers');
}
applyStaticLang();
new ResizeObserver(resize).observe($('stage'));
applyOpt();
newGame(menuSel.lvl in LEVELS?menuSel.lvl:'valenca',menuSel.di,menuSel.hero in HEROES?menuSel.hero:'padeira');
resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>drawBG());
let prev=performance.now(),shaking=false;
const calm=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
// tremor, clarão e pancada no coração decaem em tempo real (continuam durante o congelamento de impacto)
function juice(dt){
  S.shake=Math.max(0,S.shake-dt*24);S.flash=Math.max(0,S.flash-dt*1.3);S.heartHit=Math.max(0,S.heartHit-dt);
  const a=calm.matches?0:Math.min(14,S.shake)*scale*VIEW.z*0.7;
  if(a>0.25){cv.style.transform=`translate(${((Math.random()*2-1)*a).toFixed(1)}px,${((Math.random()*2-1)*a).toFixed(1)}px)`;shaking=true;}
  else if(shaking){cv.style.transform='';shaking=false;}
}
function loop(now){
  const dt=Math.min(0.05,(now-prev)/1000);prev=now;
  if(S&&S.offer&&!S.remote&&!S.over&&$('modal').hidden)offerCards();
  if(S&&S.remote){if(!S.over)guestTick(dt);}
  else if(S&&S.started&&!S.paused&&!S.over&&($('modal').hidden||S.coop)){
    if(S.stop>0)S.stop-=dt;// congelamento de impacto
    else{let t=dt*S.speed;while(t>0){const st=Math.min(0.02,t);update(st);t-=st;if(S.over||S.stop>0)break;}}}
  if(S)juice(dt);
  if(S&&S.coop&&!S.remote)netSend(now);
  hud();draw();requestAnimationFrame(loop);
}
showBoot(showMenu);requestAnimationFrame(loop);

})();
</script>
